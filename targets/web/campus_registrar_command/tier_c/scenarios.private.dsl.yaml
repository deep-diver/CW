dsl_version: "3.0.0"
visibility: private
tier_weights:
  smoke: 1
  core: 2
  validation: 3
  upload: 4
  permission: 4
  service: 4
  persistence: 5
  journey: 6

x-fixtures:
  nova_transfer_input: &nova_transfer_input
    file:
      name: nova-transfer-private.csv
      mime_type: text/csv
      content: |
        id,course,credits,residency,status
        TR-CAP,DSX 498,4,4,accepted
        TR-ETH,PHIL 340,3,0,accepted
        TR-RES,RES 200,2,2,review
    rows:
      - {id: TR-CAP, course: DSX 498, credits: 4, residency: 4, status: accepted}
      - {id: TR-ETH, course: PHIL 340, credits: 3, residency: 0, status: accepted}
      - {id: TR-RES, course: RES 200, credits: 2, residency: 2, status: review}
  corrected_reconciliation_input: &corrected_reconciliation_input
    file:
      name: corrected-private-worksheet.csv
      mime_type: text/csv
      content: |
        id,requirement,manifest_status,registrar_status,status
        RC-CAP,REQ-CAPSTONE,met,met,match
        RC-RES,REQ-RESIDENCY,met,met,match
        RC-ETH,REQ-ETHICS,met,met,match
    rows:
      - {id: RC-CAP, requirement: REQ-CAPSTONE, manifest_status: met, registrar_status: met, status: match}
      - {id: RC-RES, requirement: REQ-RESIDENCY, manifest_status: met, registrar_status: met, status: match}
      - {id: RC-ETH, requirement: REQ-ETHICS, manifest_status: met, registrar_status: met, status: match}

scenarios:
  - id: private_01_select_orion_from_filtered_queue
    tier: smoke
    difficulty: C
    steps:
      - do: reset_button.click
      - do: filter_clearance_risk_button.click
      - table: candidate_queue
        expect_order: [CAND-NOVA, CAND-ORION, CAND-LENA]
        expect_row_count: 3
        expect_rows:
          - id: CAND-ORION
            cells:
              name: Orion Patel
              program: Architecture BA
              risk: amber
              aid: clear
      - do: select_orion_button.click
        expect:
          - {op: equals, path: selected_candidate_id, value: CAND-ORION}
          - {op: equals, path: selected_candidate_name, value: "Orion Patel"}
          - {op: equals, path: selected_program, value: "Architecture BA"}
          - {op: equals, path: selected_aid_status, value: clear}
          - {op: equals, path: current_page, value: audit}

  - id: private_02_browser_back_forward_chain_preserves_candidate
    tier: persistence
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_nova_button.click
      - do: go_articulation_button.click
      - do: go_reconcile_button.click
      - do: go_clearance_button.click
      - browser: back
        expect_page: reconcile
        expect:
          - {op: equals, path: current_page, value: reconcile}
          - {op: equals, path: selected_candidate_id, value: CAND-NOVA}
      - browser: back
        expect_page: articulation
        expect:
          - {op: equals, path: current_page, value: articulation}
          - {op: equals, path: selected_candidate_name, value: "Nova Chen"}
      - browser: forward
        expect_page: reconcile
        expect:
          - {op: equals, path: current_page, value: reconcile}

  - id: private_03_catalog_lock_requires_registrar_but_preserves_denial
    tier: permission
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_nova_button.click
      - do: catalog_version_input.fill
        input: {value: " cat-2026a "}
      - do: lock_catalog_button.click
        mode: unauthorized
        expect:
          - {op: equals, path: denied_count, value: 1}
          - {op: equals, path: catalog_lock_status, value: draft}
          - {op: equals, path: last_action, value: unauthorized_registrar}
      - do: role_registrar_button.click
      - do: lock_catalog_button.click
        expect:
          - {op: equals, path: catalog_lock_status, value: locked}
          - {op: equals, path: denied_count, value: 1}
          - {op: equals, path: last_action, value: lock_catalog}

  - id: private_04_validation_errors_are_object_fields
    tier: validation
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_nova_button.click
      - do: catalog_version_input.fill
        input: {value: "CAT-2026B"}
      - do: role_registrar_button.click
      - do: lock_catalog_button.click
        mode: rejected
        expect:
          - {op: equals, path: validation_errors, value: {catalog: "Catalog version mismatch"}}
      - do: go_articulation_button.click
      - do: transfer_upload_input.upload
        input: *nova_transfer_input
      - do: role_advisor_button.click
      - do: stage_equivalencies_button.click
      - do: finalize_equivalencies_button.click
        mode: rejected
        expect:
          - {op: equals, path: validation_errors, value: {catalog: "Catalog version mismatch", equivalency: "Catalog lock required"}}
          - {op: equals, path: equivalency_status, value: blocked}
      - do: go_audit_button.click
      - do: catalog_version_input.fill
        input: {value: " CAT-2026A "}
      - do: role_registrar_button.click
      - do: lock_catalog_button.click
        expect:
          - {op: equals, path: validation_errors, value: {equivalency: "Catalog lock required"}}
      - do: go_articulation_button.click
      - do: role_advisor_button.click
      - do: stage_equivalencies_button.click
      - do: finalize_equivalencies_button.click
        expect:
          - {op: equals, path: validation_errors, value: {}}
          - {op: equals, path: equivalency_status, value: locked}

  - id: private_05_transfer_reupload_replaces_rows_and_resets_equivalencies
    tier: upload
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_nova_button.click
      - do: go_articulation_button.click
      - do: transfer_upload_input.upload
        input:
          file:
            name: first-transfer.csv
            mime_type: text/csv
            content: |
              id,course,credits,residency,status
              TR-A,DSX 498,4,4,accepted
              TR-B,PHIL 340,3,0,accepted
          rows:
            - {id: TR-A, course: DSX 498, credits: 4, residency: 4, status: accepted}
            - {id: TR-B, course: PHIL 340, credits: 3, residency: 0, status: accepted}
      - do: role_advisor_button.click
      - do: stage_equivalencies_button.click
        expect:
          - {op: equals, path: equivalency_status, value: staged}
          - {op: equals, path: equivalency_count, value: 3}
      - do: transfer_upload_input.upload
        input:
          file:
            name: replacement-transfer.csv
            mime_type: text/csv
            content: |
              id,course,credits,residency,status
              TR-NEW,RES 299,5,5,review
          rows:
            - {id: TR-NEW, course: RES 299, credits: 5, residency: 5, status: review}
        expect:
          - {op: equals, path: transfer_count, value: 1}
          - {op: equals, path: transfer_credit_total, value: 5}
          - {op: equals, path: last_transfer_file, value: replacement-transfer.csv}
          - {op: equals, path: equivalency_status, value: idle}
          - {op: equals, path: equivalency_count, value: 0}
      - table: transfer_grid
        expect_order: [TR-NEW]
        expect_row_count: 1

  - id: private_06_exception_packet_waits_for_resolved_schedule
    tier: validation
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_nova_button.click
      - do: run_degree_audit_button.click
      - do: catalog_version_input.fill
        input: {value: CAT-2026A}
      - do: role_registrar_button.click
      - do: lock_catalog_button.click
      - do: go_articulation_button.click
      - do: transfer_upload_input.upload
        input: *nova_transfer_input
      - do: role_advisor_button.click
      - do: stage_equivalencies_button.click
      - do: finalize_equivalencies_button.click
      - do: assemble_exception_packet_button.click
        mode: rejected
        expect:
          - {op: equals, path: exception_packet_status, value: blocked}
          - {op: equals, path: exception_count, value: 0}
          - {op: equals, path: validation_errors, value: {packet: "Resolved schedule required"}}
          - {op: equals, path: readiness_score, value: 58}
          - {op: equals, path: last_action, value: packet_requires_schedule}
      - do: go_audit_button.click
      - do: plan_completion_button.click
      - do: resolve_schedule_button.click
      - do: go_articulation_button.click
      - do: role_advisor_button.click
      - do: assemble_exception_packet_button.click
        expect:
          - {op: equals, path: exception_packet_status, value: assembled}
          - {op: equals, path: exception_count, value: 2}
          - {op: equals, path: readiness_score, value: 68}

  - id: private_07_bursar_success_clears_prior_finance_error
    tier: service
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_nova_button.click
      - do: go_reconcile_button.click
      - do: role_bursar_button.click
      - do: run_bursar_clearance_button.click
        mode: rejected
        expect:
          - {op: equals, path: finance_status, value: blocked}
          - {op: equals, path: validation_errors, value: {finance: "Exception packet required"}}
      - do: go_audit_button.click
      - do: run_degree_audit_button.click
      - do: plan_completion_button.click
      - do: resolve_schedule_button.click
      - do: catalog_version_input.fill
        input: {value: CAT-2026A}
      - do: role_registrar_button.click
      - do: lock_catalog_button.click
      - do: go_articulation_button.click
      - do: transfer_upload_input.upload
        input: *nova_transfer_input
      - do: role_advisor_button.click
      - do: stage_equivalencies_button.click
      - do: finalize_equivalencies_button.click
      - do: assemble_exception_packet_button.click
      - do: go_reconcile_button.click
      - do: role_bursar_button.click
      - do: run_bursar_clearance_button.click
        expect:
          - {op: equals, path: finance_status, value: cleared}
          - {op: equals, path: finance_trace_id, value: BUR-NOVA-042}
          - {op: equals, path: service_call_count, value: 1}
          - {op: equals, path: bursar_call_count, value: 1}
          - {op: equals, path: validation_errors, value: {}}
      - do: run_bursar_clearance_button.click
        expect:
          - {op: equals, path: service_call_count, value: 2}
          - {op: equals, path: bursar_call_count, value: 2}
          - {op: equals, path: finance_trace_id, value: BUR-NOVA-042}
          - {op: equals, path: readiness_score, value: 74}

  - id: private_08_reconciliation_counts_multiple_mismatches
    tier: upload
    difficulty: C
    steps:
      - do: reset_button.click
      - do: go_reconcile_button.click
      - do: reconciliation_upload_input.upload
        input:
          file:
            name: double-mismatch.csv
            mime_type: text/csv
            content: |
              id,requirement,manifest_status,registrar_status,status
              RC-CAP,REQ-CAPSTONE,met,missing,mismatch
              RC-RES,REQ-RESIDENCY,met,short,mismatch
              RC-ETH,REQ-ETHICS,met,met,match
              RC-GPA,REQ-GPA,met,met,match
          rows:
            - {id: RC-CAP, requirement: REQ-CAPSTONE, manifest_status: met, registrar_status: missing, status: mismatch}
            - {id: RC-RES, requirement: REQ-RESIDENCY, manifest_status: met, registrar_status: short, status: mismatch}
            - {id: RC-ETH, requirement: REQ-ETHICS, manifest_status: met, registrar_status: met, status: match}
            - {id: RC-GPA, requirement: REQ-GPA, manifest_status: met, registrar_status: met, status: match}
        expect:
          - {op: equals, path: reconciliation_count, value: 4}
          - {op: equals, path: mismatch_count, value: 2}
          - {op: equals, path: reconciliation_status, value: uploaded}
      - table: reconciliation_grid
        expect_order: [RC-CAP, RC-RES, RC-ETH, RC-GPA]
        expect_row_count: 4
        expect_rows:
          - id: RC-CAP
            cells:
              registrar_status: missing
              status: mismatch
      - do: role_registrar_button.click
      - do: lock_reconciliation_button.click
        mode: rejected
        expect:
          - {op: equals, path: reconciliation_status, value: blocked}
          - {op: equals, path: validation_errors, value: {reconciliation: "Resolve worksheet mismatches"}}

  - id: private_09_reconciliation_lock_requires_registrar
    tier: permission
    difficulty: C
    steps:
      - do: reset_button.click
      - do: go_reconcile_button.click
      - do: reconciliation_upload_input.upload
        input: *corrected_reconciliation_input
      - do: role_bursar_button.click
      - do: lock_reconciliation_button.click
        mode: unauthorized
        expect:
          - {op: equals, path: denied_count, value: 1}
          - {op: equals, path: reconciliation_status, value: uploaded}
          - {op: equals, path: last_action, value: unauthorized_registrar}
      - do: role_registrar_button.click
      - do: lock_reconciliation_button.click
        expect:
          - {op: equals, path: reconciliation_status, value: locked}
          - {op: equals, path: readiness_score, value: 82}
          - {op: equals, path: denied_count, value: 1}

  - id: private_10_dean_vote_is_noop_before_required_gates
    tier: validation
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_nova_button.click
      - do: go_clearance_button.click
      - do: role_dean_button.click
      - do: dean_vote_button.click
        mode: rejected
        expect:
          - {op: equals, path: dean_vote_status, value: blocked}
          - {op: equals, path: audit_count, value: 0}
          - {op: equals, path: validation_errors, value: {dean: "Finance, packet, and reconciliation gates required"}}
          - {op: equals, path: readiness_score, value: 0}
          - {op: equals, path: release_count, value: 0}
          - {op: equals, path: last_action, value: dean_requires_clearance_gates}

  - id: private_11_registrar_seal_waits_for_dean_after_all_other_gates
    tier: journey
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_nova_button.click
      - do: run_degree_audit_button.click
      - do: plan_completion_button.click
      - do: resolve_schedule_button.click
      - do: catalog_version_input.fill
        input: {value: CAT-2026A}
      - do: role_registrar_button.click
      - do: lock_catalog_button.click
      - do: go_articulation_button.click
      - do: transfer_upload_input.upload
        input: *nova_transfer_input
      - do: role_advisor_button.click
      - do: stage_equivalencies_button.click
      - do: finalize_equivalencies_button.click
      - do: assemble_exception_packet_button.click
      - do: go_reconcile_button.click
      - do: role_bursar_button.click
      - do: run_bursar_clearance_button.click
      - do: reconciliation_upload_input.upload
        input: *corrected_reconciliation_input
      - do: role_registrar_button.click
      - do: lock_reconciliation_button.click
      - do: go_clearance_button.click
      - do: registrar_seal_button.click
        mode: rejected
        expect:
          - {op: equals, path: registrar_seal_status, value: blocked}
          - {op: equals, path: open_blockers, value: 8}
          - {op: equals, path: readiness_score, value: 82}
          - {op: equals, path: last_action, value: seal_requires_dean}
      - do: role_dean_button.click
      - do: dean_vote_button.click
        expect:
          - {op: equals, path: dean_vote_status, value: approved}
          - {op: equals, path: dean_packet_hash, value: DEAN-CAND-NOVA-RC3-B1}
      - do: role_registrar_button.click
      - do: registrar_seal_button.click
        expect:
          - {op: equals, path: registrar_seal_status, value: sealed}
          - {op: equals, path: seal_manifest_hash, value: SEAL-CAND-NOVA-DEAN-CAND-NOVA-RC3-B1}
          - {op: equals, path: open_blockers, value: 0}
          - {op: equals, path: readiness_score, value: 100}
      - table: blocker_grid
        expect_order: [BLK-CATALOG, BLK-SCHEDULE, BLK-EQUIV, BLK-EXCEPTION, BLK-FINANCE, BLK-RECON, BLK-DEAN, BLK-SEAL]
        expect_row_count: 8
        expect_rows:
          - id: BLK-SEAL
            cells:
              status: cleared

  - id: private_12_publish_release_requires_registrar_even_after_seal
    tier: permission
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_nova_button.click
      - do: run_degree_audit_button.click
      - do: plan_completion_button.click
      - do: resolve_schedule_button.click
      - do: catalog_version_input.fill
        input: {value: CAT-2026A}
      - do: role_registrar_button.click
      - do: lock_catalog_button.click
      - do: go_articulation_button.click
      - do: transfer_upload_input.upload
        input: *nova_transfer_input
      - do: role_advisor_button.click
      - do: stage_equivalencies_button.click
      - do: finalize_equivalencies_button.click
      - do: assemble_exception_packet_button.click
      - do: go_reconcile_button.click
      - do: role_bursar_button.click
      - do: run_bursar_clearance_button.click
      - do: reconciliation_upload_input.upload
        input: *corrected_reconciliation_input
      - do: role_registrar_button.click
      - do: lock_reconciliation_button.click
      - do: go_clearance_button.click
      - do: role_dean_button.click
      - do: dean_vote_button.click
      - do: role_registrar_button.click
      - do: registrar_seal_button.click
      - do: role_dean_button.click
      - do: publish_release_button.click
        mode: unauthorized
        expect:
          - {op: equals, path: denied_count, value: 1}
          - {op: equals, path: release_status, value: idle}
          - {op: equals, path: last_action, value: unauthorized_registrar}
      - do: role_registrar_button.click
      - do: publish_release_button.click
        expect:
          - {op: equals, path: release_status, value: published}
          - {op: equals, path: release_count, value: 2}
          - {op: equals, path: audit_count, value: 3}
      - table: release_grid
        expect_order: [REL-NOVA-COMM, REL-NOVA-ARCHIVE]
        expect_rows:
          - id: REL-NOVA-ARCHIVE
            cells:
              channel: transcript_archive
              status: queued

  - id: private_13_reload_preserves_midworkflow_articulation_state
    tier: persistence
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_nova_button.click
      - do: run_degree_audit_button.click
      - do: plan_completion_button.click
      - do: resolve_schedule_button.click
      - do: catalog_version_input.fill
        input: {value: CAT-2026A}
      - do: role_registrar_button.click
      - do: lock_catalog_button.click
      - do: go_articulation_button.click
      - do: transfer_upload_input.upload
        input: *nova_transfer_input
      - do: role_advisor_button.click
      - do: stage_equivalencies_button.click
      - browser: reload
        expect_page: articulation
        expect:
          - {op: equals, path: current_page, value: articulation}
          - {op: equals, path: active_role, value: advisor}
          - {op: equals, path: selected_candidate_id, value: CAND-NOVA}
          - {op: equals, path: transfer_count, value: 3}
          - {op: equals, path: equivalency_status, value: staged}
          - {op: equals, path: readiness_score, value: 42}
      - table: equivalency_grid
        expect_order: [EQ-CAPSTONE, EQ-ETHICS, EQ-RESIDENCY]
        expect_row_count: 3

  - id: private_14_role_persists_across_reload_on_clearance_page
    tier: persistence
    difficulty: C
    steps:
      - do: reset_button.click
      - do: role_dean_button.click
      - do: go_clearance_button.click
      - browser: reload
        expect_page: clearance
        expect:
          - {op: equals, path: current_page, value: clearance}
          - {op: equals, path: active_role, value: dean}

  - id: private_15_reset_clears_all_complex_state
    tier: journey
    difficulty: C
    steps:
      - do: reset_button.click
      - do: filter_clearance_risk_button.click
      - do: select_nova_button.click
      - do: run_degree_audit_button.click
      - do: plan_completion_button.click
      - do: go_articulation_button.click
      - do: transfer_upload_input.upload
        input: *nova_transfer_input
      - do: role_advisor_button.click
      - do: stage_equivalencies_button.click
      - do: reset_button.click
        expect:
          - {op: equals, path: current_page, value: command}
          - {op: equals, path: active_role, value: analyst}
          - {op: equals, path: current_filter, value: all}
          - {op: equals, path: selected_candidate_id, value: ""}
          - {op: equals, path: catalog_lock_status, value: draft}
          - {op: equals, path: audit_status, value: idle}
          - {op: equals, path: schedule_status, value: idle}
          - {op: equals, path: transfer_count, value: 0}
          - {op: equals, path: equivalency_status, value: idle}
          - {op: equals, path: exception_packet_status, value: idle}
          - {op: equals, path: finance_status, value: idle}
          - {op: equals, path: reconciliation_status, value: idle}
          - {op: equals, path: release_status, value: idle}
          - {op: equals, path: open_blockers, value: 8}
          - {op: equals, path: readiness_score, value: 0}
          - {op: equals, path: validation_errors, value: {}}

  - id: private_16_transfer_reupload_after_locked_equivalencies_reopens_staging
    tier: upload
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_nova_button.click
      - do: catalog_version_input.fill
        input: {value: CAT-2026A}
      - do: role_registrar_button.click
      - do: lock_catalog_button.click
      - do: go_articulation_button.click
      - do: transfer_upload_input.upload
        input: *nova_transfer_input
      - do: role_advisor_button.click
      - do: stage_equivalencies_button.click
      - do: finalize_equivalencies_button.click
        expect:
          - {op: equals, path: equivalency_status, value: locked}
          - {op: equals, path: audit_status, value: satisfied}
      - do: transfer_upload_input.upload
        input:
          file:
            name: post-lock-transfer.csv
            mime_type: text/csv
            content: |
              id,course,credits,residency,status
              TR-POST,STAT 210,6,3,accepted
          rows:
            - {id: TR-POST, course: STAT 210, credits: 6, residency: 3, status: accepted}
        expect:
          - {op: equals, path: transfer_count, value: 1}
          - {op: equals, path: transfer_credit_total, value: 6}
          - {op: equals, path: equivalency_status, value: idle}
          - {op: equals, path: equivalency_count, value: 0}
          - {op: equals, path: last_transfer_file, value: post-lock-transfer.csv}

  - id: private_17_full_journey_with_four_transfer_rows
    tier: journey
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_nova_button.click
      - do: run_degree_audit_button.click
      - do: plan_completion_button.click
      - do: resolve_schedule_button.click
      - do: catalog_version_input.fill
        input: {value: CAT-2026A}
      - do: role_registrar_button.click
      - do: lock_catalog_button.click
      - do: go_articulation_button.click
      - do: transfer_upload_input.upload
        input:
          file:
            name: four-row-transfer.csv
            mime_type: text/csv
            content: |
              id,course,credits,residency,status
              TR-CAP,DSX 498,4,4,accepted
              TR-ETH,PHIL 340,3,0,accepted
              TR-RES,RES 200,2,2,review
