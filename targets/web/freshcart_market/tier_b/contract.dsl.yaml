          - {op: equals, path: last_action, value: edit_phone}

  place_order_button:
    kind: button
    selector: '[data-testid="place-order"]'
    page: checkout
    actions:
      click:
        preconditions:
          - {op: relation, path: cart_subtotal, operator: ">=", value: 15000}
          - {op: relation, path: cart_count, operator: ">=", value: 1}
          - {op: relation, path: customer_name, operator: "!=", value: ""}
          - {op: one_of, path: delivery_slot, values: [morning, afternoon, evening]}
        rejected_when:
          - {op: relation, path: cart_subtotal, operator: "<", value: 15000}
        rejected_effects:
          - {op: equals, path: order_placed, value: false}
          - {op: updated_object_fields, path: validation_errors, updates: {minimum_order: "Minimum order 15000"}}
          - {op: equals, path: last_action, value: reject_minimum}
        effects:
          - {op: equals, path: order_placed, value: true}
          - {op: one_of, path: order_id, values: ["ORD-001", "ORD-002", "ORD-003", "ORD-004", "ORD-005"]}
          - {op: appended_object, path: order_audit, value: {id: {after_path: audit_count}, event: placed, role: {from_path: active_role}, subtotal: {from_path: cart_subtotal}}}
          - *derive_audit_count
          - {op: equals, path: last_action, value: place_order}

