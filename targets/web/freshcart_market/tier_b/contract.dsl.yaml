    actions:
      click:
        allowed_roles: [staff]
        preconditions:
          - {op: equals, path: order_placed, value: true}
        effects:
          - {op: equals, path: last_action, value: cancel_order}
          - {op: appended_object, path: order_audit, value: {id: {after_path: audit_count}, event: cancelled, role: {from_path: active_role}, order: {from_path: order_id}}}
          - *derive_audit_count
        unauthorized_effects:
          - {op: unchanged, path: order_audit}
          - {op: equals, path: last_action, value: unauthorized}
