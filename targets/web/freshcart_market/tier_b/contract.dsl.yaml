dsl_version: "3.0.0"

app:
  id: greencart_premium
  name: GreenCart Premium
  capability: gourmet_food_marketplace

x-derived:
  derive_cart_count: &derive_cart_count
    op: equals_length
    path: cart_count
    source_path: cart_items
  derive_cart_subtotal: &derive_cart_subtotal
    op: equals_sum
    path: cart_subtotal
    source_path: cart_items
    field: line_total
  derive_greenfarm_count: &derive_greenfarm_count
    op: equals_count_where
    path: greenfarm_count
    source_path: cart_items
    where:
      - {op: equals, field: vendor, value: GreenFarm}
  derive_oceancatch_count: &derive_oceancatch_count
    op: equals_count_where
    path: oceancatch_count
    source_path: cart_items
    where:
      - {op: equals, field: vendor, value: OceanCatch}
  derive_delivery_fee: &derive_delivery_fee
    op: equals_piecewise_linear
    path: delivery_fee
    cases:
      - when: [{op: relation, path: cart_subtotal, operator: ">=", value: 50000}]
        formula: {constant: 0}
      - when: [{op: relation, path: cart_subtotal, operator: ">=", value: 30000}]
        formula: {constant: 1000}
      - when: [{op: relation, path: cart_subtotal, operator: ">=", value: 15000}]
        formula: {constant: 2500}
    default: {constant: 3000}
  derive_order_total: &derive_order_total
    op: equals_linear
    path: order_total
    terms:
      - {path: cart_subtotal}
      - {path: delivery_fee}
      - {path: express_surcharge}
      - {path: gift_wrap_fee}
      - {path: coupon_credit, multiplier: -1}
      - {path: loyalty_credit, multiplier: -1}
  derive_service_call_count: &derive_service_call_count
    op: equals_length
    path: service_call_count
    source_path: __services.calls
  derive_coupon_call_count: &derive_coupon_call_count
    op: equals_count_where
    path: coupon_call_count
    source_path: __services.calls
    where:
      - {op: equals, field: service, value: coupon_validate}
  derive_loyalty_call_count: &derive_loyalty_call_count
    op: equals_count_where
    path: loyalty_call_count
    source_path: __services.calls
    where:
      - {op: equals, field: service, value: loyalty_redeem}
  derive_audit_count: &derive_audit_count
    op: equals_length
    path: audit_count
    source_path: order_audit

runtime:
  target: web
  start_url: /#/market

  state_probe:
    kind: javascript
    expression: window.__DETOX_STATE__

  pages:
    market:
      path: /#/market
      purpose: Vendor-based product catalog with add-to-basket actions.
    basket:
      path: /#/basket
      purpose: Basket review with preparation options and item removal.
    checkout:
      path: /#/checkout
      purpose: Coupon, loyalty, delivery slot, express/gift-wrap, and payment.
    orders:
      path: /#/orders
      purpose: Order history, fulfillment checklist, staff operations.

  session:
    role_path: active_role
    roles: [customer, staff]

  persistence:
    reload:
      scope: local_storage
      paths:
        - current_page
        - active_role
        - products
        - current_vendor
        - visible_products
        - cart_items
        - cart_count
        - cart_subtotal
        - greenfarm_count
        - oceancatch_count
        - delivery_fee
        - order_total
        - express_enabled
        - express_surcharge
        - gift_wrap_enabled
        - gift_wrap_fee
        - coupon_code
        - coupon_credit
        - coupon_status
        - service_call_count
        - coupon_call_count
        - loyalty_points
        - loyalty_credit
        - loyalty_call_count
        - delivery_slot
        - customer_name
        - customer_phone
        - validation_errors
        - order_placed
        - order_id
        - order_history
        - fulfillment_verified
        - fulfillment_packed
        - fulfillment_dispatched
        - checklist_count
        - order_audit
        - audit_count
        - last_action

  services:
    coupon_validate:
      endpoint: /api/coupon
      method: GET
      responses:
        - id: green15
          match:
            query:
              code: GREEN15
          status: 200
          json:
            valid: true
            credit: 2000
            status: applied
        - id: welcome10
          match:
            query:
              code: WELCOME10
          status: 200
          json:
            valid: true
            credit: 4000
            status: applied
        - id: invalid
          match:
            query:
              code: BADCODE
          status: 200
          json:
            valid: false
            credit: 0
            status: rejected
    loyalty_redeem:
      endpoint: /api/loyalty
      method: GET
      responses:
        - id: redeem
          match:
            query:
              action: REDEEM
          status: 200
          json:
            points_used: 5000
            credit: 5000
            status: redeemed

  tables:
    product_grid:
      selector: '[data-testid="product-grid"]'
      row_selector: '[data-testid="product-row"]'
      row_id_attribute: data-product-id
      source_path: visible_products
      row_id_field: id
      columns:
        name:
          selector: '[data-col="name"]'
          state_field: name
        vendor:
          selector: '[data-col="vendor"]'
          state_field: vendor
        price:
          selector: '[data-col="price"]'
          state_field: price
        unit:
          selector: '[data-col="unit"]'
          state_field: unit
    basket_grid:
      selector: '[data-testid="basket-grid"]'
      row_selector: '[data-testid="basket-row"]'
      row_id_attribute: data-item-id
      source_path: cart_items
      row_id_field: product_id
      columns:
        name:
          selector: '[data-col="name"]'
          state_field: name
        quantity:
          selector: '[data-col="quantity"]'
          state_field: quantity
        unit_price:
          selector: '[data-col="unit-price"]'
          state_field: unit_price
        line_total:
          selector: '[data-col="line-total"]'
          state_field: line_total
        preparation:
          selector: '[data-col="preparation"]'
          state_field: preparation

