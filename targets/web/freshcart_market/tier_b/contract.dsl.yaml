  schema:
    current_page: {type: string, purpose: "Active route page."}
    active_role: {type: string, purpose: "Current user role: customer or staff."}
    products: {type: array, purpose: "Full product catalog."}
    current_vendor: {type: string, purpose: "Active vendor filter."}
    visible_products: {type: array, purpose: "Filtered product list."}
    cart_items: {type: array, purpose: "Items in basket with quantity and preparation."}
    cart_count: {type: number, purpose: "Derived: count of cart_items."}
    cart_subtotal: {type: number, purpose: "Derived: sum of cart_items.line_total."}
    greenfarm_count: {type: number, purpose: "Derived: GreenFarm items in cart."}
    oceancatch_count: {type: number, purpose: "Derived: OceanCatch items in cart."}
    delivery_fee: {type: number, purpose: "Derived: 4-tier piecewise by subtotal."}
    order_total: {type: number, purpose: "Derived: subtotal + fee + extras - discounts."}
    express_enabled: {type: boolean, purpose: "Express delivery toggle."}
    express_surcharge: {type: number, purpose: "Express surcharge: 2500 or 0."}
    gift_wrap_enabled: {type: boolean, purpose: "Gift wrap toggle."}
    gift_wrap_fee: {type: number, purpose: "Gift wrap fee: 1500 or 0."}
    coupon_code: {type: string, purpose: "Entered coupon code."}
    coupon_credit: {type: number, purpose: "Credit from applied coupon."}
    coupon_status: {type: string, purpose: "idle, applied, or rejected."}
    service_call_count: {type: number, purpose: "Derived: total service calls."}
    coupon_call_count: {type: number, purpose: "Derived: coupon service calls."}
    loyalty_points: {type: number, purpose: "Available loyalty points."}
    loyalty_credit: {type: number, purpose: "Credit from redeemed points."}
    loyalty_call_count: {type: number, purpose: "Derived: loyalty service calls."}
    delivery_slot: {type: string, purpose: "Selected delivery time slot."}
    customer_name: {type: string, purpose: "Customer name."}
    customer_phone: {type: string, purpose: "Customer phone."}
    validation_errors: {type: object, purpose: "Field-level validation errors."}
    order_placed: {type: boolean, purpose: "Whether current order placed."}
    order_id: {type: string, purpose: "ID of placed order."}
    order_history: {type: array, purpose: "Past orders."}
    fulfillment_verified: {type: boolean, purpose: "Agent: fulfillment verified."}
    fulfillment_packed: {type: boolean, purpose: "Agent: order packed."}
    fulfillment_dispatched: {type: boolean, purpose: "Agent: order dispatched."}
    checklist_count: {type: number, purpose: "Agent: completed checklist steps."}
    order_audit: {type: array, purpose: "Audit trail for order operations."}
    audit_count: {type: number, purpose: "Derived: count of audit records."}
    last_action: {type: string, purpose: "Last user action label."}
    __services.calls: {type: array, purpose: "Evaluator service call ledger."}

