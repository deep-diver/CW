        effects:
          - {op: changed_by, path: cart_count, by: 1}
          - {op: changed_by, path: cart_subtotal, by: 9800}
          - {op: appended_object, path: cart_items, value: {product_id: "FC-CKN-01", name: "Free-Range Chicken Breast", quantity: 1, unit_price: 9800, line_total: 9800}}
          - {op: equals_piecewise_linear, path: delivery_fee, cases: [{when: [{op: relation, path: cart_subtotal, operator: ">=", value: 40000}], formula: {constant: 0}}], default: {constant: 3000}}
