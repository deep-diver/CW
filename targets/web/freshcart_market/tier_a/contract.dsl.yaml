          - {op: appended_object, path: cart_items, value: {product_id: "FC-RCE-01", name: "Premium Short-Grain Rice", quantity: 1, unit_price: 11900, line_total: 11900}}
          - {op: equals_piecewise_linear, path: delivery_fee, cases: [{when: [{op: relation, path: cart_subtotal, operator: ">=", value: 40000}], formula: {constant: 0}}], default: {constant: 3000}}
          - {op: equals_linear, path: order_total, terms: [{path: cart_subtotal}, {path: delivery_fee}, {path: coupon_credit, multiplier: -1}]}
          - {op: equals, path: last_action, value: add_item}

  add_oil_button:
    kind: button
    selector: '[data-testid="add-FC-OLV-01"]'
    page: shop
    actions:
      click:
        effects:
          - {op: changed_by, path: cart_count, by: 1}
          - {op: changed_by, path: cart_subtotal, by: 8500}
          - {op: appended_object, path: cart_items, value: {product_id: "FC-OLV-01", name: "Extra Virgin Olive Oil", quantity: 1, unit_price: 8500, line_total: 8500}}
          - {op: equals_piecewise_linear, path: delivery_fee, cases: [{when: [{op: relation, path: cart_subtotal, operator: ">=", value: 40000}], formula: {constant: 0}}], default: {constant: 3000}}
          - {op: equals_linear, path: order_total, terms: [{path: cart_subtotal}, {path: delivery_fee}, {path: coupon_credit, multiplier: -1}]}
          - {op: equals, path: last_action, value: add_item}

  remove_last_item_button:
    kind: button
    selector: '[data-testid="remove-last-item"]'
    page: cart
    actions:
      click:
        preconditions:
          - {op: relation, path: cart_count, operator: ">=", value: 1}
        effects:
          - {op: changed_by, path: cart_count, by: -1}
          - {op: removed_object_fields, path: validation_errors, fields: [minimum_order]}
          - {op: equals, path: last_action, value: remove_item}

  coupon_code_input:
    kind: input
    selector: '[data-testid="coupon-code"]'
    page: cart
    actions:
      fill:
        effects:
          - {op: equals_normalized, path: coupon_code, value_from: input.value, normalizers: [trim, uppercase]}

  apply_coupon_button:
    kind: button
    selector: '[data-testid="apply-coupon"]'
    page: cart
    actions:
      click:
        preconditions:
          - {op: relation, path: cart_count, operator: ">=", value: 1}
        effects:
          - {op: changed_by, path: service_call_count, by: 1}
          - {op: one_of, path: coupon_status, values: [applied, rejected]}
          - {op: equals_linear, path: order_total, terms: [{path: cart_subtotal}, {path: delivery_fee}, {path: coupon_credit, multiplier: -1}]}
          - {op: equals, path: last_action, value: apply_coupon}

  slot_morning_button:
    kind: button
    selector: '[data-testid="slot-morning"]'
    page: cart
    actions:
      click:
        effects:
          - {op: equals, path: delivery_slot, value: morning}
          - {op: equals, path: last_action, value: select_slot}

  slot_afternoon_button:
    kind: button
    selector: '[data-testid="slot-afternoon"]'
    page: cart
    actions:
      click:
        effects:
          - {op: equals, path: delivery_slot, value: afternoon}
          - {op: equals, path: last_action, value: select_slot}

  slot_evening_button:
    kind: button
    selector: '[data-testid="slot-evening"]'
    page: cart
    actions:
      click:
        effects:
          - {op: equals, path: delivery_slot, value: evening}
          - {op: equals, path: last_action, value: select_slot}

  customer_name_input:
    kind: input
    selector: '[data-testid="customer-name"]'
    page: cart
    actions:
      fill:
        effects:
          - {op: equals_normalized, path: customer_name, value_from: input.value, normalizers: [trim]}
          - {op: removed_object_fields, path: validation_errors, fields: [name]}

  customer_phone_input:
    kind: input
    selector: '[data-testid="customer-phone"]'
    page: cart
    actions:
      fill:
        effects:
          - {op: equals_normalized, path: customer_phone, value_from: input.value, normalizers: [trim]}
          - {op: removed_object_fields, path: validation_errors, fields: [phone]}

  place_order_button:
    kind: button
    selector: '[data-testid="place-order"]'
    page: cart
    actions:
      click:
        preconditions:
          - {op: relation, path: cart_subtotal, operator: ">=", value: 10000}
          - {op: relation, path: cart_count, operator: ">=", value: 1}
          - {op: relation, path: customer_name, operator: "!=", value: ""}
          - {op: one_of, path: delivery_slot, values: [morning, afternoon, evening]}
        rejected_when:
          - {op: relation, path: cart_subtotal, operator: "<", value: 10000}
        rejected_effects:
          - {op: equals, path: order_placed, value: false}
        effects:
          - {op: equals, path: order_placed, value: true}
          - {op: one_of, path: order_id, values: ["ORD-001", "ORD-002", "ORD-003", "ORD-004", "ORD-005"]}
          - {op: equals, path: last_action, value: place_order}

  role_customer_button:
    kind: button
    selector: '[data-testid="role-customer"]'
    actions:
      click:
        effects:
          - {op: equals, path: active_role, value: customer}

  role_staff_button:
    kind: button
    selector: '[data-testid="role-staff"]'
    actions:
      click:
        effects:
          - {op: equals, path: active_role, value: staff}

  cancel_order_button:
    kind: button
    selector: '[data-testid="cancel-order"]'
    page: receipts
    actions:
      click:
        allowed_roles: [staff]
        effects:
          - {op: equals, path: last_action, value: cancel_order}
        unauthorized_effects:
          - {op: unchanged, path: order_history}
          - {op: equals, path: last_action, value: unauthorized}
