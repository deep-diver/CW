          - {op: equals, path: last_action, value: unauthorized_capacity}
  director_signoff_button:
    kind: button
    selector: '[data-testid="director-signoff"]'
    page: surge
    actions:
      click:
        allowed_roles: [operations_director]
        preconditions:
          - {op: one_of, path: diversion_status, values: [resolved]}
          - {op: one_of, path: surge_status, values: [closed]}
        rejected_when:
          - {op: not_one_of, path: diversion_status, values: [resolved]}
          - {op: not_one_of, path: surge_status, values: [closed]}
        rejected_effects:
          - {op: equals, path: director_signoff_status, value: idle}
          - {op: equals, path: last_action, value: signoff_blocked}
        effects:
          - {op: equals, path: director_signoff_status, value: signed}
