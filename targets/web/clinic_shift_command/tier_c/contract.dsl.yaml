          - {op: not_one_of, path: transport_status, values: [accepted]}
        rejected_effects:
          - {op: equals, path: transport_ack_status, value: blocked}
          - {op: equals, path: last_action, value: transport_ack_blocked}
        effects:
          - {op: equals, path: transport_ack_status, value: acknowledged}
          - {op: changed_by, path: transport_ack_count, by: 1}
          - {op: equals, path: last_action, value: acknowledge_transport}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_capacity}
  reconciliation_upload_input:
    kind: input
    selector: '[data-testid="reconciliation-upload"]'
    page: surge
    actions:
      upload:
        file_schema:
          format: csv
          columns:
            - {name: id, type: string}
            - {name: patient, type: string}
            - {name: wristband, type: string}
            - {name: transport, type: string}
            - {name: status, type: string}
        effects:
          - {op: equals, path: reconciliation_rows, value_from: input.rows}
          - {op: equals_length, path: reconciliation_count, source_path: reconciliation_rows}
          - {op: equals_count_where, path: mismatch_count, source_path: reconciliation_rows, where: [{op: equals, field: status, value: mismatch}]}
          - {op: equals, path: last_reconciliation_file, value_from: input.file.name}
          - {op: equals, path: reconciliation_status, value: review}
          - {op: equals, path: last_action, value: upload_reconciliation}
  lock_reconciliation_button:
    kind: button
    selector: '[data-testid="lock-reconciliation"]'
    page: surge
    actions:
      click:
        allowed_roles: [operations_director]
        preconditions:
          - {op: relation, path: reconciliation_count, operator: ">", value: 0}
          - {op: one_of, path: mismatch_count, values: [0]}
        rejected_when:
          - {op: relation, path: mismatch_count, operator: ">", value: 0}
        rejected_effects:
          - {op: changed_by, path: reconciliation_block_count, by: 1}
          - {op: equals, path: reconciliation_status, value: blocked}
          - {op: equals, path: last_action, value: reconciliation_blocked}
        effects:
          - {op: equals, path: reconciliation_status, value: locked}
          - {op: changed_by, path: reconciliation_lock_count, by: 1}
          - {op: equals, path: last_action, value: lock_reconciliation}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_director}
  diversion_upload_input:
    kind: input
    selector: '[data-testid="diversion-upload"]'
    page: surge
    actions:
      upload:
        file_schema:
          format: csv
          columns:
            - {name: id, type: string}
            - {name: site, type: string}
            - {name: service, type: string}
            - {name: status, type: string}
            - {name: eta, type: number}
        effects:
          - {op: equals, path: diversion_rows, value_from: input.rows}
          - {op: equals_length, path: diversion_count, source_path: diversion_rows}
          - {op: equals_count_where, path: open_diversion_count, source_path: diversion_rows, where: [{op: equals, field: status, value: open}]}
          - {op: equals, path: last_diversion_file, value_from: input.file.name}
          - {op: equals, path: diversion_status, value: review}
          - {op: equals, path: last_action, value: upload_diversion}
  resolve_diversion_button:
    kind: button
    selector: '[data-testid="resolve-diversion"]'
    page: surge
    actions:
      click:
        allowed_roles: [operations_director]
        preconditions:
          - {op: relation, path: diversion_count, operator: ">", value: 0}
        effects:
          - {op: updated_first_where, path: diversion_rows, where: [{op: equals, field: id, value: D-1}], updates: {status: resolved}}
          - {op: equals, path: open_diversion_count, value: 0}
          - {op: equals, path: diversion_status, value: resolved}
          - {op: changed_by, path: diversion_resolve_count, by: 1}
          - {op: equals, path: last_action, value: resolve_diversion}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_director}

  escalate_delay_button:
    kind: button
    selector: '[data-testid="escalate-delay"]'
    page: chart
    actions:
      click:
        allowed_roles: [charge_nurse]
        preconditions:
          - {op: not_one_of, path: selected_patient_id, values: [""]}
        effects:
          - {op: appended_object, path: escalation_tasks, value: {id: E-1, patient: {from_path: selected_patient_name}, reason: delayed_room, owner: charge_nurse, status: open}}
