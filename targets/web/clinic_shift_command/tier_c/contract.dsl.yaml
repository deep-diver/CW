          - {op: changed_by, path: closed_surge_task_count, by: 1}
          - {op: equals, path: surge_status, value: closed}
          - {op: equals, path: last_action, value: close_surge}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
