  close_escalation_button:
    kind: button
    selector: '[data-testid="close-escalation"]'
    page: handoff
    actions:
      click:
        allowed_roles: [charge_nurse]
        preconditions:
          - {op: relation, path: escalation_count, operator: ">", value: 0}
        effects:
          - {op: updated_first_where, path: escalation_tasks, where: [{op: equals, field: id, value: E-1}], updates: {status: closed}}
          - {op: changed_by, path: closed_escalation_count, by: 1}
          - {op: equals, path: last_action, value: close_escalation}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_capacity}
  finalize_handoff_button:
    kind: button
    selector: '[data-testid="finalize-handoff"]'
    page: handoff
    actions:
      click:
        allowed_roles: [charge_nurse]
        preconditions:
          - {op: one_of, path: order_status, values: [released]}
          - {op: relation, path: referral_doc_count, operator: ">", value: 0}
          - {op: one_of, path: closed_escalation_count, values: [1]}
        rejected_when:
          - {op: not_one_of, path: closed_escalation_count, values: [1]}
        rejected_effects:
          - {op: changed_by, path: handoff_block_count, by: 1}
          - {op: equals, path: handoff_status, value: blocked}
          - {op: equals, path: last_action, value: handoff_blocked}
        effects:
          - {op: appended_object, path: handoff_packets, value: {id: H-1, patient: {from_path: selected_patient_name}, referral_file: {from_path: last_referral_file}, status: ready}}
          - {op: changed_by, path: handoff_packet_count, by: 1}
          - {op: equals, path: handoff_status, value: ready}
          - {op: equals, path: last_action, value: finalize_handoff}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
