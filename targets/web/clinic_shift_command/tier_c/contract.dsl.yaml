    page: surge
    actions:
      click:
        allowed_roles: [charge_nurse]
        preconditions:
          - {op: one_of, path: transport_ack_status, values: [acknowledged]}
          - {op: one_of, path: reconciliation_status, values: [locked]}
        rejected_when:
          - {op: not_one_of, path: transport_ack_status, values: [acknowledged]}
          - {op: not_one_of, path: reconciliation_status, values: [locked]}
        rejected_effects:
          - {op: equals, path: nurse_signoff_status, value: idle}
          - {op: equals, path: last_action, value: signoff_blocked}
