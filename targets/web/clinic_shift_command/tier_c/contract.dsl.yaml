dsl_version: "3.0.0"

app:
  id: clinic_shift_command
  name: Clinic Shift Command Tier C
  capability: ambulatory_clinic_incident_command
  ui_ux_brief: |
    Clinic Shift Command Tier C should look like a premium incident-command
    console for a high-acuity ambulatory clinic network. A desktop screenshot
    should immediately read as more sophisticated than Tier B: a layered command
    header, patient risk radar, live floor-map visualization, capacity forecast
    bands, diagnostics release queue, transport ETA lane, staffing exception
    upload, wristband/transport reconciliation, diversion matrix, escalation
    ledger, computed readiness gauge, blocker ledger, dual sign-off, final
    command-clearance timeline, and audit trail
    should all be visible as coordinated product surfaces. Use a bright clinical
    canvas with polished navy/teal structure, cyan data accents, amber/red surge
    states, crisp cards, sparklines or SVG-like visual widgets, mini floor-map
    tiles, matrix tables, and role-aware action clusters. Avoid a generic
    dashboard, landing page, dark test harness, or plain table dump. The UI/UX
    should feel like a real healthcare SaaS product used by charge nurses,
    clinicians, billing, transport coordinators, and operations directors during
    a live incident.

runtime:
  target: web
  start_url: /#/command

  state_probe:
    kind: javascript
    expression: window.__DETOX_STATE__

  pages:
    command:
      path: /#/command
      purpose: Live triage queue, role console, risk telemetry, and selected patient snapshot.
    chart:
      path: /#/chart
      purpose: Patient chart workspace for insurance, prior authorization, assessment, orders, and referral upload.
    capacity:
      path: /#/capacity
      purpose: Room capacity board and diagnostic order tracking.
    handoff:
      path: /#/handoff
      purpose: Escalations, referral packets, and charge-nurse shift handoff.
    surge:
      path: /#/surge
      purpose: Incident command, staffing exceptions, transport ETA, surge activation, and final clearance.

  session:
    role_path: active_role
    roles: [coordinator, clinician, charge_nurse, billing, operations_director]

  persistence:
    reload:
      scope: local_storage
      paths:
        - current_page
        - active_role
        - patients
        - visible_patients
        - current_filter
        - rooms
        - selected_patient_id
        - selected_patient_name
        - selected_lane
        - selected_acuity
        - selected_patient_status
        - selected_room_need
        - selected_risk
        - assigned_room_id
        - assigned_room_name
        - insurance_code
        - insurance_status
        - copay_due
        - auth_required
        - auth_key
        - authorization_status
        - service_call_count
        - insurance_call_count
        - auth_call_count
        - risk_score
        - risk_band
        - risk_protocol
        - risk_call_count
        - forecast_status
        - forecast_level
        - forecast_minutes
        - forecast_call_count
        - transport_status
        - transport_eta
        - transport_call_count
        - transport_ack_status
        - transport_ack_count
        - pain_score
        - disposition
        - assessment_status
        - order_status
        - diagnostic_orders
        - diagnostic_order_count
        - released_order_count
        - release_block_count
        - referral_docs
        - referral_doc_count
        - last_referral_file
        - escalation_tasks
        - escalation_count
        - closed_escalation_count
        - handoff_packets
        - handoff_packet_count
        - handoff_status
        - handoff_block_count
        - staffing_rows
        - staffing_count
        - short_staff_count
        - last_staffing_file
        - reconciliation_rows
        - reconciliation_count
        - mismatch_count
        - last_reconciliation_file
        - reconciliation_status
        - reconciliation_lock_count
        - reconciliation_block_count
        - diversion_rows
        - diversion_count
        - open_diversion_count
        - last_diversion_file
        - diversion_status
        - diversion_resolve_count
        - surge_tasks
        - surge_task_count
        - closed_surge_task_count
        - surge_status
        - surge_block_count
        - nurse_signoff_status
        - director_signoff_status
        - signoff_count
        - clearance_readiness_score
        - open_clearance_blockers
        - clearance_blocker_rows
        - command_audit
        - audit_count
        - final_clearance_status
        - final_clearance_count
        - validation_errors
        - denied_count
        - room_block_count
        - last_action

  services:
    insurance_verify:
      endpoint: /api/insurance
      method: GET
      responses:
        - id: hmo_approved
          match:
            query:
              code: HMO-A
          status: 200
          json: {status: approved, copay: 20}
        - id: ppo_approved
          match:
            query:
              code: PPO-B
          status: 200
          json: {status: approved, copay: 35}
        - id: cash_self_pay
          match:
            query:
              code: CASH
          status: 200
          json: {status: self_pay, copay: 120}
        - id: plan_review
          match:
            query:
              code: BADPLAN
          status: 200
          json: {status: needs_review, copay: 0}
    prior_auth:
      endpoint: /api/prior-auth
      method: GET
      responses:
        - id: cardio_stat
          match:
            query:
              auth: CARD-STAT
          status: 200
          json: {status: approved}
        - id: ortho_approved
          match:
            query:
              auth: ORTHO-77
          status: 200
          json: {status: approved}
        - id: denied
          match:
            query:
              auth: BAD-AUTH
          status: 200
          json: {status: denied}
    risk_score:
      endpoint: /api/risk-score
      method: GET
      responses:
        - id: ava_critical
          match:
            query:
              patient: CVC-206
          status: 200
          json: {score: 94, band: critical, protocol: cardiac_isolation}
        - id: omar_procedure
          match:
            query:
              patient: CVC-202
          status: 200
          json: {score: 78, band: high, protocol: ortho_procedure}
        - id: june_lab
          match:
            query:
              patient: CVC-205
          status: 200
          json: {score: 64, band: watch, protocol: fever_lab}
    capacity_forecast:
      endpoint: /api/capacity-forecast
      method: GET
      responses:
        - id: west_surge
          match:
            query:
              zone: west
          status: 200
          json: {status: surge, level: 3, minutes: 18}
        - id: diagnostics_watch
          match:
            query:
              zone: diagnostics
          status: 200
          json: {status: watch, level: 2, minutes: 34}
    transport_eta:
      endpoint: /api/transport-eta
      method: GET
      responses:
        - id: stat_eta
          match:
            query:
              mode: STAT
          status: 200
          json: {status: accepted, eta: 12}
        - id: routine_eta
          match:
            query:
              mode: ROUTINE
          status: 200
          json: {status: queued, eta: 38}

  tables:
    patient_queue:
      selector: '[data-testid="patient-queue"]'
      row_selector: '[data-testid="patient-row"]'
      row_id_attribute: data-patient-id
      source_path: visible_patients
      row_id_field: id
      columns:
        name: {selector: '[data-col="name"]', state_field: name}
        lane: {selector: '[data-col="lane"]', state_field: lane}
        acuity: {selector: '[data-col="acuity"]', state_field: acuity}
        status: {selector: '[data-col="status"]', state_field: status}
        wait_mins: {selector: '[data-col="wait_mins"]', state_field: wait_mins}
        room_need: {selector: '[data-col="room_need"]', state_field: room_need}
        risk: {selector: '[data-col="risk"]', state_field: risk}
    room_board:
      selector: '[data-testid="room-board"]'
      row_selector: '[data-testid="room-row"]'
      row_id_attribute: data-room-id
      source_path: rooms
      row_id_field: id
      columns:
        name: {selector: '[data-col="name"]', state_field: name}
        zone: {selector: '[data-col="zone"]', state_field: zone}
        status: {selector: '[data-col="status"]', state_field: status}
        occupant: {selector: '[data-col="occupant"]', state_field: occupant}
        equipment: {selector: '[data-col="equipment"]', state_field: equipment}
    order_grid:
      selector: '[data-testid="order-grid"]'
      row_selector: '[data-testid="order-row"]'
      row_id_attribute: data-order-id
      source_path: diagnostic_orders
      row_id_field: id
      columns:
