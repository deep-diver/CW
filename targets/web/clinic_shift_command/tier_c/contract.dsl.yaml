        owner: {selector: '[data-col="owner"]', state_field: owner}
        status: {selector: '[data-col="status"]', state_field: status}
    handoff_packet_grid:
      selector: '[data-testid="handoff-packet-grid"]'
      row_selector: '[data-testid="handoff-packet-row"]'
      row_id_attribute: data-packet-id
