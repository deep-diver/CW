    page: surge
    actions:
      click:
        allowed_roles: [operations_director]
        preconditions:
          - {op: one_of, path: handoff_status, values: [ready]}
          - {op: one_of, path: transport_status, values: [accepted]}
          - {op: one_of, path: transport_ack_status, values: [acknowledged]}
          - {op: one_of, path: reconciliation_status, values: [locked]}
          - {op: one_of, path: diversion_status, values: [resolved]}
          - {op: one_of, path: surge_status, values: [closed]}
          - {op: one_of, path: nurse_signoff_status, values: [signed]}
          - {op: one_of, path: director_signoff_status, values: [signed]}
