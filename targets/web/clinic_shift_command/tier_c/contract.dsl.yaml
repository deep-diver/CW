        effects:
          - {op: appended_object, path: surge_tasks, value: {id: S-1, zone: west, action: flex_isolation_staff, owner: operations_director, status: active}}
          - {op: changed_by, path: surge_task_count, by: 1}
          - {op: equals, path: surge_status, value: active}
