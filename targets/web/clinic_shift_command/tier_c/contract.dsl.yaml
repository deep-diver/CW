  request_transport_button:
    kind: button
    selector: '[data-testid="request-transport"]'
    page: chart
    actions:
      click:
        allowed_roles: [charge_nurse]
        preconditions:
          - {op: one_of, path: order_status, values: [released]}
          - {op: relation, path: risk_score, operator: ">", value: 0}
        rejected_when:
          - {op: not_one_of, path: order_status, values: [released]}
        rejected_effects:
          - {op: equals, path: transport_status, value: blocked}
          - {op: equals, path: last_action, value: transport_blocked}
        effects:
          - {op: changed_by, path: service_call_count, by: 1}
          - {op: changed_by, path: transport_call_count, by: 1}
          - {op: one_of, path: transport_status, values: [accepted, queued]}
          - {op: relation, path: transport_eta, operator: ">", value: 0}
          - {op: equals, path: last_action, value: request_transport}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_capacity}

  pain_score_input:
    kind: input
    selector: '[data-testid="pain-score"]'
    page: chart
    actions:
      fill:
        effects:
          - {op: equals_normalized, path: pain_score, value_from: input.value, normalizers: [trim]}
          - {op: removed_object_fields, path: validation_errors, fields: [assessment]}
  disposition_input:
    kind: input
    selector: '[data-testid="disposition"]'
    page: chart
    actions:
      fill:
        effects:
          - {op: equals_normalized, path: disposition, value_from: input.value, normalizers: [trim, collapse_whitespace]}
          - {op: removed_object_fields, path: validation_errors, fields: [assessment]}
  save_assessment_button:
    kind: button
    selector: '[data-testid="save-assessment"]'
    page: chart
    actions:
      click:
        allowed_roles: [clinician]
        rejected_when:
          - {op: one_of, path: pain_score, values: [""]}
          - {op: one_of, path: disposition, values: [""]}
        rejected_effects:
          - {op: equals, path: assessment_status, value: incomplete}
          - {op: updated_object_fields, path: validation_errors, updates: {assessment: "Pain score and disposition are required"}}
          - {op: equals, path: last_action, value: reject_assessment}
        effects:
          - {op: equals, path: assessment_status, value: recorded}
          - {op: equals, path: selected_patient_status, value: assessed}
          - {op: equals, path: last_action, value: save_assessment}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_clinical}
  place_lab_order_button:
    kind: button
    selector: '[data-testid="place-lab-order"]'
    page: chart
    actions:
      click:
        allowed_roles: [clinician]
        rejected_when:
          - {op: not_one_of, path: assessment_status, values: [recorded]}
        rejected_effects:
          - {op: equals, path: order_status, value: blocked}
          - {op: equals, path: last_action, value: order_requires_assessment}
        effects:
          - {op: appended_object, path: diagnostic_orders, value: {id: O-1, patient: {from_path: selected_patient_name}, type: CBC, priority: stat, status: ordered}}
          - {op: changed_by, path: diagnostic_order_count, by: 1}
          - {op: equals, path: order_status, value: ordered}
          - {op: equals, path: last_action, value: place_lab_order}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_clinical}
  release_diagnostics_button:
    kind: button
    selector: '[data-testid="release-diagnostics"]'
    page: chart
    actions:
      click:
        allowed_roles: [clinician]
        preconditions:
          - {op: one_of, path: order_status, values: [ordered]}
          - {op: one_of, path: insurance_status, values: [approved, self_pay]}
          - {op: one_of, path: authorization_status, values: [approved, not_required]}
        rejected_when:
          - {op: not_one_of, path: authorization_status, values: [approved, not_required]}
        rejected_effects:
          - {op: changed_by, path: release_block_count, by: 1}
          - {op: equals, path: last_action, value: release_blocked}
        effects:
          - {op: updated_first_where, path: diagnostic_orders, where: [{op: equals, field: id, value: O-1}], updates: {status: released}}
          - {op: changed_by, path: released_order_count, by: 1}
          - {op: equals, path: order_status, value: released}
          - {op: equals, path: selected_patient_status, value: diagnostic_ready}
          - {op: equals, path: last_action, value: release_diagnostics}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_clinical}

  referral_upload_input:
    kind: input
    selector: '[data-testid="referral-upload"]'
    page: chart
    actions:
      upload:
        file_schema:
          format: csv
          columns:
            - {name: id, type: string}
            - {name: document, type: string}
            - {name: priority, type: string}
            - {name: status, type: string}
        effects:
          - {op: equals, path: referral_docs, value_from: input.rows}
          - {op: equals_length, path: referral_doc_count, source_path: referral_docs}
          - {op: equals, path: last_referral_file, value_from: input.file.name}
          - {op: equals, path: last_action, value: upload_referrals}
  staffing_upload_input:
    kind: input
