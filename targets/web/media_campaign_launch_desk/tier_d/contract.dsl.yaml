dsl_version: "3.0.0"

app:
  id: media_campaign_launch_desk_tier_d
  name: Media Campaign Launch Desk Tier D
  capability: global_premiere_embargo_command
  ui_ux_brief: |
    Media Campaign Launch Desk Tier D should look like a cinematic global
    premiere command center for a high-stakes franchise release. It must not
    resemble the Tier C media-mix planning room: the product surface should be
    about embargo discipline, asset lineage, market blackout windows, partner
    trafficking delivery, measurement beacon arming, sentiment risk, finance
    escrow, multi-role sign-off, and launch sealing. A desktop screenshot should
    immediately read as harder than Tier C: a dense film-slate header, global
    market clock rail, asset vault, blackout matrix, partner delivery manifest,
    beacon arming console, sentiment watch tape, escrow ledger, computed launch
    readiness blockers, executive seal controls, launch ledger, and audit trail
    should all be visible. Use a polished midnight cinema operations palette
    with white slate strips, electric cyan timing rails, red embargo warnings,
    gold finance locks, green clearance seals, dense tables, clock chips, and
    map-like market tiles. Avoid broadcast waveforms, generic dashboards,
    marketing hero pages, or the Tier C audience/mix/deal/experiment language.

runtime:
  target: web
  start_url: /#/slate
  state_probe:
    kind: javascript
    expression: window.__DETOX_STATE__
  pages:
    slate:
      path: /#/slate
      purpose: Premiere asset vault, embargo-risk filters, release-code entry, and selected asset slate.
    markets:
      path: /#/markets
      purpose: Market blackout upload, local-window lock, and embargo matrix.
    traffic:
      path: /#/traffic
      purpose: Partner placement manifest, QA remediation, delivery lock, and delivery acknowledgement.
    signals:
      path: /#/signals
      purpose: Measurement beacons, attribution health, sentiment watch, and finance escrow controls.
    seal:
      path: /#/seal
      purpose: Launch readiness blockers, role sign-offs, final seal ledger, and audit trail.
  session:
    role_path: active_role
    roles: [producer, legal, ops, measurement, finance, executive]
  persistence:
    reload:
      scope: local_storage
      paths:
        - current_page
        - active_role
        - assets
        - visible_assets
        - current_filter
        - selected_asset_id
        - selected_asset_title
        - selected_format
        - selected_region
        - selected_embargo
        - selected_clearance
        - selected_risk
        - selected_version
        - release_code
        - watermark_key
        - embargo_status
        - legal_clearance_status
        - legal_clearance_score
        - rights_call_count
        - attribution_call_count
        - service_call_count
        - window_rows
        - window_count
        - open_blackout_count
        - window_status
        - window_lock_count
        - last_window_file
        - placement_rows
        - placement_count
        - qa_fail_count
        - delivery_status
        - delivery_lock_count
        - delivery_ack_status
        - delivery_ack_count
        - last_traffic_file
        - beacon_rows
        - beacon_count
        - beacon_status
        - beacon_arm_count
        - attribution_status
        - attribution_score
        - sentiment_rows
        - sentiment_count
        - negative_sentiment_count
        - sentiment_status
        - sentiment_clear_count
        - last_sentiment_file
        - escrow_rows
        - escrow_count
        - unpaid_invoice_count
        - escrow_status
        - escrow_lock_count
        - last_escrow_file
        - legal_signoff_status
        - ops_signoff_status
        - measurement_signoff_status
        - finance_signoff_status
        - executive_signoff_status
        - signoff_count
        - readiness_score
        - open_blockers
        - blocker_rows
        - launch_rows
        - launch_count
        - global_launch_status
        - launch_seal_score
        - open_launch_blockers
        - launch_seal_count
        - audit_log
        - audit_count
        - validation_errors
        - denied_count
        - last_action

  services:
    rights_clearance:
      endpoint: /api/premiere-rights
      method: GET
      responses:
        - id: red_horizon_clear
          match: {query: {asset: A-RED}}
          status: 200
          json: {status: cleared, score: 96}
        - id: social_watch_clear
          match: {query: {asset: A-SOC}}
          status: 200
          json: {status: cleared, score: 91}
        - id: premiere_bumper_clear
          match: {query: {asset: A-PRE}}
          status: 200
          json: {status: cleared, score: 88}
    attribution_health:
      endpoint: /api/attribution-health
      method: GET
      responses:
        - id: global_ready
          match: {query: {suite: global}}
          status: 200
          json: {status: healthy, score: 94}

  tables:
    asset_grid:
      selector: '[data-testid="asset-grid"]'
      row_selector: '[data-testid="asset-row"]'
      row_id_attribute: data-asset-id
      source_path: visible_assets
      row_id_field: id
      columns:
        title: {selector: '[data-col="title"]', state_field: title}
        format: {selector: '[data-col="format"]', state_field: format}
        region: {selector: '[data-col="region"]', state_field: region}
        embargo: {selector: '[data-col="embargo"]', state_field: embargo}
        clearance: {selector: '[data-col="clearance"]', state_field: clearance}
        risk: {selector: '[data-col="risk"]', state_field: risk}
        version: {selector: '[data-col="version"]', state_field: version}
    window_grid:
      selector: '[data-testid="window-grid"]'
      row_selector: '[data-testid="window-row"]'
      row_id_attribute: data-window-id
      source_path: window_rows
      row_id_field: id
      columns:
        market: {selector: '[data-col="market"]', state_field: market}
        local_time: {selector: '[data-col="local_time"]', state_field: local_time}
        blackout: {selector: '[data-col="blackout"]', state_field: blackout}
        owner: {selector: '[data-col="owner"]', state_field: owner}
        status: {selector: '[data-col="status"]', state_field: status}
    traffic_grid:
      selector: '[data-testid="traffic-grid"]'
      row_selector: '[data-testid="traffic-row"]'
      row_id_attribute: data-placement-id
      source_path: placement_rows
      row_id_field: id
      columns:
        partner: {selector: '[data-col="partner"]', state_field: partner}
        market: {selector: '[data-col="market"]', state_field: market}
        format: {selector: '[data-col="format"]', state_field: format}
        spend: {selector: '[data-col="spend"]', state_field: spend}
        qa: {selector: '[data-col="qa"]', state_field: qa}
        status: {selector: '[data-col="status"]', state_field: status}
    beacon_grid:
      selector: '[data-testid="beacon-grid"]'
      row_selector: '[data-testid="beacon-row"]'
      row_id_attribute: data-beacon-id
      source_path: beacon_rows
      row_id_field: id
      columns:
        surface: {selector: '[data-col="surface"]', state_field: surface}
        event: {selector: '[data-col="event"]', state_field: event}
        owner: {selector: '[data-col="owner"]', state_field: owner}
        status: {selector: '[data-col="status"]', state_field: status}
    sentiment_grid:
      selector: '[data-testid="sentiment-grid"]'
      row_selector: '[data-testid="sentiment-row"]'
      row_id_attribute: data-sentiment-id
      source_path: sentiment_rows
      row_id_field: id
      columns:
        market: {selector: '[data-col="market"]', state_field: market}
        volume: {selector: '[data-col="volume"]', state_field: volume}
        polarity: {selector: '[data-col="polarity"]', state_field: polarity}
        status: {selector: '[data-col="status"]', state_field: status}
    escrow_grid:
      selector: '[data-testid="escrow-grid"]'
      row_selector: '[data-testid="escrow-row"]'
      row_id_attribute: data-escrow-id
      source_path: escrow_rows
      row_id_field: id
      columns:
        market: {selector: '[data-col="market"]', state_field: market}
        budget: {selector: '[data-col="budget"]', state_field: budget}
        invoice: {selector: '[data-col="invoice"]', state_field: invoice}
        status: {selector: '[data-col="status"]', state_field: status}
    blocker_grid:
      selector: '[data-testid="blocker-grid"]'
      row_selector: '[data-testid="blocker-row"]'
      row_id_attribute: data-blocker-id
      source_path: blocker_rows
      row_id_field: id
      columns:
        label: {selector: '[data-col="label"]', state_field: label}
        owner: {selector: '[data-col="owner"]', state_field: owner}
        status: {selector: '[data-col="status"]', state_field: status}
    launch_grid:
      selector: '[data-testid="launch-grid"]'
      row_selector: '[data-testid="launch-row"]'
      row_id_attribute: data-launch-id
      source_path: launch_rows
      row_id_field: id
      columns:
        slate: {selector: '[data-col="slate"]', state_field: slate}
        markets: {selector: '[data-col="markets"]', state_field: markets}
        status: {selector: '[data-col="status"]', state_field: status}
        seal: {selector: '[data-col="seal"]', state_field: seal}
    audit_grid:
      selector: '[data-testid="audit-grid"]'
      row_selector: '[data-testid="audit-row"]'
