  - id: private_22_reset_clears_launch_state
    tier: persistence
    difficulty: D
    steps:
      - do: reset_button.click
      - do: go_traffic_button.click
      - do: role_ops_button.click
      - do: traffic_upload_input.upload
        input:
          file:
            name: reset-traffic.csv
            mime_type: text/csv
            content: |
              id,partner,market,format,spend,qa,status
              P-AMZ,Amazon,global,trailer,420000,pass,staged
          rows:
            - {id: P-AMZ, partner: Amazon, market: global, format: trailer, spend: 420000, qa: pass, status: staged}
      - do: lock_delivery_button.click
      - do: acknowledge_delivery_button.click
      - do: reset_button.click
        expect:
          - {op: equals, path: current_page, value: slate}
          - {op: equals, path: active_role, value: producer}
          - {op: equals, path: placement_count, value: 0}
          - {op: equals, path: delivery_status, value: idle}
          - {op: equals, path: readiness_score, value: 0}
          - {op: equals, path: open_blockers, value: 10}

  - id: private_23_browser_back_chain_to_slate
    tier: persistence
    difficulty: D
    steps:
      - do: reset_button.click
      - do: go_markets_button.click
      - do: go_traffic_button.click
      - do: go_signals_button.click
      - browser: back
        expect_page: traffic
        expect:
          - {op: equals, path: current_page, value: traffic}
      - browser: back
        expect_page: markets
        expect:
          - {op: equals, path: current_page, value: markets}
      - browser: back
        expect_page: slate
        expect:
          - {op: equals, path: current_page, value: slate}

  - id: private_24_role_persists_across_reload
    tier: persistence
    difficulty: D
    steps:
      - do: reset_button.click
      - do: go_seal_button.click
      - do: role_executive_button.click
      - browser: reload
        expect_page: seal
        expect:
          - {op: equals, path: active_role, value: executive}
          - {op: equals, path: current_page, value: seal}

  - id: private_25_blocker_grid_after_partial_readiness
    tier: core
    difficulty: D
    steps:
      - do: reset_button.click
      - do: select_trailer_button.click
      - do: go_slate_button.click
      - do: role_legal_button.click
      - do: request_legal_clearance_button.click
      - do: role_producer_button.click
      - do: release_code_input.fill
        input: {value: " partial-grid "}
      - do: watermark_key_input.fill
        input: {value: " partial wm "}
      - do: lock_asset_button.click
      - do: go_seal_button.click
      - table: blocker_grid
        expect_order: [B-ASSET, B-LEGAL, B-WINDOWS, B-DELIVERY, B-BEACONS, B-ATTRIBUTION, B-SENTIMENT, B-ESCROW, B-SIGNOFFS, B-EXECUTIVE]
        expect_rows:
          - id: B-ASSET
            cells:
              status: cleared
          - id: B-WINDOWS
            cells:
              status: open
          - id: B-EXECUTIVE
            cells:
              status: open

  - id: private_26_producer_cannot_finalize_launch
    tier: permission
    difficulty: D
    steps:
      - do: reset_button.click
      - do: go_seal_button.click
      - do: finalize_launch_button.click
        mode: unauthorized
        expect:
          - {op: equals, path: global_launch_status, value: idle}
          - {op: equals, path: denied_count, value: 1}
          - {op: equals, path: last_action, value: unauthorized_executive}

  - id: private_27_traffic_reupload_qa_fail_reopens_ops_gate
    tier: validation
    difficulty: D
    steps:
      - do: reset_button.click
      - do: go_traffic_button.click
      - do: role_ops_button.click
      - do: traffic_upload_input.upload
        input:
          file:
            name: first-clean-traffic.csv
            mime_type: text/csv
            content: |
              id,partner,market,format,spend,qa,status
              P-AMZ,Amazon,global,trailer,420000,pass,staged
          rows:
            - {id: P-AMZ, partner: Amazon, market: global, format: trailer, spend: 420000, qa: pass, status: staged}
      - do: lock_delivery_button.click
      - do: acknowledge_delivery_button.click
        expect:
          - {op: equals, path: readiness_score, value: 10}
      - do: traffic_upload_input.upload
        input:
          file:
            name: reopened-fail-traffic.csv
            mime_type: text/csv
            content: |
              id,partner,market,format,spend,qa,status
              P-AMZ,Amazon,global,trailer,420000,fail,staged
          rows:
            - {id: P-AMZ, partner: Amazon, market: global, format: trailer, spend: 420000, qa: fail, status: staged}
        expect:
          - {op: equals, path: delivery_status, value: review}
          - {op: equals, path: delivery_ack_status, value: idle}
          - {op: equals, path: qa_fail_count, value: 1}
          - {op: equals, path: readiness_score, value: 0}
      - do: lock_delivery_button.click
        mode: rejected
        expect:
          - {op: equals, path: delivery_status, value: blocked}
          - {op: equals, path: last_action, value: delivery_blocked}

