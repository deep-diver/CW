      - do: request_legal_clearance_button.click
      - do: role_producer_button.click
      - do: release_code_input.fill
        input: {value: " reload-seal "}
      - do: watermark_key_input.fill
        input: {value: " reload wm "}
      - do: lock_asset_button.click
      - do: go_markets_button.click
      - do: role_ops_button.click
      - do: window_upload_input.upload
