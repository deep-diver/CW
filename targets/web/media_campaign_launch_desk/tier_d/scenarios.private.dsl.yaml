      - do: role_legal_button.click
      - do: legal_signoff_button.click
      - do: role_ops_button.click
      - do: ops_signoff_button.click
      - do: role_measurement_button.click
      - do: measurement_signoff_button.click
      - do: role_finance_button.click
      - do: finance_signoff_button.click
      - do: role_executive_button.click
      - do: executive_signoff_button.click
      - do: finalize_launch_button.click
      - browser: reload
        expect_page: seal
        expect:
          - {op: equals, path: current_page, value: seal}
          - {op: unchanged, path: global_launch_status}
          - {op: unchanged, path: launch_count}
          - {op: unchanged, path: launch_seal_score}
          - {op: unchanged, path: readiness_score}
          - {op: unchanged, path: audit_count}

