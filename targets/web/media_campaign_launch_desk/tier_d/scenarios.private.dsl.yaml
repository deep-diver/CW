dsl_version: "3.0.0"
visibility: private
tier_weights:
  smoke: 1
  core: 2
  validation: 3
  service: 4
  upload: 4
  permission: 4
  persistence: 5
  journey: 7

scenarios:
  - id: private_01_all_assets_initial_order
    tier: smoke
    difficulty: D
    steps:
      - do: reset_button.click
      - table: asset_grid
        expect_order: [A-PRE, A-RED, A-SOC, A-POD, A-OOH, A-PR]
        expect_row_count: 6
        expect_rows:
          - id: A-PRE
            cells:
              title: "Premiere Livestream Bumper"
              format: live
              risk: critical
          - id: A-PR
            cells:
              title: "Press Kit Stills"
              clearance: cleared
              version: v1

  - id: private_02_filter_uncleared_assets
    tier: smoke
    difficulty: D
    steps:
      - do: reset_button.click
      - do: filter_uncleared_button.click
        expect:
          - {op: equals, path: current_filter, value: uncleared}
      - table: asset_grid
        expect_order: [A-PRE, A-SOC, A-RED]
        expect_row_count: 3

  - id: private_03_select_social_asset_snapshot
    tier: core
    difficulty: D
    steps:
      - do: reset_button.click
      - do: select_social_button.click
        expect:
          - {op: equals, path: selected_asset_id, value: A-SOC}
          - {op: equals, path: selected_asset_title, value: "Social Vertical Teasers"}
          - {op: equals, path: selected_region, value: APAC}
          - {op: equals, path: selected_version, value: v7}
          - {op: equals, path: current_page, value: markets}

  - id: private_04_trailer_legal_clearance_service_score
    tier: service
    difficulty: D
    steps:
      - do: reset_button.click
      - do: select_trailer_button.click
      - do: go_slate_button.click
      - do: role_legal_button.click
      - do: request_legal_clearance_button.click
        expect:
          - {op: equals, path: legal_clearance_status, value: cleared}
          - {op: equals, path: legal_clearance_score, value: 96}
          - {op: equals, path: selected_asset_id, value: A-RED}
          - {op: equals, path: service_call_count, value: 1}

  - id: private_05_social_legal_clearance_service_score
    tier: service
    difficulty: D
    steps:
      - do: reset_button.click
      - do: select_social_button.click
      - do: go_slate_button.click
      - do: role_legal_button.click
      - do: request_legal_clearance_button.click
        expect:
          - {op: equals, path: legal_clearance_score, value: 91}
          - {op: equals, path: rights_call_count, value: 1}

  - id: private_06_ops_cannot_lock_asset
    tier: permission
    difficulty: D
    steps:
      - do: reset_button.click
      - do: select_premiere_button.click
      - do: go_slate_button.click
      - do: role_ops_button.click
      - do: lock_asset_button.click
        mode: unauthorized
        expect:
          - {op: equals, path: embargo_status, value: idle}
          - {op: equals, path: denied_count, value: 1}
          - {op: equals, path: last_action, value: unauthorized_producer}

  - id: private_07_legal_cannot_lock_windows
    tier: permission
    difficulty: D
    steps:
      - do: reset_button.click
      - do: go_markets_button.click
      - do: window_upload_input.upload
        input:
          file:
            name: private-windows-clean.csv
            mime_type: text/csv
            content: |
              id,market,local_time,blackout,owner,status
              W-LON,London,20:00,none,ops,clear
          rows:
            - {id: W-LON, market: London, local_time: "20:00", blackout: none, owner: ops, status: clear}
      - do: role_legal_button.click
      - do: lock_windows_button.click
        mode: unauthorized
        expect:
          - {op: equals, path: window_status, value: review}
          - {op: equals, path: denied_count, value: 1}
          - {op: equals, path: last_action, value: unauthorized_ops}

  - id: private_08_window_upload_replaces_rows
    tier: upload
    difficulty: D
    steps:
      - do: reset_button.click
      - do: go_markets_button.click
      - do: window_upload_input.upload
        input:
          file:
            name: first-windows.csv
            mime_type: text/csv
            content: |
              id,market,local_time,blackout,owner,status
              W-OLD,Paris,21:00,old-hold,ops,open
          rows:
            - {id: W-OLD, market: Paris, local_time: "21:00", blackout: old-hold, owner: ops, status: open}
      - do: window_upload_input.upload
        input:
          file:
            name: final-windows.csv
            mime_type: text/csv
            content: |
              id,market,local_time,blackout,owner,status
              W-FINAL,Sydney,09:00,none,ops,clear
          rows:
            - {id: W-FINAL, market: Sydney, local_time: "09:00", blackout: none, owner: ops, status: clear}
        expect:
          - {op: equals, path: window_count, value: 1}
          - {op: equals, path: open_blackout_count, value: 0}
          - {op: equals, path: last_window_file, value: final-windows.csv}
      - table: window_grid
        expect_order: [W-FINAL]
        expect_row_count: 1

  - id: private_09_delivery_ack_blocks_before_lock
    tier: validation
    difficulty: D
    steps:
      - do: reset_button.click
      - do: go_traffic_button.click
      - do: role_ops_button.click
      - do: acknowledge_delivery_button.click
        mode: rejected
        expect:
          - {op: equals, path: delivery_ack_status, value: blocked}
          - {op: equals, path: delivery_ack_count, value: 0}
          - {op: equals, path: last_action, value: ack_delivery_blocked}

  - id: private_10_measurement_cannot_ack_delivery
    tier: permission
    difficulty: D
    steps:
      - do: reset_button.click
      - do: go_traffic_button.click
      - do: role_ops_button.click
      - do: traffic_upload_input.upload
        input:
          file:
            name: private-traffic-clean.csv
            mime_type: text/csv
            content: |
              id,partner,market,format,spend,qa,status
              P-AMZ,Amazon,global,trailer,420000,pass,staged
          rows:
            - {id: P-AMZ, partner: Amazon, market: global, format: trailer, spend: 420000, qa: pass, status: staged}
      - do: lock_delivery_button.click
      - do: role_measurement_button.click
      - do: acknowledge_delivery_button.click
        mode: unauthorized
        expect:
          - {op: equals, path: delivery_ack_status, value: idle}
          - {op: equals, path: denied_count, value: 1}
          - {op: equals, path: last_action, value: unauthorized_ops}

  - id: private_11_arm_beacons_blocks_without_upload
    tier: validation
    difficulty: D
    steps:
      - do: reset_button.click
      - do: go_signals_button.click
      - do: role_measurement_button.click
      - do: arm_beacons_button.click
        mode: rejected
        expect:
          - {op: equals, path: beacon_status, value: blocked}
          - {op: equals, path: beacon_arm_count, value: 0}
          - {op: equals, path: last_action, value: beacon_blocked}

  - id: private_12_ops_cannot_run_attribution
    tier: permission
    difficulty: D
    steps:
      - do: reset_button.click
      - do: go_signals_button.click
      - do: role_ops_button.click
      - do: run_attribution_button.click
        mode: unauthorized
        expect:
          - {op: equals, path: attribution_status, value: idle}
          - {op: equals, path: denied_count, value: 1}
          - {op: equals, path: service_call_count, value: 0}

  - id: private_13_sentiment_reupload_reopens_measurement_gate
    tier: validation
    difficulty: D
    steps:
      - do: reset_button.click
      - do: go_signals_button.click
      - do: role_measurement_button.click
      - do: sentiment_upload_input.upload
        input:
          file:
            name: clean-sentiment-private.csv
            mime_type: text/csv
            content: |
              id,market,volume,polarity,status
              S-1,London,21000,positive,green
          rows:
            - {id: S-1, market: London, volume: 21000, polarity: positive, status: green}
      - do: clear_sentiment_button.click
        expect:
          - {op: equals, path: sentiment_status, value: cleared}
          - {op: equals, path: readiness_score, value: 10}
      - do: sentiment_upload_input.upload
        input:
          file:
            name: reopened-sentiment-private.csv
            mime_type: text/csv
            content: |
              id,market,volume,polarity,status
              S-1,London,21000,negative,watch
          rows:
            - {id: S-1, market: London, volume: 21000, polarity: negative, status: watch}
        expect:
          - {op: equals, path: sentiment_status, value: review}
          - {op: equals, path: negative_sentiment_count, value: 1}
          - {op: equals, path: readiness_score, value: 0}
          - {op: equals, path: open_blockers, value: 10}

  - id: private_14_finance_cannot_clear_sentiment
    tier: permission
    difficulty: D
    steps:
      - do: reset_button.click
      - do: go_signals_button.click
      - do: sentiment_upload_input.upload
        input:
          file:
            name: finance-sentiment.csv
            mime_type: text/csv
            content: |
              id,market,volume,polarity,status
