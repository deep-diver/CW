dsl_version: "3.0.0"
visibility: public
tier_weights:
  smoke: 1
  core: 2
  service: 3
  validation: 3
  upload: 4
  permission: 4
  persistence: 5
  journey: 6

scenarios:
  - id: public_01_filter_high_intent_audience_portfolio
    tier: smoke
    difficulty: C
    steps:
      - do: reset_button.click
      - do: filter_high_intent_button.click
        expect:
          - {op: equals, path: current_filter, value: high_intent}
          - {op: equals, path: last_action, value: filter_high_intent}
      - table: audience_grid
        expect_order: [AUD-URBAN, AUD-GAMER, AUD-LUX]
        expect_row_count: 3
        expect_rows:
          - id: AUD-URBAN
            cells: {name: Urban Commuter Video, market: metro, intent: high, signal: mobility}
          - id: AUD-LUX
            cells: {market: premium, cpm: 31}

  - id: public_02_select_urban_and_create_default_media_mix
    tier: core
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_urban_button.click
        expect:
          - {op: equals, path: current_page, value: mix}
          - {op: equals, path: selected_audience_id, value: AUD-URBAN}
          - {op: equals, path: selected_reach, value: 420000}
      - do: create_mix_button.click
        expect:
          - {op: equals, path: mix_count, value: 3}
          - {op: equals, path: allocation_total, value: 100}
          - {op: equals, path: planned_budget, value: 125000}
          - {op: equals, path: forecast_status, value: stale}
      - table: mix_grid
        expect_order: [MIX-CTV, MIX-SOCIAL, MIX-RETAIL]
        expect_rows:
          - id: MIX-CTV
            cells: {channel: CTV, weight: 50, budget: 62500, state: planned}
          - id: MIX-RETAIL
            cells: {channel: Retail Media, kpi: store_lift}

  - id: public_03_rebalance_mix_and_run_reach_forecast
    tier: service
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_urban_button.click
      - do: create_mix_button.click
      - do: rebalance_mix_button.click
        expect:
          - {op: equals, path: frequency_status, value: balanced}
          - {op: equals, path: forecast_status, value: stale}
      - table: mix_grid
        expect_order: [MIX-CTV, MIX-SOCIAL, MIX-RETAIL]
        expect_rows:
          - id: MIX-CTV
            cells: {weight: 45, budget: 56250, state: capped}
          - id: MIX-SOCIAL
            cells: {weight: 20, state: reduced}
          - id: MIX-RETAIL
            cells: {weight: 35, state: boosted}
      - do: run_forecast_button.click
        expect:
          - {op: equals, path: forecast_status, value: forecasted}
          - {op: equals, path: reach_forecast, value: 612000}
          - {op: equals, path: frequency_cap, value: 3}
          - {op: equals, path: service_call_count, value: 1}

  - id: public_04_strategist_cannot_lock_budget
    tier: permission
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_urban_button.click
      - do: create_mix_button.click
      - do: run_forecast_button.click
      - do: finance_lock_budget_button.click
        mode: unauthorized
        expect:
          - {op: equals, path: active_role, value: strategist}
          - {op: equals, path: budget_status, value: idle}
          - {op: equals, path: denied_count, value: 1}
          - {op: equals, path: last_action, value: unauthorized_finance}

  - id: public_05_finance_locks_forecast_budget
    tier: permission
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_urban_button.click
      - do: create_mix_button.click
      - do: run_forecast_button.click
      - do: role_finance_button.click
      - do: finance_lock_budget_button.click
        expect:
          - {op: equals, path: budget_status, value: locked}
          - {op: equals, path: approved_budget, value: 125000}
          - {op: equals, path: budget_key, value: FY27-AURORA-125K}
          - {op: equals, path: audit_count, value: 1}
      - table: audit_grid
        expect_order: [AUD-BUDGET]
        expect_rows:
          - id: AUD-BUDGET
            cells: {event: budget_lock, actor: finance, status: locked}

  - id: public_06_inventory_deal_upload_populates_deal_room
    tier: upload
    difficulty: C
    steps:
      - do: reset_button.click
      - do: go_deals_button.click
      - do: inventory_upload_input.upload
        input:
          file:
            name: public-inventory.csv
            mime_type: text/csv
            content: |
              id,partner,channel,market,impressions,safety
              INV-CTV,Northstar CTV,CTV,metro,410000,clean
              INV-RET,CartLoop Retail,Retail Media,shopper,280000,clean
          rows:
            - {id: INV-CTV, partner: Northstar CTV, channel: CTV, market: metro, impressions: 410000, safety: clean}
            - {id: INV-RET, partner: CartLoop Retail, channel: Retail Media, market: shopper, impressions: 280000, safety: clean}
        expect:
          - {op: equals, path: inventory_count, value: 2}
          - {op: equals, path: last_inventory_file, value: public-inventory.csv}
          - {op: equals, path: deal_status, value: loaded}
          - {op: equals, path: brand_safety_status, value: review}
      - table: inventory_grid
        expect_order: [INV-CTV, INV-RET]
        expect_rows:
          - id: INV-CTV
            cells: {partner: Northstar CTV, channel: CTV, impressions: 410000, safety: clean}

  - id: public_07_strategist_cannot_validate_deals
    tier: permission
    difficulty: C
    steps:
      - do: reset_button.click
      - do: go_deals_button.click
      - do: inventory_upload_input.upload
        input:
          file:
            name: unauthorized-deals.csv
            mime_type: text/csv
            content: |
              id,partner,channel,market,impressions,safety
              INV-CTV,Northstar CTV,CTV,metro,410000,clean
          rows:
            - {id: INV-CTV, partner: Northstar CTV, channel: CTV, market: metro, impressions: 410000, safety: clean}
      - do: buyer_validate_deals_button.click
        mode: unauthorized
        expect:
          - {op: equals, path: active_role, value: strategist}
          - {op: equals, path: deal_status, value: loaded}
          - {op: equals, path: denied_count, value: 1}
          - {op: equals, path: last_action, value: unauthorized_buyer}

  - id: public_08_buyer_validates_inventory_deals
    tier: permission
    difficulty: C
    steps:
      - do: reset_button.click
      - do: go_deals_button.click
      - do: inventory_upload_input.upload
        input:
          file:
            name: buyer-deals.csv
            mime_type: text/csv
            content: |
              id,partner,channel,market,impressions,safety
              INV-CTV,Northstar CTV,CTV,metro,410000,clean
              INV-SOC,CreatorGraph Social,Paid Social,digital,360000,clean
          rows:
            - {id: INV-CTV, partner: Northstar CTV, channel: CTV, market: metro, impressions: 410000, safety: clean}
            - {id: INV-SOC, partner: CreatorGraph Social, channel: Paid Social, market: digital, impressions: 360000, safety: clean}
      - do: role_buyer_button.click
      - do: buyer_validate_deals_button.click
        expect:
          - {op: equals, path: deal_status, value: validated}
          - {op: equals, path: brand_safety_status, value: approved}
          - {op: equals, path: brand_safety_score, value: 94}
          - {op: equals, path: audit_count, value: 1}
      - table: audit_grid
        expect_order: [AUD-DEALS]
        expect_rows:
          - id: AUD-DEALS
            cells: {event: deal_validation, actor: buyer, status: approved}

  - id: public_09_strategist_cannot_build_holdout_cells
    tier: permission
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_urban_button.click
      - do: create_mix_button.click
      - do: run_forecast_button.click
      - do: go_experiments_button.click
      - do: build_holdout_button.click
