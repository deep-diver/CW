        expect:
          - {op: equals, path: holdout_status, value: idle}
          - {op: equals, path: experiment_count, value: 0}
          - {op: equals, path: denied_count, value: 1}
          - {op: equals, path: last_action, value: unauthorized_analyst}

  - id: public_10_analyst_builds_incrementality_holdout
    tier: permission
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_urban_button.click
      - do: create_mix_button.click
      - do: run_forecast_button.click
      - do: go_experiments_button.click
      - do: role_analyst_button.click
      - do: build_holdout_button.click
        expect:
          - {op: equals, path: holdout_status, value: balanced}
          - {op: equals, path: lift_model_status, value: configured}
          - {op: equals, path: experiment_count, value: 2}
      - table: experiment_grid
        expect_order: [EXP-TEST, EXP-HOLDOUT]
        expect_rows:
          - id: EXP-HOLDOUT
            cells: {cell: holdout, allocation: 10, measurement: suppressed}

  - id: public_11_analyst_activates_measurement_beacons
    tier: service
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_urban_button.click
      - do: create_mix_button.click
      - do: run_forecast_button.click
      - do: go_experiments_button.click
      - do: role_analyst_button.click
      - do: build_holdout_button.click
      - do: activate_beacons_button.click
        expect:
          - {op: equals, path: beacon_status, value: live}
          - {op: equals, path: service_call_count, value: 2}
          - {op: equals, path: audit_count, value: 1}
      - table: audit_grid
        expect_order: [AUD-BEACON]
        expect_rows:
          - id: AUD-BEACON
            cells: {event: measurement_beacon, actor: analyst, status: live}

  - id: public_12_buyer_exports_pacing_guardrails
    tier: core
    difficulty: C
    steps:
      - do: reset_button.click
      - do: go_activate_button.click
      - do: role_buyer_button.click
      - do: export_guardrails_button.click
        expect:
          - {op: equals, path: guardrail_count, value: 3}
          - {op: equals, path: pacing_status, value: monitoring}
          - {op: equals, path: pacing_index, value: 101}
      - table: guardrail_grid
        expect_order: [GRD-CPM, GRD-FREQ, GRD-PACE]
        expect_rows:
          - id: GRD-FREQ
            cells: {metric: frequency, threshold: "<= 3", owner: analyst, state: armed}

  - id: public_13_director_launch_requires_complete_media_stack
    tier: journey
    difficulty: C
    steps:
      - do: reset_button.click
      - do: select_urban_button.click
      - do: create_mix_button.click
      - do: rebalance_mix_button.click
      - do: run_forecast_button.click
      - do: role_finance_button.click
      - do: finance_lock_budget_button.click
      - do: go_deals_button.click
      - do: inventory_upload_input.upload
        input:
          file:
            name: launch-inventory.csv
            mime_type: text/csv
            content: |
              id,partner,channel,market,impressions,safety
              INV-CTV,Northstar CTV,CTV,metro,410000,clean
              INV-SOC,CreatorGraph Social,Paid Social,digital,360000,clean
              INV-RET,CartLoop Retail,Retail Media,shopper,280000,clean
          rows:
            - {id: INV-CTV, partner: Northstar CTV, channel: CTV, market: metro, impressions: 410000, safety: clean}
            - {id: INV-SOC, partner: CreatorGraph Social, channel: Paid Social, market: digital, impressions: 360000, safety: clean}
            - {id: INV-RET, partner: CartLoop Retail, channel: Retail Media, market: shopper, impressions: 280000, safety: clean}
      - do: role_buyer_button.click
      - do: buyer_validate_deals_button.click
      - do: go_experiments_button.click
      - do: role_analyst_button.click
      - do: build_holdout_button.click
      - do: activate_beacons_button.click
      - do: go_activate_button.click
      - do: role_buyer_button.click
      - do: export_guardrails_button.click
      - do: role_director_button.click
      - do: director_launch_button.click
        expect:
          - {op: equals, path: activation_status, value: live}
          - {op: equals, path: activation_count, value: 1}
          - {op: equals, path: readiness_score, value: 100}
          - {op: equals, path: audit_count, value: 4}
      - table: activation_grid
        expect_order: [ACT-001]
        expect_rows:
          - id: ACT-001
            cells: {campaign: Aurora Omnichannel Flight, audience: Urban Commuter Video, budget: 125000, status: live}

