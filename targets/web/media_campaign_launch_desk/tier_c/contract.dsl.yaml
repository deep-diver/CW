dsl_version: "3.0.0"

app:
  id: media_campaign_launch_desk_tier_c
  name: Media Campaign Launch Desk Tier C
  capability: omnichannel_media_investment_control_room
  ui_ux_brief: |
    Media Campaign Launch Desk Tier C should feel like a premium media agency's
    omnichannel investment control room, not a broadcast switcher, signal-QC
    tower, registrar console, clinic board, travel grid, or generic analytics
    dashboard. A screenshot should immediately read as harder than Tier B while
    staying native to media planning: audience opportunity maps, channel-mix
    allocation lanes, reach/frequency forecast cards, inventory-deal intake,
    brand-safety checks, budget lock controls, holdout experiment cells,
    measurement beacon status, pacing guardrails, activation ledger, and audit
    trail should all be coordinated on screen. Use a bright editorial media
    studio language with paper-white planning surfaces, ink typography, cobalt
    decision rails, teal reach signals, magenta experiment accents, amber
    budget warnings, lime-ready states, density suited for campaign operators,
    and chart-like media-planning visuals. Avoid dark broadcast switcher
    canvases, waveform/QC visuals, campus paperwork, checkout flows, and
    decorative marketing hero pages.

runtime:
  target: web
  start_url: /#/audiences
  state_probe:
    kind: javascript
    expression: window.__DETOX_STATE__
  pages:
    audiences:
      path: /#/audiences
      purpose: Audience portfolio, opportunity filter, and selected audience dossier.
    mix:
      path: /#/mix
      purpose: Omnichannel budget split, reach/frequency forecast, and finance lock.
    deals:
      path: /#/deals
      purpose: Inventory deal upload, brand-safety validation, and buyer approval.
    experiments:
      path: /#/experiments
      purpose: Holdout design, incrementality cells, and measurement beacon activation.
    activate:
      path: /#/activate
      purpose: Activation readiness, pacing guardrails, launch ledger, and audit trail.
  session:
    role_path: active_role
    roles: [strategist, buyer, analyst, finance, director]
  persistence:
    reload:
      scope: local_storage
      paths:
        - current_page
        - active_role
        - audiences
        - visible_audiences
        - current_filter
        - selected_audience_id
        - selected_audience_name
        - selected_market
        - selected_intent
        - selected_reach
        - selected_cpm
        - mix_rows
        - mix_count
        - allocation_total
        - planned_budget
        - forecast_status
        - reach_forecast
        - frequency_cap
        - frequency_status
        - budget_status
        - approved_budget
        - budget_key
        - inventory_rows
        - inventory_count
        - last_inventory_file
        - deal_status
        - brand_safety_status
        - brand_safety_score
        - experiment_rows
        - experiment_count
        - holdout_status
        - lift_model_status
        - beacon_status
        - guardrail_rows
        - guardrail_count
        - pacing_status
        - pacing_index
        - activation_status
        - activation_rows
        - activation_count
        - readiness_score
        - audit_log
        - audit_count
        - service_call_count
        - denied_count
        - validation_errors
        - last_action

  tables:
    audience_grid:
      selector: '[data-testid="audience-grid"]'
      row_selector: '[data-testid="audience-row"]'
      row_id_attribute: data-audience-id
      source_path: visible_audiences
      row_id_field: id
      columns:
        name: {selector: '[data-col="name"]', state_field: name}
        market: {selector: '[data-col="market"]', state_field: market}
        intent: {selector: '[data-col="intent"]', state_field: intent}
        reach: {selector: '[data-col="reach"]', state_field: reach}
        cpm: {selector: '[data-col="cpm"]', state_field: cpm}
        signal: {selector: '[data-col="signal"]', state_field: signal}
    mix_grid:
      selector: '[data-testid="mix-grid"]'
      row_selector: '[data-testid="mix-row"]'
      row_id_attribute: data-mix-id
      source_path: mix_rows
      row_id_field: id
      columns:
        channel: {selector: '[data-col="channel"]', state_field: channel}
        weight: {selector: '[data-col="weight"]', state_field: weight}
        budget: {selector: '[data-col="budget"]', state_field: budget}
        kpi: {selector: '[data-col="kpi"]', state_field: kpi}
        state: {selector: '[data-col="state"]', state_field: state}
    inventory_grid:
      selector: '[data-testid="inventory-grid"]'
      row_selector: '[data-testid="inventory-row"]'
      row_id_attribute: data-inventory-id
      source_path: inventory_rows
      row_id_field: id
      columns:
        partner: {selector: '[data-col="partner"]', state_field: partner}
        channel: {selector: '[data-col="channel"]', state_field: channel}
        market: {selector: '[data-col="market"]', state_field: market}
        impressions: {selector: '[data-col="impressions"]', state_field: impressions}
        safety: {selector: '[data-col="safety"]', state_field: safety}
    experiment_grid:
      selector: '[data-testid="experiment-grid"]'
      row_selector: '[data-testid="experiment-row"]'
      row_id_attribute: data-experiment-id
      source_path: experiment_rows
      row_id_field: id
      columns:
        cell: {selector: '[data-col="cell"]', state_field: cell}
        audience: {selector: '[data-col="audience"]', state_field: audience}
        allocation: {selector: '[data-col="allocation"]', state_field: allocation}
        measurement: {selector: '[data-col="measurement"]', state_field: measurement}
    guardrail_grid:
      selector: '[data-testid="guardrail-grid"]'
      row_selector: '[data-testid="guardrail-row"]'
      row_id_attribute: data-guardrail-id
      source_path: guardrail_rows
      row_id_field: id
      columns:
        metric: {selector: '[data-col="metric"]', state_field: metric}
        threshold: {selector: '[data-col="threshold"]', state_field: threshold}
        owner: {selector: '[data-col="owner"]', state_field: owner}
        state: {selector: '[data-col="state"]', state_field: state}
    activation_grid:
      selector: '[data-testid="activation-grid"]'
      row_selector: '[data-testid="activation-row"]'
      row_id_attribute: data-activation-id
      source_path: activation_rows
      row_id_field: id
      columns:
        campaign: {selector: '[data-col="campaign"]', state_field: campaign}
        audience: {selector: '[data-col="audience"]', state_field: audience}
        budget: {selector: '[data-col="budget"]', state_field: budget}
        status: {selector: '[data-col="status"]', state_field: status}
    audit_grid:
      selector: '[data-testid="audit-grid"]'
      row_selector: '[data-testid="audit-row"]'
      row_id_attribute: data-audit-id
      source_path: audit_log
      row_id_field: id
      columns:
        event: {selector: '[data-col="event"]', state_field: event}
        actor: {selector: '[data-col="actor"]', state_field: actor}
        status: {selector: '[data-col="status"]', state_field: status}

