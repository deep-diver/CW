    selected_audience_id: {type: string, purpose: Selected audience id.}
    selected_audience_name: {type: string, purpose: Selected audience name.}
    selected_market: {type: string, purpose: Selected market.}
    selected_intent: {type: string, purpose: Selected intent tier.}
    selected_reach: {type: number, purpose: Selected audience reach.}
    selected_cpm: {type: number, purpose: Selected audience CPM.}
    mix_rows: {type: array, purpose: Planned channel allocation rows.}
    mix_count: {type: number, purpose: Number of channel allocation rows.}
    allocation_total: {type: number, purpose: Sum of channel allocation weights.}
    planned_budget: {type: number, purpose: Current planned budget.}
    forecast_status: {type: string, purpose: idle, forecasted, or stale.}
    reach_forecast: {type: number, purpose: Forecast reach after media mix.}
    frequency_cap: {type: number, purpose: Frequency cap set by forecast.}
    frequency_status: {type: string, purpose: idle, balanced, or capped.}
    budget_status: {type: string, purpose: idle or locked.}
    approved_budget: {type: number, purpose: Finance-approved media budget.}
    budget_key: {type: string, purpose: Budget approval key.}
    inventory_rows: {type: array, purpose: Uploaded inventory/deal rows.}
    inventory_count: {type: number, purpose: Number of inventory rows.}
