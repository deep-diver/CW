    budget_status: idle
    approved_budget: 0
    budget_key: ""
    inventory_rows: []
    inventory_count: 0
    last_inventory_file: ""
    deal_status: idle
    brand_safety_status: idle
    brand_safety_score: 0
    experiment_rows: []
    experiment_count: 0
    holdout_status: idle
    lift_model_status: idle
    beacon_status: idle
    guardrail_rows: []
    guardrail_count: 0
    pacing_status: idle
    pacing_index: 0
    activation_status: idle
    activation_rows: []
    activation_count: 0
