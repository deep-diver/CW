          - {op: equals, path: selected_market, value: premium}
          - {op: equals, path: selected_intent, value: high}
          - {op: equals, path: selected_reach, value: 180000}
          - {op: equals, path: selected_cpm, value: 31}
          - {op: equals, path: last_action, value: select_audience}

  create_mix_button:
    kind: button
    selector: '[data-testid="create-mix"]'
    page: mix
    actions:
      click:
        preconditions:
          - {op: one_of, path: selected_audience_id, values: [AUD-URBAN, AUD-FAMILY, AUD-LUX]}
        effects:
          - {op: equals, path: mix_rows, value: [{id: MIX-CTV, channel: CTV, weight: 50, budget: 62500, kpi: completed_views, state: planned}, {id: MIX-SOCIAL, channel: Paid Social, weight: 30, budget: 37500, kpi: qualified_reach, state: planned}, {id: MIX-RETAIL, channel: Retail Media, weight: 20, budget: 25000, kpi: store_lift, state: planned}]}
          - *derive_mix_count
          - {op: equals, path: allocation_total, value: 100}
          - {op: equals, path: planned_budget, value: 125000}
          - {op: equals, path: forecast_status, value: stale}
          - {op: equals, path: frequency_status, value: idle}
          - {op: equals, path: last_action, value: create_mix}
  rebalance_mix_button:
    kind: button
    selector: '[data-testid="rebalance-mix"]'
    page: mix
    actions:
      click:
        effects:
          - {op: equals, path: mix_rows, value: [{id: MIX-CTV, channel: CTV, weight: 45, budget: 56250, kpi: completed_views, state: capped}, {id: MIX-SOCIAL, channel: Paid Social, weight: 20, budget: 25000, kpi: qualified_reach, state: reduced}, {id: MIX-RETAIL, channel: Retail Media, weight: 35, budget: 43750, kpi: store_lift, state: boosted}]}
          - *derive_mix_count
          - {op: equals, path: allocation_total, value: 100}
          - {op: equals, path: planned_budget, value: 125000}
          - {op: equals, path: frequency_status, value: balanced}
          - {op: equals, path: forecast_status, value: stale}
          - {op: equals, path: last_action, value: rebalance_mix}
  run_forecast_button:
    kind: button
    selector: '[data-testid="run-forecast"]'
    page: mix
    actions:
      click:
        preconditions:
          - {op: relation, path: allocation_total, operator: "==", value: 100}
        effects:
          - {op: equals, path: forecast_status, value: forecasted}
          - {op: equals, path: reach_forecast, value: 612000}
          - {op: equals, path: frequency_cap, value: 3}
          - {op: equals, path: frequency_status, value: balanced}
          - {op: changed_by, path: service_call_count, by: 1}
          - {op: equals, path: last_action, value: run_forecast}
  finance_lock_budget_button:
    kind: button
    selector: '[data-testid="finance-lock-budget"]'
    page: mix
    actions:
      click:
        allowed_roles: [finance]
        preconditions:
          - {op: relation, path: allocation_total, operator: "==", value: 100}
          - {op: one_of, path: forecast_status, values: [forecasted]}
        effects:
          - {op: equals, path: budget_status, value: locked}
          - {op: equals, path: approved_budget, value: 125000}
          - {op: equals, path: budget_key, value: FY27-AURORA-125K}
          - {op: appended_object, path: audit_log, value: {id: AUD-BUDGET, event: budget_lock, actor: finance, status: locked}}
          - *derive_audit_count
          - {op: equals, path: last_action, value: finance_lock_budget}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_finance}

  budget_preflight_button:
    kind: button
    selector: '[data-testid="budget-preflight"]'
    page: mix
    actions:
      click:
        effects:
          - {op: equals, path: budget_status, value: idle}
          - {op: equals, path: approved_budget, value: 0}
          - {op: equals, path: validation_errors, value: {budget: forecast_required}}
          - {op: equals, path: last_action, value: budget_lock_blocked}

  inventory_upload_input:
    kind: input
    selector: '[data-testid="inventory-upload"]'
    page: deals
    actions:
      upload:
        file_schema:
          format: csv
          columns:
            - {name: id, type: string}
            - {name: partner, type: string}
            - {name: channel, type: string}
            - {name: market, type: string}
            - {name: impressions, type: number}
            - {name: safety, type: string}
        effects:
          - {op: equals, path: inventory_rows, value_from: input.rows}
          - *derive_inventory_count
          - {op: equals, path: last_inventory_file, value_from: input.file.name}
          - {op: equals, path: deal_status, value: loaded}
          - {op: equals, path: brand_safety_status, value: review}
          - {op: equals, path: brand_safety_score, value: 0}
          - {op: equals, path: last_action, value: upload_inventory}
  buyer_validate_deals_button:
    kind: button
    selector: '[data-testid="buyer-validate-deals"]'
    page: deals
    actions:
      click:
        allowed_roles: [buyer]
        preconditions:
          - {op: relation, path: inventory_count, operator: ">", value: 0}
        effects:
          - {op: equals, path: deal_status, value: validated}
          - {op: equals, path: brand_safety_status, value: approved}
          - {op: equals, path: brand_safety_score, value: 94}
          - {op: appended_object, path: audit_log, value: {id: AUD-DEALS, event: deal_validation, actor: buyer, status: approved}}
          - *derive_audit_count
          - {op: equals, path: last_action, value: buyer_validate_deals}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_buyer}

  build_holdout_button:
    kind: button
    selector: '[data-testid="build-holdout"]'
    page: experiments
    actions:
      click:
        allowed_roles: [analyst]
        preconditions:
          - {op: one_of, path: forecast_status, values: [forecasted]}
        effects:
          - {op: equals, path: experiment_rows, value: [{id: EXP-TEST, cell: test, audience: Urban Commuter Video, allocation: 90, measurement: exposed}, {id: EXP-HOLDOUT, cell: holdout, audience: Urban Commuter Video, allocation: 10, measurement: suppressed}]}
          - *derive_experiment_count
          - {op: equals, path: holdout_status, value: balanced}
          - {op: equals, path: lift_model_status, value: configured}
          - {op: equals, path: last_action, value: build_holdout}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_analyst}
  activate_beacons_button:
    kind: button
    selector: '[data-testid="activate-beacons"]'
    page: experiments
    actions:
      click:
        allowed_roles: [analyst]
        preconditions:
          - {op: relation, path: experiment_count, operator: ">", value: 0}
        effects:
          - {op: equals, path: beacon_status, value: live}
          - {op: changed_by, path: service_call_count, by: 1}
          - {op: appended_object, path: audit_log, value: {id: AUD-BEACON, event: measurement_beacon, actor: analyst, status: live}}
          - *derive_audit_count
          - {op: equals, path: last_action, value: activate_beacons}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_analyst}

  export_guardrails_button:
    kind: button
    selector: '[data-testid="export-guardrails"]'
    page: activate
    actions:
      click:
        allowed_roles: [buyer, analyst]
        effects:
          - {op: equals, path: guardrail_rows, value: [{id: GRD-CPM, metric: blended_cpm, threshold: "< 24", owner: buyer, state: armed}, {id: GRD-FREQ, metric: frequency, threshold: "<= 3", owner: analyst, state: armed}, {id: GRD-PACE, metric: daily_pacing, threshold: "92-108", owner: buyer, state: armed}]}
          - *derive_guardrail_count
          - {op: equals, path: pacing_status, value: monitoring}
          - {op: equals, path: pacing_index, value: 101}
          - {op: equals, path: last_action, value: export_guardrails}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_guardrails}
  director_launch_button:
    kind: button
    selector: '[data-testid="director-launch"]'
    page: activate
    actions:
      click:
        allowed_roles: [director]
        preconditions:
          - {op: one_of, path: budget_status, values: [locked]}
          - {op: one_of, path: deal_status, values: [validated]}
          - {op: one_of, path: beacon_status, values: [live]}
          - {op: relation, path: guardrail_count, operator: ">", value: 0}
        effects:
          - {op: equals, path: activation_status, value: live}
          - {op: equals, path: readiness_score, value: 100}
          - {op: equals, path: activation_rows, value: [{id: ACT-001, campaign: Aurora Omnichannel Flight, audience: Urban Commuter Video, budget: 125000, status: live}]}
          - *derive_activation_count
          - {op: appended_object, path: audit_log, value: {id: AUD-LAUNCH, event: activation_launch, actor: director, status: live}}
          - *derive_audit_count
          - {op: equals, path: last_action, value: director_launch}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_director}

  launch_preflight_button:
    kind: button
    selector: '[data-testid="launch-preflight"]'
    page: activate
    actions:
      click:
        effects:
          - {op: equals, path: activation_status, value: blocked}
          - {op: equals, path: activation_count, value: 0}
          - {op: equals, path: validation_errors, value: {launch: guardrails_required}}
          - {op: equals, path: last_action, value: launch_blocked}
