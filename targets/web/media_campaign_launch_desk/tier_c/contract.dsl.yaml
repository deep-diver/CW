    lift_model_status: {type: string, purpose: idle or configured.}
    beacon_status: {type: string, purpose: idle or live.}
    guardrail_rows: {type: array, purpose: Pacing guardrail rows.}
    guardrail_count: {type: number, purpose: Number of guardrails.}
    pacing_status: {type: string, purpose: idle or monitoring.}
    pacing_index: {type: number, purpose: Current pacing index.}
    activation_status: {type: string, purpose: idle, blocked, or live.}
    activation_rows: {type: array, purpose: Activation ledger rows.}
    activation_count: {type: number, purpose: Number of activation ledger rows.}
    readiness_score: {type: number, purpose: Activation readiness score.}
    audit_log: {type: array, purpose: Ordered audit rows.}
    audit_count: {type: number, purpose: Audit event count.}
    service_call_count: {type: number, purpose: Deterministic service call count.}
    denied_count: {type: number, purpose: Unauthorized action count.}
    validation_errors: {type: object, purpose: Public validation errors.}
    last_action: {type: string, purpose: Last public action marker.}

x-derived:
  mix_count: &derive_mix_count {op: equals_length, path: mix_count, source_path: mix_rows}
  inventory_count: &derive_inventory_count {op: equals_length, path: inventory_count, source_path: inventory_rows}
  experiment_count: &derive_experiment_count {op: equals_length, path: experiment_count, source_path: experiment_rows}
  guardrail_count: &derive_guardrail_count {op: equals_length, path: guardrail_count, source_path: guardrail_rows}
  activation_count: &derive_activation_count {op: equals_length, path: activation_count, source_path: activation_rows}
  audit_count: &derive_audit_count {op: equals_length, path: audit_count, source_path: audit_log}

components:
  reset_button:
    kind: button
    selector: '[data-testid="reset"]'
    actions:
      click:
        effects:
          - {op: equals, path: current_page, value: audiences}
          - {op: equals, path: active_role, value: strategist}
          - {op: equals, path: current_filter, value: all}
          - {op: equals, path: visible_audiences, value: [{id: AUD-URBAN, name: Urban Commuter Video, market: metro, intent: high, reach: 420000, cpm: 18, signal: mobility}, {id: AUD-FAMILY, name: Family Weekend Streamers, market: suburban, intent: medium, reach: 510000, cpm: 22, signal: streaming}, {id: AUD-GAMER, name: Late Night Gamers, market: digital, intent: high, reach: 260000, cpm: 14, signal: gaming}, {id: AUD-LUX, name: Luxury Travel Planners, market: premium, intent: high, reach: 180000, cpm: 31, signal: travel}, {id: AUD-RETAIL, name: Retail Basket Builders, market: shopper, intent: medium, reach: 390000, cpm: 16, signal: commerce}]}
          - {op: equals, path: selected_audience_id, value: ""}
          - {op: equals, path: selected_audience_name, value: ""}
          - {op: equals, path: selected_market, value: ""}
          - {op: equals, path: selected_intent, value: ""}
          - {op: equals, path: selected_reach, value: 0}
          - {op: equals, path: selected_cpm, value: 0}
          - {op: equals, path: mix_rows, value: []}
          - {op: equals, path: mix_count, value: 0}
          - {op: equals, path: allocation_total, value: 0}
          - {op: equals, path: planned_budget, value: 0}
          - {op: equals, path: forecast_status, value: idle}
          - {op: equals, path: reach_forecast, value: 0}
          - {op: equals, path: frequency_cap, value: 0}
          - {op: equals, path: frequency_status, value: idle}
          - {op: equals, path: budget_status, value: idle}
          - {op: equals, path: approved_budget, value: 0}
          - {op: equals, path: budget_key, value: ""}
          - {op: equals, path: inventory_rows, value: []}
          - {op: equals, path: inventory_count, value: 0}
          - {op: equals, path: last_inventory_file, value: ""}
          - {op: equals, path: deal_status, value: idle}
          - {op: equals, path: brand_safety_status, value: idle}
          - {op: equals, path: brand_safety_score, value: 0}
          - {op: equals, path: experiment_rows, value: []}
          - {op: equals, path: experiment_count, value: 0}
          - {op: equals, path: holdout_status, value: idle}
          - {op: equals, path: lift_model_status, value: idle}
          - {op: equals, path: beacon_status, value: idle}
          - {op: equals, path: guardrail_rows, value: []}
          - {op: equals, path: guardrail_count, value: 0}
          - {op: equals, path: pacing_status, value: idle}
          - {op: equals, path: pacing_index, value: 0}
          - {op: equals, path: activation_status, value: idle}
          - {op: equals, path: activation_rows, value: []}
          - {op: equals, path: activation_count, value: 0}
          - {op: equals, path: readiness_score, value: 0}
          - {op: equals, path: audit_log, value: []}
          - {op: equals, path: audit_count, value: 0}
          - {op: equals, path: service_call_count, value: 0}
          - {op: equals, path: denied_count, value: 0}
          - {op: equals, path: validation_errors, value: {}}
          - {op: equals, path: last_action, value: reset}

  go_audiences_button:
    kind: button
    selector: '[data-testid="go-audiences"]'
    actions: {click: {navigate_to: audiences, effects: [{op: equals, path: current_page, value: audiences}, {op: equals, path: last_action, value: nav_audiences}]}}
  go_mix_button:
    kind: button
    selector: '[data-testid="go-mix"]'
    actions: {click: {navigate_to: mix, effects: [{op: equals, path: current_page, value: mix}, {op: equals, path: last_action, value: nav_mix}]}}
  go_deals_button:
    kind: button
    selector: '[data-testid="go-deals"]'
