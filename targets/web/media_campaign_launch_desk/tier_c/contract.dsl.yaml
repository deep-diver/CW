  schema:
    current_page: {type: string, purpose: Active route page.}
    active_role: {type: string, purpose: Current media-planning role.}
    audiences: {type: array, purpose: Master audience opportunity catalog.}
    visible_audiences: {type: array, purpose: Filtered audience projection.}
