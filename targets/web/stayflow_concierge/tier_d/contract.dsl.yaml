      - {id: D-APPROVAL, label: Manager approval captured, status: open}
      - {id: D-CHECKLIST, label: Three review checks complete, status: open}
      - {id: D-EXCEPTIONS, label: Exception queue cleared, status: open}
      - {id: D-BOOKING, label: Booking confirmed, status: open}
