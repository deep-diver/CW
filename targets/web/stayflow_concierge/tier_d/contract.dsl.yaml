    kind: button
    selector: '[data-testid="build-readiness"]'
    actions:
      click:
        preconditions:
          - {op: relation, path: traveler_count, operator: ">", value: 0}
          - {op: relation, path: document_count, operator: ">", value: 0}
        effects:
          - *derive_readiness_projection
          - *derive_ready_count
          - *derive_missing_document_count
          - {op: equals, path: last_action, value: build_readiness}
  open_document_exception_button:
    kind: button
    selector: '[data-testid="open-document-exception"]'
    actions:
      click:
        preconditions: [{op: relation, path: missing_document_count, operator: ">", value: 0}]
        effects:
          - {op: appended_object, path: exception_queue, value: {id: EX-DOCS, type: documents, status: open, owner: agent}}
          - *derive_open_exceptions
          - {op: equals, path: booking_status, value: blocked}
          - {op: equals, path: last_action, value: open_document_exception}
  resolve_document_exception_button:
    kind: button
    selector: '[data-testid="resolve-document-exception"]'
    actions:
      click:
        allowed_roles: [agent, manager]
        effects:
          - {op: updated_first_where, path: exception_queue, where: [{op: equals, field: id, value: EX-DOCS}], updates: {status: resolved}}
          - *derive_open_exceptions
          - {op: equals, path: last_action, value: resolve_document_exception}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: deny_resolve_document_exception}
  request_supplier_holds_button:
    kind: button
    selector: '[data-testid="request-supplier-holds"]'
    actions:
      click:
        preconditions: [{op: equals, path: route_key, value: BUSAN_SEOUL_KYOTO_JEJU}]
        effects:
          - {op: equals, path: supplier_holds, value: [{id: HOLD-BUSAN, city: Busan, status: confirmed, version: 2}, {id: HOLD-SEOUL, city: Seoul, status: confirmed, version: 2}, {id: HOLD-KYOTO, city: Kyoto, status: confirmed, version: 2}, {id: HOLD-JEJU, city: Jeju, status: confirmed, version: 2}]}
          - *derive_service_call_count
          - *derive_hold_call_count
          - {op: equals, path: supplier_status, value: confirmed}
          - {op: equals, path: supplier_version, value: 2}
          - {op: relation, path: supplier_draft_version, operator: "==", other_path: supplier_version}
          - *derive_hold_count
          - *derive_confirmed_hold_count
          - {op: equals, path: last_action, value: request_supplier_holds}
  external_supplier_change_button:
    kind: button
    selector: '[data-testid="external-supplier-change"]'
    actions:
      click:
        preconditions: [{op: relation, path: hold_count, operator: ">", value: 0}]
        effects:
          - {op: changed_by, path: supplier_version, by: 1}
          - {op: unchanged, path: supplier_draft_version}
          - {op: updated_first_where, path: supplier_holds, where: [{op: equals, field: id, value: HOLD-KYOTO}], updates: {status: stale}}
          - {op: equals, path: supplier_status, value: external_change}
          - {op: equals, path: last_action, value: external_supplier_change}
  refresh_supplier_draft_button:
    kind: button
    selector: '[data-testid="refresh-supplier-draft"]'
    actions:
      click:
        effects:
          - {op: relation, path: supplier_draft_version, operator: "==", other_path: supplier_version}
          - {op: updated_all_where, path: supplier_holds, where: [{op: equals, field: status, value: stale}], updates: {status: confirmed}}
          - *derive_confirmed_hold_count
          - {op: equals, path: supplier_status, value: refreshed}
          - {op: equals, path: last_action, value: refresh_supplier_draft}
  release_supplier_holds_button:
    kind: button
    selector: '[data-testid="release-supplier-holds"]'
    actions:
      click:
        preconditions:
          - {op: relation, path: hold_count, operator: ">", value: 0}
          - {op: relation, path: supplier_draft_version, operator: "==", other_path: supplier_version}
        effects:
          - {op: updated_all_where, path: supplier_holds, where: [{op: equals, field: status, value: confirmed}], updates: {status: released}}
          - *derive_confirmed_hold_count
          - {op: equals, path: supplier_status, value: released}
          - {op: equals, path: last_action, value: release_supplier_holds}
        conflict_when:
          - {op: relation, path: hold_count, operator: ">", value: 0}
          - {op: relation, path: supplier_draft_version, operator: "!=", other_path: supplier_version}
        conflict_effects:
          - {op: changed_by, path: conflict_count, by: 1}
          - {op: equals, path: supplier_status, value: conflict_stale_supplier}
          - {op: equals, path: last_action, value: conflict_release_supplier_holds}
  payment_amount_input:
    kind: input
    selector: '[data-testid="payment-amount"]'
    actions:
      fill:
        effects:
          - {op: equals_normalized, path: payment_amount_key, value_from: input.value, normalizers: [currency_number]}
          - {op: equals, path: last_action, value: edit_payment_amount}
  authorize_payment_button:
    kind: button
    selector: '[data-testid="authorize-payment"]'
    actions:
      click:
        preconditions: [{op: relation, path: payment_amount_key, operator: "!=", value: ""}]
        effects:
          - *derive_service_call_count
          - *derive_payment_call_count
          - {op: one_of, path: payment_status, values: [authorized, shortfall]}
          - {op: one_of, path: payment_authorized, values: [true, false]}
          - {op: appended_object, path: payment_ledger, value: {id: {after_path: payment_count}, amount_key: {from_path: payment_amount_key}}}
          - *derive_payment_count
          - {op: equals, path: last_action, value: authorize_payment}
  check_supplier_button:
    kind: button
    selector: '[data-testid="check-supplier"]'
    actions:
      click:
        allowed_roles: [agent]
        effects:
          - {op: updated_object_fields, path: review_checklist, updates: {supplier: true}}
          - *derive_checklist_count
          - {op: equals, path: last_action, value: check_supplier}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: deny_check_supplier}
  check_documents_button:
    kind: button
    selector: '[data-testid="check-documents"]'
    actions:
      click:
        allowed_roles: [agent]
        effects:
          - {op: updated_object_fields, path: review_checklist, updates: {documents: true}}
          - *derive_checklist_count
          - {op: equals, path: last_action, value: check_documents}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: deny_check_documents}
  check_payment_button:
    kind: button
    selector: '[data-testid="check-payment"]'
    actions:
      click:
        allowed_roles: [agent]
        effects:
          - {op: updated_object_fields, path: review_checklist, updates: {payment: true}}
          - *derive_checklist_count
          - {op: equals, path: last_action, value: check_payment}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: deny_check_payment}
  manager_approve_button:
    kind: button
    selector: '[data-testid="manager-approve"]'
    actions:
      click:
        allowed_roles: [manager]
        preconditions:
          - {op: equals, path: approval_status, value: required}
          - {op: relation, path: open_exception_count, operator: "==", value: 0}
        effects:
          - {op: equals, path: approval_status, value: approved}
          - {op: appended_object, path: audit_events, value: {id: {after_path: audit_count}, event: manager_approve, role: {from_path: active_role}}}
          - *derive_audit_count
          - {op: equals, path: last_action, value: manager_approve}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: deny_manager_approve}
  final_confirm_button:
    kind: button
    selector: '[data-testid="final-confirm"]'
    actions:
      click:
        allowed_roles: [agent]
        preconditions:
          - {op: equals, path: quote_status, value: ready}
          - {op: equals, path: supplier_status, value: released}
          - {op: equals, path: payment_authorized, value: true}
          - {op: equals, path: approval_status, value: approved}
          - {op: equals, path: open_exception_count, value: 0}
          - {op: equals, path: checklist_completed_count, value: 3}
        effects:
          - {op: equals, path: booking_status, value: confirmed}
          - {op: appended_object, path: audit_events, value: {id: {after_path: audit_count}, event: final_confirm, role: {from_path: active_role}}}
          - *derive_audit_count
          - {op: equals, path: last_action, value: final_confirm}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: deny_final_confirm}
  seal_release_button:
    kind: button
    selector: '[data-testid="seal-release"]'
    page: review
    actions:
      click:
        allowed_roles: [manager]
        preconditions:
          - {op: equals, path: quote_status, value: ready}
          - {op: equals, path: supplier_status, value: released}
          - {op: equals, path: payment_authorized, value: true}
          - {op: equals, path: approval_status, value: approved}
          - {op: equals, path: checklist_completed_count, value: 3}
          - {op: equals, path: open_exception_count, value: 0}
          - {op: equals, path: booking_status, value: confirmed}
        rejected_when:
          - {op: not_one_of, path: booking_status, values: [confirmed]}
        rejected_effects:
          - {op: equals, path: tier_d_seal_status, value: blocked}
          - {op: equals, path: last_action, value: seal_blocked}
        effects:
          - {op: equals, path: tier_d_seal_status, value: sealed}
          - {op: equals, path: tier_d_release_score, value: 100}
          - {op: equals, path: tier_d_open_blockers, value: 0}
          - {op: equals, path: tier_d_seal_rows, value: [{id: D-QUOTE, label: Quote ready, status: cleared}, {id: D-SUPPLIERS, label: Supplier holds released, status: cleared}, {id: D-PAYMENT, label: Payment authorized, status: cleared}, {id: D-APPROVAL, label: Manager approval captured, status: cleared}, {id: D-CHECKLIST, label: Three review checks complete, status: cleared}, {id: D-EXCEPTIONS, label: Exception queue cleared, status: cleared}, {id: D-BOOKING, label: Booking confirmed, status: cleared}]}
          - {op: changed_by, path: tier_d_seal_count, by: 1}
          - {op: appended_object, path: audit_events, value: {id: {after_path: audit_count}, event: tier_d_release_sealed, role: {from_path: active_role}}}
          - *derive_audit_count
          - {op: equals, path: last_action, value: seal_release}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: deny_seal_release}
