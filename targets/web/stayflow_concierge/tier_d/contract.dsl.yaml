dsl_version: "3.0.0"
app:
  id: stayflow_concierge_tier_d
  name: StayFlow Concierge Tier D
  capability: trip_release_war_room
  ui_ux_brief: |
    StayFlow Concierge Tier D should look like a production-grade premium travel
    release war room for complex multi-city concierge bookings. A desktop
    screenshot should immediately feel harder than Tier C: rich destination
    discovery, route economics, traveler/document readiness, supplier version
    control, payment authorization, manager approval, final booking confirmation,
    and a post-confirmation release-seal ledger should all be visible as one
    coordinated commercial service. Use polished travel imagery or image-like
    cards, refined operations surfaces, dense but legible ledgers, confidence
    score widgets, and role-aware action clusters. Avoid a generic dashboard,
    landing page, plain table dump, or state debugger.
runtime:
  target: web
  start_url: /#/command
  state_probe:
    kind: javascript
    expression: window.__DETOX_STATE__
  pages:
    command:
      path: /#/command
      purpose: Executive trip command center with readiness, exception, and risk summaries.
    itinerary:
      path: /#/itinerary
      purpose: Multi-city itinerary construction and route add-on operations.
    guests:
      path: /#/guests
      purpose: Traveler manifest and document readiness intake.
    suppliers:
      path: /#/suppliers
      purpose: Supplier hold service, stale version repair, and hold release.
    finance:
      path: /#/finance
      purpose: Quote, promo, payment authorization, and payment ledger workflow.
    review:
      path: /#/review
      purpose: Agent and manager review, approval, and final confirmation workflow.
  session:
    role_path: active_role
    roles: [guest, agent, manager]
  persistence:
    reload:
      scope: local_storage
      paths:
        - current_page
        - active_role
        - stay_catalog
        - visible_stays
        - current_city_filter
        - itinerary_legs
        - leg_count
        - route_key
        - trip_subtotal
        - addon_total
        - service_fee
        - promo_code
        - promo_credit
        - total_due
        - quote_status
        - quote_id
        - quote_risk
        - promo_status
        - travelers
        - traveler_count
        - child_count
        - mobility_count
        - documents
        - document_count
        - missing_document_count
        - readiness_rows
        - ready_count
        - last_traveler_file
        - last_document_file
        - supplier_holds
        - hold_count
        - confirmed_hold_count
        - supplier_version
        - supplier_draft_version
        - supplier_status
        - payment_amount_key
        - payment_status
        - payment_authorized
        - payment_ledger
        - payment_count
        - approval_status
        - booking_status
        - review_checklist
        - checklist_completed_count
        - exception_queue
        - open_exception_count
        - audit_events
        - audit_count
        - denied_count
        - conflict_count
        - service_call_count
        - quote_call_count
        - promo_call_count
        - hold_call_count
        - payment_call_count
        - tier_d_release_score
        - tier_d_open_blockers
        - tier_d_seal_status
        - tier_d_seal_rows
        - tier_d_seal_count
        - last_action
  services:
    quote_check:
      endpoint: /api/tier-c-quote
      method: GET
      responses:
        - id: busan_seoul
          match: {query: {route: BUSAN_SEOUL}}
          status: 200
          json: {quote_id: QC-BS-744, status: ready, risk: balanced}
        - id: busan_seoul_kyoto
          match: {query: {route: BUSAN_SEOUL_KYOTO}}
          status: 200
          json: {quote_id: QC-BSK-912, status: ready, risk: complex}
        - id: busan_seoul_kyoto_jeju
          match: {query: {route: BUSAN_SEOUL_KYOTO_JEJU}}
          status: 200
          json: {quote_id: QC-BSKJ-518, status: ready, risk: elevated}
    promo_validate:
      endpoint: /api/tier-c-promo
      method: GET
      responses:
        - id: ops180
          match: {query: {code: OPS180, route: BUSAN_SEOUL_KYOTO}}
          status: 200
          json: {valid: true, credit: 180, status: applied}
        - id: command260
          match: {query: {code: COMMAND260, route: BUSAN_SEOUL_KYOTO_JEJU}}
          status: 200
          json: {valid: true, credit: 260, status: applied}
        - id: invalid
          match: {query: {code: BADCODE}}
          status: 200
          json: {valid: false, credit: 0, status: rejected}
    supplier_hold:
      endpoint: /api/tier-c-holds
      method: POST
      responses:
        - id: bsk
          match: {body_json: {route: BUSAN_SEOUL_KYOTO}}
          status: 200
          json: {status: confirmed, version: 2}
        - id: bskj
          match: {body_json: {route: BUSAN_SEOUL_KYOTO_JEJU}}
          status: 200
          json: {status: confirmed, version: 2}
    payment_auth:
      endpoint: /api/tier-c-payment
      method: POST
      responses:
        - id: approved
          match: {body_json: {amount_key: "2500"}}
          status: 200
          json: {status: authorized, authorized: true}
        - id: low
          match: {body_json: {amount_key: "1000"}}
          status: 200
          json: {status: shortfall, authorized: false}
  tables:
    stay_grid:
      selector: '[data-testid="stay-grid"]'
      row_selector: '[data-testid="stay-row"]'
      row_id_attribute: data-stay-id
      source_path: visible_stays
      row_id_field: id
      columns:
        name: {selector: '[data-col="name"]', state_field: name}
        city: {selector: '[data-col="city"]', state_field: city}
        base: {selector: '[data-col="base"]', state_field: base}
    itinerary_grid:
      selector: '[data-testid="itinerary-grid"]'
      row_selector: '[data-testid="itinerary-row"]'
      row_id_attribute: data-leg-id
      source_path: itinerary_legs
      row_id_field: id
      columns:
        city: {selector: '[data-col="city"]', state_field: city}
        stay: {selector: '[data-col="stay"]', state_field: stay}
        addon: {selector: '[data-col="addon"]', state_field: addon}
        leg_total: {selector: '[data-col="leg_total"]', state_field: leg_total}
    traveler_grid:
      selector: '[data-testid="traveler-grid"]'
      row_selector: '[data-testid="traveler-row"]'
      row_id_attribute: data-traveler-id
      source_path: travelers
      row_id_field: id
      columns:
        name: {selector: '[data-col="name"]', state_field: name}
        type: {selector: '[data-col="type"]', state_field: type}
        mobility: {selector: '[data-col="mobility"]', state_field: mobility}
    readiness_grid:
      selector: '[data-testid="readiness-grid"]'
      row_selector: '[data-testid="readiness-row"]'
      row_id_attribute: data-traveler-id
      source_path: readiness_rows
      row_id_field: traveler_id
      columns:
        traveler: {selector: '[data-col="traveler"]', state_field: traveler}
        document_status: {selector: '[data-col="document_status"]', state_field: document_status}
        ready: {selector: '[data-col="ready"]', state_field: ready}
    supplier_grid:
      selector: '[data-testid="supplier-grid"]'
      row_selector: '[data-testid="supplier-row"]'
      row_id_attribute: data-hold-id
      source_path: supplier_holds
      row_id_field: id
      columns:
        city: {selector: '[data-col="city"]', state_field: city}
        status: {selector: '[data-col="status"]', state_field: status}
        version: {selector: '[data-col="version"]', state_field: version}
    exception_grid:
      selector: '[data-testid="exception-grid"]'
      row_selector: '[data-testid="exception-row"]'
      row_id_attribute: data-exception-id
      source_path: exception_queue
      row_id_field: id
      columns:
        type: {selector: '[data-col="type"]', state_field: type}
        status: {selector: '[data-col="status"]', state_field: status}
        owner: {selector: '[data-col="owner"]', state_field: owner}
    release_seal_grid:
      selector: '[data-testid="release-seal-grid"]'
      row_selector: '[data-testid="release-seal-row"]'
      row_id_attribute: data-seal-id
      source_path: tier_d_seal_rows
      row_id_field: id
      columns:
        label: {selector: '[data-col="label"]', state_field: label}
        status: {selector: '[data-col="status"]', state_field: status}
