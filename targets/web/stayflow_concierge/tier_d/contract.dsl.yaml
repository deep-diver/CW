    __services.calls: []
  schema:
    current_page: {type: string, purpose: Public active route.}
    active_role: {type: string, purpose: Current public role.}
    stay_catalog: {type: array, purpose: All stay inventory packages.}
    visible_stays: {type: array, purpose: Filtered stay projection.}
    current_city_filter: {type: string, purpose: Current catalog filter.}
    itinerary_legs: {type: array, purpose: Ordered trip leg ledger.}
    leg_count: {type: number, purpose: Count of itinerary legs.}
    route_key: {type: string, purpose: Service route key for quote, hold, and promo services.}
    trip_subtotal: {type: number, purpose: Sum of itinerary base rates.}
    addon_total: {type: number, purpose: Sum of route add-ons.}
    service_fee: {type: number, purpose: Tiered service fee.}
    promo_code: {type: string, purpose: Normalized promo code.}
    promo_credit: {type: number, purpose: Promo credit from service.}
    total_due: {type: number, purpose: Public total due.}
    quote_status: {type: string, purpose: Quote lifecycle status.}
    quote_id: {type: string, purpose: Quote id from service.}
    quote_risk: {type: string, purpose: Quote risk from service.}
    promo_status: {type: string, purpose: Promo lifecycle status.}
    travelers: {type: array, purpose: Uploaded traveler manifest rows.}
    traveler_count: {type: number, purpose: Traveler row count.}
    child_count: {type: number, purpose: Child traveler count.}
    mobility_count: {type: number, purpose: Mobility assistance count.}
    documents: {type: array, purpose: Uploaded document readiness rows.}
    document_count: {type: number, purpose: Document row count.}
    missing_document_count: {type: number, purpose: Missing document count.}
    readiness_rows: {type: array, purpose: Joined traveler/document readiness table.}
    ready_count: {type: number, purpose: Count of ready travelers.}
    last_traveler_file: {type: string, purpose: Last uploaded traveler manifest filename.}
    last_document_file: {type: string, purpose: Last uploaded document readiness filename.}
    supplier_holds: {type: array, purpose: Supplier hold ledger.}
    hold_count: {type: number, purpose: Supplier hold count.}
    confirmed_hold_count: {type: number, purpose: Confirmed supplier hold count.}
    supplier_version: {type: number, purpose: Public supplier ledger version.}
    supplier_draft_version: {type: number, purpose: Draft supplier version for conflict checks.}
    supplier_status: {type: string, purpose: Supplier workflow status.}
    payment_amount_key: {type: string, purpose: Currency-normalized payment amount key.}
    payment_status: {type: string, purpose: Payment authorization status.}
    payment_authorized: {type: boolean, purpose: Payment authorized flag.}
    payment_ledger: {type: array, purpose: Payment authorization events.}
    payment_count: {type: number, purpose: Payment ledger count.}
    approval_status: {type: string, purpose: Manager approval status.}
    booking_status: {type: string, purpose: End-to-end booking lifecycle.}
    review_checklist: {type: object, purpose: Agent review checklist flags.}
    checklist_completed_count: {type: number, purpose: Completed checklist count.}
    exception_queue: {type: array, purpose: Public blocker/exception ledger.}
    open_exception_count: {type: number, purpose: Number of open exceptions.}
    audit_events: {type: array, purpose: Ordered public audit events.}
    audit_count: {type: number, purpose: Audit event count.}
    denied_count: {type: number, purpose: Unauthorized action counter.}
    conflict_count: {type: number, purpose: Conflict action counter.}
    service_call_count: {type: number, purpose: Deterministic service call count.}
    quote_call_count: {type: number, purpose: Quote service call count.}
    promo_call_count: {type: number, purpose: Promo service call count.}
    hold_call_count: {type: number, purpose: Supplier hold service call count.}
    payment_call_count: {type: number, purpose: Payment service call count.}
    tier_d_release_score: {type: number, purpose: Tier D final release readiness score from seven post-confirmation gates.}
    tier_d_open_blockers: {type: number, purpose: Count of Tier D release-seal ledger rows still open.}
    tier_d_seal_status: {type: string, purpose: open, blocked, or sealed final Tier D release state.}
    tier_d_seal_rows: {type: array, purpose: Seven Tier D release-seal gate rows rendered in the review page ledger.}
    tier_d_seal_count: {type: number, purpose: Number of successful Tier D release seals.}
    last_action: {type: string, purpose: Last public action id.}
    __services.calls: {type: array, purpose: Evaluator-provided service call ledger.}

x-derived:
  leg_count: &derive_leg_count {op: equals_length, path: leg_count, source_path: itinerary_legs}
  trip_subtotal: &derive_trip_subtotal {op: equals_sum, path: trip_subtotal, source_path: itinerary_legs, field: base}
  addon_total: &derive_addon_total {op: equals_sum, path: addon_total, source_path: itinerary_legs, field: addon}
  service_fee: &derive_service_fee
    op: equals_piecewise_linear
    path: service_fee
    cases:
      - when: [{op: relation, path: trip_subtotal, operator: ">=", value: 2100}]
        formula: {constant: 188}
      - when: [{op: relation, path: trip_subtotal, operator: ">=", value: 1400}]
        formula: {constant: 132}
      - when: [{op: relation, path: trip_subtotal, operator: ">=", value: 800}]
        formula: {constant: 86}
      - when: [{op: relation, path: trip_subtotal, operator: ">", value: 0}]
        formula: {constant: 48}
    default: {constant: 0}
  total_due: &derive_total_due
    op: equals_linear
    path: total_due
    terms:
      - {path: trip_subtotal}
      - {path: addon_total}
      - {path: service_fee}
      - {path: promo_credit, multiplier: -1}
  traveler_count: &derive_traveler_count {op: equals_length, path: traveler_count, source_path: travelers}
  child_count: &derive_child_count {op: equals_count_where, path: child_count, source_path: travelers, where: [{op: equals, field: type, value: child}]}
  mobility_count: &derive_mobility_count {op: equals_count_where, path: mobility_count, source_path: travelers, where: [{op: equals, field: mobility, value: "yes"}]}
  document_count: &derive_document_count {op: equals_length, path: document_count, source_path: documents}
  missing_document_count: &derive_missing_document_count {op: equals_count_where, path: missing_document_count, source_path: documents, where: [{op: equals, field: document_status, value: missing}]}
  ready_count: &derive_ready_count {op: equals_count_where, path: ready_count, source_path: readiness_rows, where: [{op: equals, field: ready, value: "yes"}]}
  hold_count: &derive_hold_count {op: equals_length, path: hold_count, source_path: supplier_holds}
  confirmed_hold_count: &derive_confirmed_hold_count {op: equals_count_where, path: confirmed_hold_count, source_path: supplier_holds, where: [{op: equals, field: status, value: confirmed}]}
  payment_count: &derive_payment_count {op: equals_length, path: payment_count, source_path: payment_ledger}
  checklist_completed_count: &derive_checklist_count {op: equals_object_key_count, path: checklist_completed_count, source_path: review_checklist}
  open_exception_count: &derive_open_exceptions {op: equals_count_where, path: open_exception_count, source_path: exception_queue, where: [{op: equals, field: status, value: open}]}
  audit_count: &derive_audit_count {op: equals_length, path: audit_count, source_path: audit_events}
  service_call_count: &derive_service_call_count {op: equals_length, path: service_call_count, source_path: __services.calls}
  quote_call_count: &derive_quote_call_count {op: equals_count_where, path: quote_call_count, source_path: __services.calls, where: [{op: equals, field: service, value: quote_check}]}
  promo_call_count: &derive_promo_call_count {op: equals_count_where, path: promo_call_count, source_path: __services.calls, where: [{op: equals, field: service, value: promo_validate}]}
  hold_call_count: &derive_hold_call_count {op: equals_count_where, path: hold_call_count, source_path: __services.calls, where: [{op: equals, field: service, value: supplier_hold}]}
  payment_call_count: &derive_payment_call_count {op: equals_count_where, path: payment_call_count, source_path: __services.calls, where: [{op: equals, field: service, value: payment_auth}]}
  readiness_projection: &derive_readiness_projection
    op: equals_join_projection
    path: readiness_rows
    source_path: travelers
    lookup_path: documents
    source_key: id
    lookup_key: traveler_id
    fields:
      - {name: traveler_id, source_field: id}
      - {name: traveler, source_field: name}
      - {name: type, source_field: type}
      - {name: mobility, source_field: mobility}
      - {name: document_status, lookup_field: document_status}
      - {name: ready, lookup_field: ready}

