      - {id: ST-JEJU-VILLA, city: Jeju, name: Windstone Pool Villa, base: 760, available: true}
    visible_stays:
      - {id: ST-BUSAN-HARBOR, city: Busan, name: Harbor Capsule Hotel, base: 320, available: true}
      - {id: ST-SEOUL-LOFT, city: Seoul, name: Han River Loft, base: 480, available: true}
      - {id: ST-KYOTO-MACHIYA, city: Kyoto, name: Machiya Garden House, base: 620, available: true}
      - {id: ST-JEJU-VILLA, city: Jeju, name: Windstone Pool Villa, base: 760, available: true}
