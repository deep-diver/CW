    itinerary_legs: []
    leg_count: 0
    route_key: ""
    trip_subtotal: 0
    addon_total: 0
    service_fee: 0
    promo_code: ""
    promo_credit: 0
    total_due: 0
    quote_status: idle
    quote_id: ""
    quote_risk: none
    promo_status: idle
    travelers: []
    traveler_count: 0
    child_count: 0
    mobility_count: 0
    documents: []
    document_count: 0
    missing_document_count: 0
    readiness_rows: []
    ready_count: 0
    last_traveler_file: ""
    last_document_file: ""
    supplier_holds: []
    hold_count: 0
    confirmed_hold_count: 0
    supplier_version: 1
    supplier_draft_version: 1
    supplier_status: idle
    payment_amount_key: ""
    payment_status: idle
    payment_authorized: false
    payment_ledger: []
    payment_count: 0
    approval_status: not_required
    booking_status: idle
    review_checklist: {}
    checklist_completed_count: 0
    exception_queue: []
    open_exception_count: 0
    audit_events: []
    audit_count: 0
    denied_count: 0
    conflict_count: 0
    service_call_count: 0
    quote_call_count: 0
    promo_call_count: 0
    hold_call_count: 0
    payment_call_count: 0
    tier_d_release_score: 0
    tier_d_open_blockers: 7
    tier_d_seal_status: open
    tier_d_seal_rows:
      - {id: D-QUOTE, label: Quote ready, status: open}
      - {id: D-SUPPLIERS, label: Supplier holds released, status: open}
