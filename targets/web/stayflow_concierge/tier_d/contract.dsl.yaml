        effects:
          - *derive_service_call_count
          - *derive_quote_call_count
          - {op: one_of, path: quote_status, values: [ready, rejected]}
          - {op: one_of, path: quote_id, values: [QC-BS-744, QC-BSK-912, QC-BSKJ-518, ""]}
          - {op: one_of, path: quote_risk, values: [balanced, complex, elevated, rejected]}
          - {op: equals, path: booking_status, value: quoted}
          - {op: equals, path: last_action, value: request_quote}
  promo_code_input:
    kind: input
    selector: '[data-testid="promo-code"]'
    actions:
      fill:
        effects:
          - {op: equals_normalized, path: promo_code, value_from: input.value, normalizers: [trim, uppercase]}
          - {op: equals, path: last_action, value: edit_promo}
  apply_promo_button:
    kind: button
    selector: '[data-testid="apply-promo"]'
    actions:
      click:
        preconditions:
          - {op: equals, path: quote_status, value: ready}
          - {op: relation, path: promo_code, operator: "!=", value: ""}
        effects:
          - *derive_service_call_count
          - *derive_promo_call_count
          - {op: one_of, path: promo_status, values: [applied, rejected]}
          - *derive_total_due
          - {op: equals, path: last_action, value: apply_promo}
  traveler_upload_input:
    kind: input
    selector: '[data-testid="traveler-upload"]'
    actions:
      upload:
        file_schema:
          format: csv
          columns:
            - {name: id, type: string}
            - {name: name, type: string}
            - {name: type, type: string}
            - {name: mobility, type: string}
        effects:
          - {op: equals, path: travelers, value_from: input.rows}
          - *derive_traveler_count
          - *derive_child_count
          - *derive_mobility_count
          - {op: equals, path: last_traveler_file, value_from: input.file.name}
          - {op: equals, path: last_action, value: upload_travelers}
  document_upload_input:
    kind: input
    selector: '[data-testid="document-upload"]'
    actions:
      upload:
        file_schema:
          format: csv
          columns:
            - {name: traveler_id, type: string}
            - {name: document_status, type: string}
            - {name: ready, type: string}
        effects:
          - {op: equals, path: documents, value_from: input.rows}
