function money(v){return '$'+Number(v||0).toLocaleString()}
function setPage(p){if(!["jobs","booking","visits"].includes(p))return;S.current_page=p;location.hash='#/'+p;save();render()}
function reset(){localStorage.removeItem(KEY);S=structuredClone(initial);S.last_action='reset';location.hash='#/jobs';render()}

function parseCsv(text){const lines=text.trim().split(/\r?\n/);const heads=lines.shift().split(',');return lines.filter(Boolean).map(line=>{const vals=line.split(',');const o={};heads.forEach((h,i)=>o[h.trim()]=(vals[i]||'').trim());return o})}

document.addEventListener('click',e=>{const id=e.target.dataset.testid;if(!id)return;
 if(id==='reset')return reset(); if(id.startsWith('go-'))return setPage(id.replace('go-','')); if(id.startsWith('role-')){S.active_role=id.replace('role-','').replace('quality','quality_manager').replace('claims','claims_manager');S.last_action='role_'+S.active_role;return render()}

 if(id==='book-visit'){if(S.quote_status!=='approved'||S.selected_slot!=='today_4pm'){S.booking_status='blocked';S.last_action='booking_blocked'}else{S.booking_status='scheduled';S.visit_count++;S.visit_history=[...S.visit_history,{id:'VIS-001',service:S.selected_service_name,slot:'today_4pm',status:'scheduled',total:S.quote_amount}];S.last_action='book_visit'}return render()}
 if(id==='pro-accept'){if(S.active_role!=='pro'){S.denied_count++;S.last_action='unauthorized_pro'}else if(S.booking_status==='scheduled'){S.booking_status='accepted';S.last_action='pro_accept'}return render()}
 if(id==='assign-mina'){if(S.active_role!=='dispatcher'){S.denied_count++;S.last_action='unauthorized_dispatch'}else if(S.quote_status==='approved'){S.assigned_technician='TECH-MINA';S.assigned_technician_name='Mina Cho';S.technician_status='assigned';S.last_action='assign_technician'}return render()}

 if(id==='dispatch-visit'){if(S.active_role!=='dispatcher'){S.denied_count++;S.last_action='unauthorized_dispatch'}else if(S.assigned_technician==='TECH-MINA'&&S.parts_ready_count===2){S.dispatch_status='dispatched';S.booking_status='dispatched';S.dispatch_count++;S.last_action='dispatch_visit'}else{S.dispatch_status='blocked';S.last_action='dispatch_blocked'}return render()}

 if(id==='pass-qa'){if(S.active_role==='quality_manager'&&S.dispatch_status==='dispatched'&&S.permit_status==='review'){S.qa_rows=S.qa_rows.map(q=>({...q,status:'cleared'}));S.qa_ready_count=3;S.qa_status='passed';S.booking_status='complete';S.last_action='pass_qa'}return render()}
 if(id==='issue-invoice'){if(S.active_role==='quality_manager'&&S.qa_status==='passed'){S.invoice_status='issued';S.invoice_total=S.quote_amount+S.diagnostic_fee;S.last_action='issue_invoice'}return render()}
 if(id==='preauth-claim'){if(S.active_role==='claims_manager'){S.claim_status='approved';S.service_call_count++;S.last_action='preauth_claim'}return render()}
 if(id==='reconcile-materials'){if(S.active_role==='claims_manager'&&S.material_mismatch_count===0){S.materials_status='reconciled';S.last_action='reconcile_materials'}return render()}
 if(id==='seal-warranty'){if(S.active_role==='claims_manager'&&S.claim_status==='approved'&&S.dispatch_status==='dispatched'&&S.materials_status==='reconciled'&&S.qa_status==='passed'&&S.invoice_status==='issued'){S.warranty_status='sealed';S.warranty_score=100;S.open_warranty_blockers=0;S.warranty_rows=S.warranty_rows.map(w=>({...w,status:'cleared'}));S.warranty_count++;S.last_action='seal_warranty'}else{S.warranty_status='blocked';S.last_action='warranty_blocked'}return render()}
});
document.addEventListener('input',e=>{const id=e.target.dataset.testid;if(id==='address')S.address=e.target.value.trim();if(id==='customer-name')S.customer_name=e.target.value.trim();if(id==='claim-code')S.claim_reference=e.target.value.trim().toUpperCase();render()});
document.addEventListener('change',async e=>{const id=e.target.dataset.testid;const file=e.target.files&&e.target.files[0];if(!file)return;const rows=parseCsv(await file.text());if(id==='permit-upload'){S.permit_rows=rows;S.permit_count=rows.length;S.last_permit_file=file.name;S.permit_status='review';S.last_action='upload_permit'}if(id==='materials-upload'){S.materials_rows=rows;S.material_mismatch_count=rows.filter(r=>r.status==='mismatch').length;S.materials_status='review';S.warranty_status='open';S.last_action='upload_materials'}render()});
window.addEventListener('hashchange',()=>{const p=location.hash.replace('#/','')||'jobs';if(["jobs","booking","visits"].includes(p)){S.current_page=p;render()}});
if(location.hash){const p=location.hash.replace('#/','');if(["jobs","booking","visits"].includes(p))S.current_page=p}render();
</script></body></html>
