dsl_version: "3.0.0"
visibility: private
tier_weights:
  smoke: 1
  core: 2
  validation: 3
  service: 4
  upload: 4
  permission: 4
  persistence: 5
  journey: 6

scenarios:
  - id: private_01_ac_quote_and_acceptance_journey
    tier: journey
    steps:
      - do: reset_button.click
      - do: select_ac_button.click
      - do: go_booking_button.click
      - do: slot_today_button.click
      - do: customer_name_input.fill
        input: {value: "Mina Park"}
      - do: address_input.fill
        input: {value: "88 Cedar House"}
      - do: get_quote_button.click
        expect:
          - {op: equals, path: quote_amount, value: 18900}
      - do: approve_quote_button.click
      - do: book_visit_button.click
      - do: go_visits_button.click
      - do: role_pro_button.click
      - do: pro_accept_button.click
        expect:
          - {op: equals, path: booking_status, value: accepted}

  - id: private_02_address_normalization
    tier: validation
    steps:
      - do: reset_button.click
      - do: go_booking_button.click
      - do: address_input.fill
        input: {value: "  9 Oak Terrace  "}
        expect:
          - {op: equals, path: address, value: "9 Oak Terrace"}

  - id: private_03_homeowner_cannot_assign_technician
    tier: permission
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: get_quote_button.click
      - do: approve_quote_button.click
      - do: go_dispatch_button.click
      - do: assign_mina_button.click
        mode: unauthorized
        expect:
          - {op: equals, path: assigned_technician, value: ""}

  - id: private_04_dispatch_persists_after_reload
    tier: persistence
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: slot_today_button.click
      - do: get_quote_button.click
      - do: approve_quote_button.click
      - do: role_dispatcher_button.click
      - do: go_dispatch_button.click
      - do: assign_mina_button.click
      - do: ready_parts_button.click
      - do: dispatch_visit_button.click
      - browser: reload
        expect:
          - {op: equals, path: dispatch_status, value: dispatched}
          - {op: equals, path: assigned_technician, value: TECH-MINA}

  - id: private_05_invoice_requires_qa
    tier: permission
    steps:
      - do: reset_button.click
      - do: role_quality_manager_button.click
      - do: go_quality_button.click
      - do: issue_invoice_button.click
        mode: rejected
        expect:
          - {op: equals, path: invoice_status, value: idle}

  - id: private_06_full_quality_invoice_path
    tier: journey
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: slot_today_button.click
      - do: get_quote_button.click
      - do: approve_homeowner_button.click
      - do: role_dispatcher_button.click
      - do: go_dispatch_button.click
      - do: assign_mina_button.click
      - do: ready_parts_button.click
      - do: dispatch_visit_button.click
      - do: role_quality_manager_button.click
      - do: go_quality_button.click
      - do: permit_upload_input.upload
        input:
          file:
            name: final-dossier.csv
            mime_type: text/csv
            content: |
              id,document,status
              PM-1,Before photos,ready
              PM-2,Fixture permit,ready
          rows:
            - {id: PM-1, document: "Before photos", status: ready}
            - {id: PM-2, document: "Fixture permit", status: ready}
      - do: pass_qa_button.click
      - do: issue_invoice_button.click
        expect:
          - {op: equals, path: invoice_status, value: issued}
          - {op: equals, path: invoice_total, value: 31700}

  - id: private_07_warranty_seal_full_journey
    tier: journey
    difficulty: D
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: slot_today_button.click
      - do: get_quote_button.click
      - do: approve_homeowner_button.click
      - do: role_dispatcher_button.click
      - do: go_dispatch_button.click
      - do: assign_mina_button.click
      - do: ready_parts_button.click
      - do: dispatch_visit_button.click
      - do: role_quality_manager_button.click
      - do: go_quality_button.click
      - do: permit_upload_input.upload
        input:
          file:
            name: storm-dossier.csv
            mime_type: text/csv
            content: |
              id,document,status
              PM-1,Before photos,ready
              PM-2,Roof access permit,ready
          rows:
            - {id: PM-1, document: "Before photos", status: ready}
            - {id: PM-2, document: "Roof access permit", status: ready}
      - do: pass_qa_button.click
      - do: issue_invoice_button.click
      - do: role_claims_manager_button.click
      - do: go_warranty_button.click
      - do: claim_code_input.fill
        input: {value: " storm-77 "}
      - do: preauth_claim_button.click
      - do: materials_upload_input.upload
        input:
          file:
            name: materials-clear.csv
            mime_type: text/csv
            content: |
              id,item,status
              MT-1,Copper valve,matched
              MT-2,Drywall patch,matched
          rows:
            - {id: MT-1, item: "Copper valve", status: matched}
            - {id: MT-2, item: "Drywall patch", status: matched}
      - do: reconcile_materials_button.click
      - do: seal_warranty_button.click
        expect:
          - {op: equals, path: warranty_status, value: sealed}
          - {op: equals, path: warranty_score, value: 100}
          - {op: equals, path: warranty_count, value: 1}
      - table: warranty_grid
        expect_order: [W-CLAIM, W-DISPATCH, W-MATERIALS, W-QA, W-INVOICE]
        expect_row_count: 5
        expect_rows:
          - id: W-MATERIALS
            cells: {status: cleared}
      - do: materials_upload_input.upload
        input:
          file:
            name: materials-mismatch.csv
            mime_type: text/csv
            content: |
              id,item,status
              MT-1,Copper valve,matched
              MT-2,Drywall patch,mismatch
          rows:
            - {id: MT-1, item: "Copper valve", status: matched}
            - {id: MT-2, item: "Drywall patch", status: mismatch}
        expect:
          - {op: equals, path: warranty_status, value: open}
          - {op: equals, path: materials_status, value: review}
          - {op: equals, path: material_mismatch_count, value: 1}

