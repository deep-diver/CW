dsl_version: "3.0.0"
visibility: public
tier_weights:
  smoke: 1
  core: 2
  validation: 3
  service: 4
  upload: 4
  permission: 4
  persistence: 5
  journey: 6

scenarios:
  - id: public_01_filter_plumbing_services
    tier: smoke
    steps:
      - do: reset_button.click
      - do: filter_plumbing_button.click
        expect:
          - {op: equals, path: selected_category, value: plumbing}
      - table: service_grid
        expect_order: [HF-LEAK]
        expect_row_count: 1
        expect_rows:
          - id: HF-LEAK
            cells: {name: "Burst pipe repair", category: plumbing}

  - id: public_02_quote_emergency_pipe_repair
    tier: service
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: urgency_emergency_button.click
      - do: get_quote_button.click
        expect:
          - {op: equals, path: quote_status, value: ready}
          - {op: equals, path: quote_amount, value: 26800}
          - {op: equals, path: diagnostic_fee, value: 4900}
          - {op: equals, path: service_call_count, value: 1}

  - id: public_03_booking_requires_slot
    tier: validation
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: get_quote_button.click
      - do: approve_quote_button.click
      - do: book_visit_button.click
        mode: rejected
        expect:
          - {op: equals, path: booking_status, value: blocked}

  - id: public_04_book_visit_creates_timeline
    tier: journey
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: urgency_emergency_button.click
      - do: slot_today_button.click
      - do: customer_name_input.fill
        input: {value: "Ari Lee"}
      - do: address_input.fill
        input: {value: "  42 Maple Loft  "}
      - do: get_quote_button.click
      - do: approve_quote_button.click
      - do: book_visit_button.click
        expect:
          - {op: equals, path: booking_status, value: scheduled}
          - {op: equals, path: visit_count, value: 1}
      - table: visit_grid
        expect_order: [VIS-001]
        expect_row_count: 1
        expect_rows:
          - id: VIS-001
            cells: {service: "Burst pipe repair", slot: today_4pm, status: scheduled}

  - id: public_05_pro_accept_is_role_gated
    tier: permission
    steps:
      - do: reset_button.click
      - do: select_ac_button.click
      - do: go_booking_button.click
      - do: slot_today_button.click
      - do: get_quote_button.click
      - do: approve_quote_button.click
      - do: book_visit_button.click
      - do: go_visits_button.click
      - do: pro_accept_button.click
        mode: unauthorized
        expect:
          - {op: equals, path: booking_status, value: scheduled}
      - do: role_pro_button.click
      - do: pro_accept_button.click
        expect:
          - {op: equals, path: booking_status, value: accepted}

  - id: public_06_reload_preserves_booking
    tier: persistence
    steps:
      - do: reset_button.click
      - do: select_ac_button.click
      - do: go_booking_button.click
      - do: slot_today_button.click
      - do: get_quote_button.click
      - do: approve_quote_button.click
      - do: book_visit_button.click
      - browser: reload
        expect:
          - {op: equals, path: booking_status, value: scheduled}
          - {op: equals, path: visit_count, value: 1}

  - id: public_07_dispatch_requires_assignment_and_parts
    tier: permission
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: slot_today_button.click
      - do: get_quote_button.click
      - do: approve_quote_button.click
      - do: role_dispatcher_button.click
      - do: go_dispatch_button.click
      - do: dispatch_visit_button.click
        mode: rejected
        expect:
          - {op: equals, path: dispatch_status, value: blocked}

  - id: public_08_dispatch_full_path
    tier: journey
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: slot_today_button.click
      - do: get_quote_button.click
      - do: approve_quote_button.click
      - do: role_dispatcher_button.click
      - do: go_dispatch_button.click
      - do: assign_mina_button.click
      - do: ready_parts_button.click
      - do: dispatch_visit_button.click
        expect:
          - {op: equals, path: dispatch_status, value: dispatched}
          - {op: equals, path: booking_status, value: dispatched}
          - {op: equals, path: dispatch_count, value: 1}
      - table: parts_grid
        expect_order: [P-VALVE, P-SEAL]
        expect_row_count: 2
        expect_rows:
          - id: P-VALVE
            cells: {status: ready}

  - id: public_09_permit_upload_and_qa
    tier: upload
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: slot_today_button.click
      - do: get_quote_button.click
      - do: approve_homeowner_button.click
      - do: role_dispatcher_button.click
      - do: go_dispatch_button.click
      - do: assign_mina_button.click
      - do: ready_parts_button.click
      - do: dispatch_visit_button.click
      - do: role_quality_manager_button.click
      - do: go_quality_button.click
      - do: permit_upload_input.upload
        input:
          file:
            name: homefix-permit.csv
            mime_type: text/csv
            content: |
              id,document,status
              PM-1,Before photos,ready
              PM-2,Fixture permit,ready
          rows:
            - {id: PM-1, document: "Before photos", status: ready}
            - {id: PM-2, document: "Fixture permit", status: ready}
        expect:
          - {op: equals, path: permit_count, value: 2}
          - {op: equals, path: permit_status, value: review}
      - do: pass_qa_button.click
        expect:
          - {op: equals, path: qa_status, value: passed}
          - {op: equals, path: booking_status, value: complete}

  - id: public_10_warranty_initial_state
    tier: smoke
    steps:
      - do: reset_button.click
      - do: go_warranty_button.click
        expect:
          - {op: equals, path: warranty_status, value: open}
          - {op: equals, path: warranty_score, value: 0}
      - table: warranty_grid
        expect_order: [W-CLAIM, W-DISPATCH, W-MATERIALS, W-QA, W-INVOICE]
        expect_row_count: 5

# density-extension:start

  - id: public_11_claim_code_is_normalized
    tier: validation
    steps:
      - do: reset_button.click
      - do: go_warranty_button.click
      - do: claim_code_input.fill
        input: {value: " storm-77 "}
        expect:
          - {op: equals, path: claim_reference, value: STORM-77}

  - id: public_12_preauth_claim_increments_service_calls
    tier: service
    steps:
      - do: reset_button.click
      - do: role_claims_manager_button.click
      - do: go_warranty_button.click
      - do: preauth_claim_button.click
        expect:
          - {op: equals, path: claim_status, value: approved}
          - {op: equals, path: service_call_count, value: 1}

  - id: public_13_materials_upload_counts_mismatch
    tier: upload
    steps:
      - do: reset_button.click
      - do: role_claims_manager_button.click
      - do: go_warranty_button.click
      - do: materials_upload_input.upload

        input:
          file:
            name: materials-mismatch.csv
            mime_type: text/csv
            content: |
              id,item,status
              MT-1,Copper valve,matched
              MT-2,Drywall patch,mismatch
          rows:
            - {id: MT-1, item: "Copper valve", status: matched}
            - {id: MT-2, item: "Drywall patch", status: mismatch}
        expect:
          - {op: equals, path: material_mismatch_count, value: 1}
          - {op: equals, path: materials_status, value: review}

  - id: public_14_clear_materials_reconcile_status
    tier: upload
    steps:
      - do: reset_button.click
      - do: role_claims_manager_button.click
      - do: go_warranty_button.click
      - do: materials_upload_input.upload

        input:
          file:
            name: materials-clear.csv
            mime_type: text/csv
            content: |
              id,item,status
              MT-1,Copper valve,matched
              MT-2,Drywall patch,matched
          rows:
            - {id: MT-1, item: "Copper valve", status: matched}
            - {id: MT-2, item: "Drywall patch", status: matched}
      - do: reconcile_materials_button.click
        expect:
          - {op: equals, path: materials_status, value: reconciled}

  - id: public_15_seal_rejected_before_invoice
    tier: validation
    steps:
      - do: reset_button.click
      - do: role_claims_manager_button.click
      - do: go_warranty_button.click
      - do: seal_warranty_button.click
        mode: rejected
        expect:
          - {op: equals, path: warranty_status, value: blocked}

  - id: public_16_claims_role_persists_after_reload
    tier: persistence
    steps:
      - do: reset_button.click
      - do: role_claims_manager_button.click
      - browser: reload
        expect:
          - {op: equals, path: active_role, value: claims_manager}

  - id: public_17_claim_and_materials_persist_after_reload
    tier: persistence
    steps:
      - do: reset_button.click
      - do: role_claims_manager_button.click
      - do: go_warranty_button.click
      - do: preauth_claim_button.click
      - do: materials_upload_input.upload

        input:
          file:
            name: materials-clear.csv
            mime_type: text/csv
            content: |
              id,item,status
              MT-1,Copper valve,matched
              MT-2,Drywall patch,matched
          rows:
            - {id: MT-1, item: "Copper valve", status: matched}
            - {id: MT-2, item: "Drywall patch", status: matched}
      - browser: reload
        expect:
          - {op: equals, path: claim_status, value: approved}
          - {op: equals, path: materials_status, value: review}

  - id: public_18_partial_warranty_table_marks_claim
    tier: core
    steps:
      - do: reset_button.click
      - do: role_claims_manager_button.click
      - do: go_warranty_button.click
      - do: preauth_claim_button.click
      - table: warranty_grid
        expect_order: [W-CLAIM, W-DISPATCH, W-MATERIALS, W-QA, W-INVOICE]
        expect_rows:
          - id: W-CLAIM
            cells: {status: cleared}
# density-extension:end
