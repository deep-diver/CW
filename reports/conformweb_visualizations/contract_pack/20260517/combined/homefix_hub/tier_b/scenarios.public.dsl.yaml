dsl_version: "3.0.0"
visibility: public
tier_weights:
  smoke: 1
  core: 2
  validation: 3
  service: 4
  upload: 4
  permission: 4
  persistence: 5
  journey: 6

scenarios:
  - id: public_01_filter_plumbing_services
    tier: smoke
    steps:
      - do: reset_button.click
      - do: filter_plumbing_button.click
        expect:
          - {op: equals, path: selected_category, value: plumbing}
      - table: service_grid
        expect_order: [HF-LEAK]
        expect_row_count: 1
        expect_rows:
          - id: HF-LEAK
            cells: {name: "Burst pipe repair", category: plumbing}

  - id: public_02_quote_emergency_pipe_repair
    tier: service
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: urgency_emergency_button.click
      - do: get_quote_button.click
        expect:
          - {op: equals, path: quote_status, value: ready}
          - {op: equals, path: quote_amount, value: 26800}
          - {op: equals, path: diagnostic_fee, value: 4900}
          - {op: equals, path: service_call_count, value: 1}

  - id: public_03_booking_requires_slot
    tier: validation
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: get_quote_button.click
      - do: approve_quote_button.click
      - do: book_visit_button.click
        mode: rejected
        expect:
          - {op: equals, path: booking_status, value: blocked}

  - id: public_04_book_visit_creates_timeline
    tier: journey
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: urgency_emergency_button.click
      - do: slot_today_button.click
      - do: customer_name_input.fill
        input: {value: "Ari Lee"}
      - do: address_input.fill
        input: {value: "  42 Maple Loft  "}
      - do: get_quote_button.click
      - do: approve_quote_button.click
      - do: book_visit_button.click
        expect:
          - {op: equals, path: booking_status, value: scheduled}
          - {op: equals, path: visit_count, value: 1}
      - table: visit_grid
        expect_order: [VIS-001]
        expect_row_count: 1
        expect_rows:
          - id: VIS-001
            cells: {service: "Burst pipe repair", slot: today_4pm, status: scheduled}

  - id: public_05_pro_accept_is_role_gated
    tier: permission
    steps:
      - do: reset_button.click
      - do: select_ac_button.click
      - do: go_booking_button.click
      - do: slot_today_button.click
      - do: get_quote_button.click
      - do: approve_quote_button.click
      - do: book_visit_button.click
      - do: go_visits_button.click
      - do: pro_accept_button.click
        mode: unauthorized
        expect:
          - {op: equals, path: booking_status, value: scheduled}
      - do: role_pro_button.click
      - do: pro_accept_button.click
        expect:
          - {op: equals, path: booking_status, value: accepted}

  - id: public_06_reload_preserves_booking
    tier: persistence
    steps:
      - do: reset_button.click
      - do: select_ac_button.click
      - do: go_booking_button.click
      - do: slot_today_button.click
      - do: get_quote_button.click
      - do: approve_quote_button.click
      - do: book_visit_button.click
      - browser: reload
        expect:
          - {op: equals, path: booking_status, value: scheduled}
          - {op: equals, path: visit_count, value: 1}

  - id: public_07_dispatch_requires_assignment_and_parts
    tier: permission
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: slot_today_button.click
      - do: get_quote_button.click
      - do: approve_quote_button.click
      - do: role_dispatcher_button.click
      - do: go_dispatch_button.click
      - do: dispatch_visit_button.click
        mode: rejected
        expect:
          - {op: equals, path: dispatch_status, value: blocked}

  - id: public_08_dispatch_full_path
    tier: journey
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: slot_today_button.click
      - do: get_quote_button.click
      - do: approve_quote_button.click
      - do: role_dispatcher_button.click
      - do: go_dispatch_button.click
      - do: assign_mina_button.click
      - do: ready_parts_button.click
      - do: dispatch_visit_button.click
        expect:
          - {op: equals, path: dispatch_status, value: dispatched}
          - {op: equals, path: booking_status, value: dispatched}
          - {op: equals, path: dispatch_count, value: 1}
      - table: parts_grid
        expect_order: [P-VALVE, P-SEAL]
        expect_row_count: 2
        expect_rows:
          - id: P-VALVE
            cells: {status: ready}

# density-extension:start

  - id: public_09_dispatcher_role_button_sets_session
    tier: permission
    steps:
      - do: reset_button.click
      - do: role_dispatcher_button.click
        expect:
          - {op: equals, path: active_role, value: dispatcher}

  - id: public_10_technician_role_button_sets_session
    tier: permission
    steps:
      - do: reset_button.click
      - do: role_technician_button.click
        expect:
          - {op: equals, path: active_role, value: technician}

  - id: public_11_initial_parts_grid_has_two_needed_items
    tier: smoke
    steps:
      - do: reset_button.click
      - do: go_dispatch_button.click
      - table: parts_grid
        expect_order: [P-VALVE, P-SEAL]
        expect_row_count: 2
        expect_rows:
          - id: P-VALVE
            cells: {status: needed}

  - id: public_12_assign_mina_sets_dispatch_state
    tier: core
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: get_quote_button.click
      - do: approve_quote_button.click
      - do: role_dispatcher_button.click
      - do: go_dispatch_button.click
      - do: assign_mina_button.click
        expect:
          - {op: equals, path: assigned_technician, value: TECH-MINA}
          - {op: equals, path: technician_status, value: assigned}

  - id: public_13_ready_parts_marks_all_rows_ready
    tier: core
    steps:
      - do: reset_button.click
      - do: role_dispatcher_button.click
      - do: go_dispatch_button.click
      - do: ready_parts_button.click
      - table: parts_grid
        expect_order: [P-VALVE, P-SEAL]
        expect_rows:
          - id: P-SEAL
            cells: {status: ready}

  - id: public_14_homeowner_cannot_dispatch_visit
    tier: permission
    steps:
      - do: reset_button.click
      - do: go_dispatch_button.click
      - do: dispatch_visit_button.click
        mode: unauthorized
        expect:
          - {op: equals, path: denied_count, value: 1}

  - id: public_15_dispatch_count_persists_after_reload
    tier: persistence
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: slot_today_button.click
      - do: get_quote_button.click
      - do: approve_quote_button.click
      - do: role_dispatcher_button.click
      - do: go_dispatch_button.click
      - do: assign_mina_button.click
      - do: ready_parts_button.click
      - do: dispatch_visit_button.click
      - browser: reload
        expect:
          - {op: equals, path: dispatch_count, value: 1}
          - {op: equals, path: active_role, value: dispatcher}

  - id: public_16_reset_clears_dispatch_assignment
    tier: validation
    steps:
      - do: reset_button.click
      - do: select_leak_button.click
      - do: go_booking_button.click
      - do: get_quote_button.click
      - do: approve_quote_button.click
      - do: role_dispatcher_button.click
      - do: go_dispatch_button.click
      - do: assign_mina_button.click
      - do: reset_button.click
        expect:
          - {op: equals, path: active_role, value: homeowner}
          - {op: equals, path: assigned_technician, value: ""}
# density-extension:end
