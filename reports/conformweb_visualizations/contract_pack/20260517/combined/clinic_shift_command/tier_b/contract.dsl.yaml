components:
  reset_button:
    kind: button
    selector: '[data-testid="reset"]'
    actions:
      click:
        effects:
          - {op: equals, path: current_page, value: command}
          - {op: equals, path: active_role, value: coordinator}
          - {op: equals, path: current_filter, value: all}
          - {op: equals_filter, path: visible_patients, source_path: patients, where: [], order_by: [{field: acuity, direction: asc}, {field: wait_mins, direction: desc}]}
          - {op: equals, path: rooms, value: [{id: R-ISO2, name: "Isolation 2", zone: west, status: ready, occupant: "", equipment: negative-pressure}, {id: R-PROC, name: "Procedure A", zone: procedure, status: ready, occupant: "", equipment: casting-cart}, {id: R-LAB2, name: "Lab Draw 2", zone: diagnostics, status: ready, occupant: "", equipment: phlebotomy}, {id: R-IMG, name: "Imaging Hold", zone: diagnostics, status: cleaning, occupant: "", equipment: wheelchair}, {id: R-OBS, name: "Observation 1", zone: east, status: occupied, occupant: "Walk-in infusion", equipment: monitor}]}
