    released_order_count: {type: number, purpose: Released diagnostic order count.}
    release_block_count: {type: number, purpose: Diagnostic release rejection count.}
    referral_docs: {type: array, purpose: Uploaded referral document rows.}
    referral_doc_count: {type: number, purpose: Referral document count.}
    last_referral_file: {type: string, purpose: Last uploaded referral file name.}
    escalation_tasks: {type: array, purpose: Charge nurse escalation tasks.}
    escalation_count: {type: number, purpose: Open escalation count created.}
    closed_escalation_count: {type: number, purpose: Closed escalation count.}
    handoff_packets: {type: array, purpose: Finalized nurse handoff packet rows.}
    handoff_packet_count: {type: number, purpose: Finalized handoff packet count.}
    handoff_status: {type: string, purpose: idle, blocked, or ready.}
    handoff_block_count: {type: number, purpose: Blocked handoff finalization count.}
    validation_errors: {type: object, purpose: Field-level validation errors.}
    denied_count: {type: number, purpose: Role-denied action count.}
    room_block_count: {type: number, purpose: Rejected room assignment count.}
