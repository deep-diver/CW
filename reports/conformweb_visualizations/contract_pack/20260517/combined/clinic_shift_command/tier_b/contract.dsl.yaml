          - {op: equals, path: copay_due, value: 0}
          - {op: equals, path: auth_required, value: false}
          - {op: equals, path: auth_key, value: ""}
          - {op: equals, path: authorization_status, value: idle}
          - {op: equals, path: service_call_count, value: 0}
