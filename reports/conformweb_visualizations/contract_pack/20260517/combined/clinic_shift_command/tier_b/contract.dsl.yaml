    selector: '[data-testid="select-CVC-205"]'
    page: command
    actions:
      click:
        navigate_to: chart
        effects:
          - {op: equals, path: selected_patient_id, value: CVC-205}
          - {op: equals, path: selected_patient_name, value: "June Park"}
          - {op: equals, path: selected_lane, value: lab}
          - {op: equals, path: selected_acuity, value: 2}
          - {op: equals, path: selected_patient_status, value: selected}
          - {op: equals, path: selected_room_need, value: lab}
          - {op: equals, path: selected_risk, value: orange}
          - {op: equals, path: insurance_code, value: HMO-A}
          - {op: equals, path: auth_required, value: false}
          - {op: equals, path: auth_key, value: ""}
          - {op: equals, path: current_page, value: chart}
          - {op: equals, path: last_action, value: select_patient}
  select_paul_button:
    kind: button
    selector: '[data-testid="select-CVC-204"]'
    page: command
    actions:
      click:
        navigate_to: chart
        effects:
          - {op: equals, path: selected_patient_id, value: CVC-204}
          - {op: equals, path: selected_patient_name, value: "Paul Rivers"}
          - {op: equals, path: selected_lane, value: imaging}
          - {op: equals, path: selected_acuity, value: 3}
          - {op: equals, path: selected_patient_status, value: selected}
          - {op: equals, path: selected_room_need, value: imaging}
          - {op: equals, path: selected_risk, value: yellow}
          - {op: equals, path: insurance_code, value: BADPLAN}
          - {op: equals, path: auth_required, value: true}
          - {op: equals, path: auth_key, value: BAD-AUTH}
          - {op: equals, path: current_page, value: chart}
          - {op: equals, path: last_action, value: select_patient}
  select_nia_button:
    kind: button
    selector: '[data-testid="select-CVC-203"]'
    page: command
    actions:
      click:
        navigate_to: chart
        effects:
          - {op: equals, path: selected_patient_id, value: CVC-203}
          - {op: equals, path: selected_patient_name, value: "Nia Brooks"}
          - {op: equals, path: selected_lane, value: followup}
          - {op: equals, path: selected_acuity, value: 4}
          - {op: equals, path: selected_patient_status, value: selected}
          - {op: equals, path: selected_room_need, value: exam}
          - {op: equals, path: selected_risk, value: green}
          - {op: equals, path: insurance_code, value: CASH}
          - {op: equals, path: auth_required, value: false}
          - {op: equals, path: auth_key, value: ""}
          - {op: equals, path: current_page, value: chart}
          - {op: equals, path: last_action, value: select_patient}

  assign_isolation_button:
    kind: button
    selector: '[data-testid="assign-isolation"]'
    page: chart
    actions:
      click:
        allowed_roles: [charge_nurse]
        preconditions:
          - {op: not_one_of, path: selected_patient_id, values: [""]}
        effects:
          - {op: equals, path: assigned_room_id, value: R-ISO2}
          - {op: equals, path: assigned_room_name, value: "Isolation 2"}
          - {op: equals, path: selected_patient_status, value: roomed}
          - {op: equals, path: rooms, value: [{id: R-ISO2, name: "Isolation 2", zone: west, status: occupied, occupant: "Ava Chen", equipment: negative-pressure}, {id: R-PROC, name: "Procedure A", zone: procedure, status: ready, occupant: "", equipment: casting-cart}, {id: R-LAB2, name: "Lab Draw 2", zone: diagnostics, status: ready, occupant: "", equipment: phlebotomy}, {id: R-IMG, name: "Imaging Hold", zone: diagnostics, status: cleaning, occupant: "", equipment: wheelchair}, {id: R-OBS, name: "Observation 1", zone: east, status: occupied, occupant: "Walk-in infusion", equipment: monitor}]}
          - {op: equals, path: last_action, value: assign_isolation}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_capacity}
  assign_procedure_button:
    kind: button
    selector: '[data-testid="assign-procedure"]'
    page: chart
    actions:
      click:
        allowed_roles: [coordinator, charge_nurse]
        preconditions:
          - {op: not_one_of, path: selected_patient_id, values: [""]}
        effects:
          - {op: equals, path: assigned_room_id, value: R-PROC}
          - {op: equals, path: assigned_room_name, value: "Procedure A"}
          - {op: equals, path: selected_patient_status, value: roomed}
          - {op: equals, path: rooms, value: [{id: R-ISO2, name: "Isolation 2", zone: west, status: ready, occupant: "", equipment: negative-pressure}, {id: R-PROC, name: "Procedure A", zone: procedure, status: occupied, occupant: "Omar Haddad", equipment: casting-cart}, {id: R-LAB2, name: "Lab Draw 2", zone: diagnostics, status: ready, occupant: "", equipment: phlebotomy}, {id: R-IMG, name: "Imaging Hold", zone: diagnostics, status: cleaning, occupant: "", equipment: wheelchair}, {id: R-OBS, name: "Observation 1", zone: east, status: occupied, occupant: "Walk-in infusion", equipment: monitor}]}
          - {op: equals, path: last_action, value: assign_procedure}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_capacity}
  assign_imaging_button:
    kind: button
    selector: '[data-testid="assign-imaging"]'
    page: chart
    actions:
      click:
        allowed_roles: [coordinator, charge_nurse]
        rejected_when:
          - {op: not_one_of, path: selected_patient_id, values: [""]}
        rejected_effects:
          - {op: changed_by, path: room_block_count, by: 1}
          - {op: equals, path: assigned_room_id, value: ""}
          - {op: equals, path: assigned_room_name, value: ""}
          - {op: equals, path: last_action, value: room_cleaning_block}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_capacity}

  insurance_code_input:
    kind: input
    selector: '[data-testid="insurance-code"]'
    page: chart
    actions:
      fill:
        effects:
          - {op: equals_normalized, path: insurance_code, value_from: input.value, normalizers: [trim, uppercase]}
          - {op: equals, path: last_action, value: edit_insurance}
  verify_insurance_button:
    kind: button
    selector: '[data-testid="verify-insurance"]'
    page: chart
    actions:
      click:
        preconditions:
          - {op: not_one_of, path: selected_patient_id, values: [""]}
          - {op: not_one_of, path: insurance_code, values: [""]}
        effects:
          - {op: changed_by, path: service_call_count, by: 1}
          - {op: changed_by, path: insurance_call_count, by: 1}
          - {op: one_of, path: insurance_status, values: [approved, self_pay, needs_review]}
          - {op: equals, path: last_action, value: verify_insurance}

  auth_key_input:
    kind: input
    selector: '[data-testid="auth-key"]'
    page: chart
    actions:
      fill:
        effects:
          - {op: equals_normalized, path: auth_key, value_from: input.value, normalizers: [trim, uppercase]}
          - {op: equals, path: last_action, value: edit_auth_key}
  request_auth_button:
    kind: button
    selector: '[data-testid="request-auth"]'
    page: chart
    actions:
      click:
        allowed_roles: [billing]
        preconditions:
          - {op: not_one_of, path: selected_patient_id, values: [""]}
        effects:
          - {op: changed_by, path: service_call_count, by: 1}
          - {op: changed_by, path: auth_call_count, by: 1}
          - {op: one_of, path: authorization_status, values: [approved, denied, not_required]}
          - {op: equals, path: last_action, value: request_auth}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_billing}

  pain_score_input:
    kind: input
    selector: '[data-testid="pain-score"]'
    page: chart
    actions:
      fill:
        effects:
          - {op: equals_normalized, path: pain_score, value_from: input.value, normalizers: [trim]}
          - {op: removed_object_fields, path: validation_errors, fields: [assessment]}
  disposition_input:
    kind: input
    selector: '[data-testid="disposition"]'
    page: chart
    actions:
      fill:
        effects:
          - {op: equals_normalized, path: disposition, value_from: input.value, normalizers: [trim, collapse_whitespace]}
          - {op: removed_object_fields, path: validation_errors, fields: [assessment]}
  save_assessment_button:
    kind: button
    selector: '[data-testid="save-assessment"]'
    page: chart
    actions:
      click:
        allowed_roles: [clinician]
        rejected_when:
          - {op: one_of, path: pain_score, values: [""]}
          - {op: one_of, path: disposition, values: [""]}
        rejected_effects:
          - {op: equals, path: assessment_status, value: incomplete}
          - {op: updated_object_fields, path: validation_errors, updates: {assessment: "Pain score and disposition are required"}}
          - {op: equals, path: last_action, value: reject_assessment}
        effects:
          - {op: equals, path: assessment_status, value: recorded}
          - {op: equals, path: selected_patient_status, value: assessed}
          - {op: equals, path: last_action, value: save_assessment}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_clinical}
  place_lab_order_button:
    kind: button
    selector: '[data-testid="place-lab-order"]'
    page: chart
    actions:
      click:
        allowed_roles: [clinician]
        rejected_when:
          - {op: not_one_of, path: assessment_status, values: [recorded]}
        rejected_effects:
          - {op: equals, path: order_status, value: blocked}
          - {op: equals, path: last_action, value: order_requires_assessment}
        effects:
          - {op: appended_object, path: diagnostic_orders, value: {id: O-1, patient: {from_path: selected_patient_name}, type: CBC, priority: stat, status: ordered}}
          - {op: changed_by, path: diagnostic_order_count, by: 1}
          - {op: equals, path: order_status, value: ordered}
          - {op: equals, path: last_action, value: place_lab_order}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_clinical}
  release_diagnostics_button:
    kind: button
    selector: '[data-testid="release-diagnostics"]'
    page: chart
    actions:
      click:
        allowed_roles: [clinician]
        preconditions:
          - {op: one_of, path: order_status, values: [ordered]}
          - {op: one_of, path: insurance_status, values: [approved, self_pay]}
          - {op: one_of, path: authorization_status, values: [approved, not_required]}
        rejected_when:
          - {op: not_one_of, path: authorization_status, values: [approved, not_required]}
        rejected_effects:
          - {op: changed_by, path: release_block_count, by: 1}
          - {op: equals, path: last_action, value: release_blocked}
        effects:
          - {op: updated_first_where, path: diagnostic_orders, where: [{op: equals, field: id, value: O-1}], updates: {status: released}}
          - {op: changed_by, path: released_order_count, by: 1}
          - {op: equals, path: order_status, value: released}
          - {op: equals, path: selected_patient_status, value: diagnostic_ready}
          - {op: equals, path: last_action, value: release_diagnostics}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_clinical}

  referral_upload_input:
    kind: input
    selector: '[data-testid="referral-upload"]'
    page: chart
    actions:
      upload:
        file_schema:
          format: csv
          columns:
            - {name: id, type: string}
            - {name: document, type: string}
            - {name: priority, type: string}
            - {name: status, type: string}
        effects:
          - {op: equals, path: referral_docs, value_from: input.rows}
          - {op: equals_length, path: referral_doc_count, source_path: referral_docs}
          - {op: equals, path: last_referral_file, value_from: input.file.name}
          - {op: equals, path: last_action, value: upload_referrals}

  escalate_delay_button:
    kind: button
    selector: '[data-testid="escalate-delay"]'
    page: chart
    actions:
      click:
        allowed_roles: [charge_nurse]
        preconditions:
          - {op: not_one_of, path: selected_patient_id, values: [""]}
        effects:
          - {op: appended_object, path: escalation_tasks, value: {id: E-1, patient: {from_path: selected_patient_name}, reason: delayed_room, owner: charge_nurse, status: open}}
          - {op: changed_by, path: escalation_count, by: 1}
          - {op: equals, path: last_action, value: escalate_delay}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_capacity}
  close_escalation_button:
    kind: button
    selector: '[data-testid="close-escalation"]'
    page: handoff
    actions:
      click:
        allowed_roles: [charge_nurse]
        preconditions:
          - {op: relation, path: escalation_count, operator: ">", value: 0}
        effects:
          - {op: updated_first_where, path: escalation_tasks, where: [{op: equals, field: id, value: E-1}], updates: {status: closed}}
          - {op: changed_by, path: closed_escalation_count, by: 1}
          - {op: equals, path: last_action, value: close_escalation}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_capacity}
  finalize_handoff_button:
    kind: button
    selector: '[data-testid="finalize-handoff"]'
    page: handoff
    actions:
      click:
        allowed_roles: [charge_nurse]
        preconditions:
          - {op: one_of, path: order_status, values: [released]}
          - {op: relation, path: referral_doc_count, operator: ">", value: 0}
          - {op: one_of, path: closed_escalation_count, values: [1]}
        rejected_when:
          - {op: not_one_of, path: closed_escalation_count, values: [1]}
        rejected_effects:
          - {op: changed_by, path: handoff_block_count, by: 1}
          - {op: equals, path: handoff_status, value: blocked}
          - {op: equals, path: last_action, value: handoff_blocked}
        effects:
          - {op: appended_object, path: handoff_packets, value: {id: H-1, patient: {from_path: selected_patient_name}, referral_file: {from_path: last_referral_file}, status: ready}}
          - {op: changed_by, path: handoff_packet_count, by: 1}
          - {op: equals, path: handoff_status, value: ready}
          - {op: equals, path: last_action, value: finalize_handoff}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_capacity}
