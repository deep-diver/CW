dsl_version: "3.0.0"

app:
  id: clinic_shift_command
  name: Clinic Shift Command
  capability: ambulatory_clinic_operations
  ui_ux_brief: |
    Clinic Shift Command Tier B should look unmistakably more complex than
    Tier A when viewed in a desktop screenshot. The product should read as a
    real multi-role ambulatory operations command center handling live queue
    pressure, room capacity, prior authorization, diagnostic orders, referral
    packets, and nurse-charge escalations. Use a dense but calm clinical SaaS
    layout with a command header, risk telemetry, multi-lane queue table,
    selected patient workup, capacity/floor map, authorization ledger,
    diagnostic order board, diagnostic release gate, referral upload panel, and
    escalation/handoff packet surface. Keep the visual language professional
    and healthcare-specific:
    bright clinical canvas, navy/teal command structure, amber/red urgency
    accents, crisp chips, compact tables, and clear role-aware controls.
    Avoid landing-page hero styling, marketing copy, playful commerce cards,
    generic analytics dashboards, and bare test harnesses. The UI should feel
    polished enough to be deployed for a live clinic shift, and the increased
    Tier B difficulty should be evident from the number of coordinated panels
    and operational dependencies on screen.

runtime:
  target: web
  start_url: /#/command

  state_probe:
    kind: javascript
    expression: window.__DETOX_STATE__

  pages:
    command:
      path: /#/command
      purpose: Live triage queue, role console, risk telemetry, and selected patient snapshot.
    chart:
      path: /#/chart
      purpose: Patient chart workspace for insurance, prior authorization, assessment, orders, and referral upload.
    capacity:
      path: /#/capacity
      purpose: Room capacity board and diagnostic order tracking.
    handoff:
      path: /#/handoff
      purpose: Escalations, referral packets, and charge-nurse shift handoff.

  session:
    role_path: active_role
    roles: [coordinator, clinician, charge_nurse, billing]

  persistence:
    reload:
      scope: local_storage
      paths:
        - current_page
        - active_role
        - patients
        - visible_patients
        - current_filter
        - rooms
        - selected_patient_id
        - selected_patient_name
        - selected_lane
        - selected_acuity
        - selected_patient_status
        - selected_room_need
        - selected_risk
        - assigned_room_id
        - assigned_room_name
        - insurance_code
        - insurance_status
        - copay_due
        - auth_required
        - auth_key
        - authorization_status
        - service_call_count
        - insurance_call_count
        - auth_call_count
        - pain_score
        - disposition
        - assessment_status
        - order_status
        - diagnostic_orders
        - diagnostic_order_count
        - released_order_count
        - release_block_count
        - referral_docs
        - referral_doc_count
        - last_referral_file
        - escalation_tasks
        - escalation_count
        - closed_escalation_count
        - handoff_packets
        - handoff_packet_count
        - handoff_status
        - handoff_block_count
        - validation_errors
        - denied_count
        - room_block_count
        - last_action

  services:
    insurance_verify:
      endpoint: /api/insurance
      method: GET
      responses:
        - id: hmo_approved
          match:
            query:
              code: HMO-A
          status: 200
          json: {status: approved, copay: 20}
        - id: ppo_approved
          match:
            query:
              code: PPO-B
          status: 200
          json: {status: approved, copay: 35}
        - id: cash_self_pay
          match:
            query:
              code: CASH
          status: 200
          json: {status: self_pay, copay: 120}
        - id: plan_review
          match:
            query:
              code: BADPLAN
          status: 200
          json: {status: needs_review, copay: 0}
    prior_auth:
      endpoint: /api/prior-auth
      method: GET
      responses:
        - id: cardio_stat
          match:
            query:
              auth: CARD-STAT
          status: 200
          json: {status: approved}
        - id: ortho_approved
          match:
            query:
              auth: ORTHO-77
          status: 200
          json: {status: approved}
        - id: denied
          match:
            query:
              auth: BAD-AUTH
          status: 200
          json: {status: denied}

  tables:
    patient_queue:
      selector: '[data-testid="patient-queue"]'
      row_selector: '[data-testid="patient-row"]'
      row_id_attribute: data-patient-id
      source_path: visible_patients
      row_id_field: id
      columns:
        name: {selector: '[data-col="name"]', state_field: name}
        lane: {selector: '[data-col="lane"]', state_field: lane}
        acuity: {selector: '[data-col="acuity"]', state_field: acuity}
        status: {selector: '[data-col="status"]', state_field: status}
        wait_mins: {selector: '[data-col="wait_mins"]', state_field: wait_mins}
        room_need: {selector: '[data-col="room_need"]', state_field: room_need}
        risk: {selector: '[data-col="risk"]', state_field: risk}
    room_board:
      selector: '[data-testid="room-board"]'
      row_selector: '[data-testid="room-row"]'
      row_id_attribute: data-room-id
      source_path: rooms
      row_id_field: id
      columns:
        name: {selector: '[data-col="name"]', state_field: name}
        zone: {selector: '[data-col="zone"]', state_field: zone}
        status: {selector: '[data-col="status"]', state_field: status}
        occupant: {selector: '[data-col="occupant"]', state_field: occupant}
        equipment: {selector: '[data-col="equipment"]', state_field: equipment}
    order_grid:
      selector: '[data-testid="order-grid"]'
      row_selector: '[data-testid="order-row"]'
      row_id_attribute: data-order-id
      source_path: diagnostic_orders
      row_id_field: id
      columns:
        patient: {selector: '[data-col="patient"]', state_field: patient}
        type: {selector: '[data-col="type"]', state_field: type}
        priority: {selector: '[data-col="priority"]', state_field: priority}
        status: {selector: '[data-col="status"]', state_field: status}
    referral_grid:
      selector: '[data-testid="referral-grid"]'
      row_selector: '[data-testid="referral-row"]'
      row_id_attribute: data-referral-id
      source_path: referral_docs
      row_id_field: id
      columns:
        document: {selector: '[data-col="document"]', state_field: document}
        priority: {selector: '[data-col="priority"]', state_field: priority}
        status: {selector: '[data-col="status"]', state_field: status}
    escalation_grid:
      selector: '[data-testid="escalation-grid"]'
      row_selector: '[data-testid="escalation-row"]'
      row_id_attribute: data-escalation-id
      source_path: escalation_tasks
      row_id_field: id
      columns:
        patient: {selector: '[data-col="patient"]', state_field: patient}
        reason: {selector: '[data-col="reason"]', state_field: reason}
        owner: {selector: '[data-col="owner"]', state_field: owner}
        status: {selector: '[data-col="status"]', state_field: status}
    handoff_packet_grid:
      selector: '[data-testid="handoff-packet-grid"]'
      row_selector: '[data-testid="handoff-packet-row"]'
      row_id_attribute: data-packet-id
      source_path: handoff_packets
      row_id_field: id
      columns:
        patient: {selector: '[data-col="patient"]', state_field: patient}
        referral_file: {selector: '[data-col="referral_file"]', state_field: referral_file}
        status: {selector: '[data-col="status"]', state_field: status}

