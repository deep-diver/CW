    current_filter: {type: string, purpose: Active queue filter.}
    rooms: {type: array, purpose: Capacity board rooms.}
    selected_patient_id: {type: string, purpose: Active patient id.}
    selected_patient_name: {type: string, purpose: Active patient name.}
