  schema:
    current_page: {type: string, purpose: "Active route page."}
    active_role: {type: string, purpose: "Current user role: customer, staff, or manager."}
    products: {type: array, purpose: "Full cold-chain grocery catalog."}
    current_vendor: {type: string, purpose: "Active vendor filter."}
    visible_products: {type: array, purpose: "Filtered catalog rows."}
    cart_items: {type: array, purpose: "Basket line items with cold-chain and risk metadata."}
    cart_count: {type: number, purpose: "Derived count of distinct cart rows."}
    cart_subtotal: {type: number, purpose: "Derived sum of cart_items.line_total."}
    cold_chain_count: {type: number, purpose: "Derived count of cold-chain cart rows."}
    restricted_count: {type: number, purpose: "Derived count of restricted cart rows."}
    delivery_fee: {type: number, purpose: "Derived tiered delivery fee."}
    packaging_fee: {type: number, purpose: "Derived cold-chain packaging fee."}
    service_fee: {type: number, purpose: "Derived service fee when cart is non-empty."}
    order_total: {type: number, purpose: "Derived checkout total."}
    rush_enabled: {type: boolean, purpose: "Rush fulfillment option."}
    rush_surcharge: {type: number, purpose: "Rush surcharge."}
    substitution_opt_in: {type: boolean, purpose: "Customer accepts curated substitutions."}
    substitution_credit: {type: number, purpose: "Credit for accepting substitutions."}
    coupon_code: {type: string, purpose: "Entered coupon code."}
    coupon_credit: {type: number, purpose: "Coupon credit."}
    coupon_status: {type: string, purpose: "idle, applied, or rejected."}
    wallet_balance: {type: number, purpose: "Available wallet balance."}
    wallet_credit: {type: number, purpose: "Applied wallet credit."}
    service_call_count: {type: number, purpose: "Derived service call count."}
    coupon_call_count: {type: number, purpose: "Derived coupon service call count."}
    wallet_call_count: {type: number, purpose: "Derived wallet service call count."}
    slot_call_count: {type: number, purpose: "Derived slot service call count."}
    compliance_call_count: {type: number, purpose: "Derived compliance service call count."}
    delivery_slot: {type: string, purpose: "Selected quoted delivery slot."}
    slot_status: {type: string, purpose: "idle or confirmed."}
    customer_name: {type: string, purpose: "Checkout customer name."}
    customer_phone: {type: string, purpose: "Checkout customer phone."}
    validation_errors: {type: object, purpose: "Checkout validation errors."}
    order_placed: {type: boolean, purpose: "Whether an order was placed."}
    order_id: {type: string, purpose: "Current order ID."}
    order_history: {type: array, purpose: "Placed order history."}
    review_requested: {type: boolean, purpose: "Restricted order review requested."}
    review_status: {type: string, purpose: "idle, pending, approved, or denied."}
    fulfillment_picked: {type: boolean, purpose: "Staff picked the order."}
    cold_chain_sealed: {type: boolean, purpose: "Cold-chain tote sealed."}
    quality_checked: {type: boolean, purpose: "Quality check completed."}
    fulfillment_dispatched: {type: boolean, purpose: "Order dispatched."}
    checklist_count: {type: number, purpose: "Completed fulfillment checklist steps."}
    support_issue: {type: string, purpose: "Draft support ticket issue."}
    support_tickets: {type: array, purpose: "Post-order support tickets."}
    ticket_count: {type: number, purpose: "Derived support ticket count."}
    ticket_status: {type: string, purpose: "idle, open, or resolved."}
    order_audit: {type: array, purpose: "Audit trail for order operations."}
    audit_count: {type: number, purpose: "Derived audit count."}
    last_action: {type: string, purpose: "Last user action label."}
    __services.calls: {type: array, purpose: "Evaluator service call ledger."}

