          - *derive_order_total
          - {op: equals, path: last_action, value: disable_rush}

  enable_substitution_button:
    kind: button
    selector: '[data-testid="enable-substitution"]'
    page: checkout
    actions:
      click:
        preconditions:
          - {op: relation, path: cart_count, operator: ">=", value: 1}
          - {op: equals, path: substitution_opt_in, value: false}
        effects:
          - {op: equals, path: substitution_opt_in, value: true}
          - {op: equals, path: substitution_credit, value: 1000}
          - *derive_order_total
          - {op: equals, path: last_action, value: enable_substitution}

  disable_substitution_button:
    kind: button
    selector: '[data-testid="disable-substitution"]'
    page: checkout
    actions:
      click:
        preconditions:
          - {op: equals, path: substitution_opt_in, value: true}
        effects:
          - {op: equals, path: substitution_opt_in, value: false}
          - {op: equals, path: substitution_credit, value: 0}
          - *derive_order_total
          - {op: equals, path: last_action, value: disable_substitution}

  slot_early_button:
    kind: button
    selector: '[data-testid="slot-early"]'
    page: checkout
    actions:
      click:
        effects:
          - {op: equals, path: delivery_slot, value: early}
          - {op: equals, path: slot_status, value: confirmed}
          - *derive_service_call_count
          - *derive_slot_call_count
          - {op: equals, path: last_action, value: select_slot}

  slot_green_button:
    kind: button
    selector: '[data-testid="slot-green"]'
    page: checkout
    actions:
      click:
        effects:
          - {op: equals, path: delivery_slot, value: green}
          - {op: equals, path: slot_status, value: confirmed}
          - *derive_service_call_count
          - *derive_slot_call_count
          - {op: equals, path: last_action, value: select_slot}

  slot_late_button:
    kind: button
    selector: '[data-testid="slot-late"]'
    page: checkout
    actions:
      click:
        effects:
          - {op: equals, path: delivery_slot, value: late}
          - {op: equals, path: slot_status, value: confirmed}
          - *derive_service_call_count
          - *derive_slot_call_count
          - {op: equals, path: last_action, value: select_slot}

  customer_name_input:
    kind: input
    selector: '[data-testid="customer-name"]'
    page: checkout
    actions:
      fill:
        effects:
          - {op: equals_normalized, path: customer_name, value_from: input.value, normalizers: [trim]}
          - {op: removed_object_fields, path: validation_errors, fields: [name]}
          - {op: equals, path: last_action, value: edit_name}

  customer_phone_input:
    kind: input
    selector: '[data-testid="customer-phone"]'
    page: checkout
    actions:
      fill:
        effects:
          - {op: equals_normalized, path: customer_phone, value_from: input.value, normalizers: [trim]}
          - {op: removed_object_fields, path: validation_errors, fields: [phone]}
          - {op: equals, path: last_action, value: edit_phone}

  place_order_button:
    kind: button
    selector: '[data-testid="place-order"]'
    page: checkout
    actions:
      click:
        preconditions:
          - {op: relation, path: cart_subtotal, operator: ">=", value: 25000}
          - {op: relation, path: cart_count, operator: ">=", value: 1}
          - {op: relation, path: customer_name, operator: "!=", value: ""}
          - {op: one_of, path: delivery_slot, values: [early, green, late]}
          - {op: equals, path: slot_status, value: confirmed}
        rejected_when:
          - {op: relation, path: cart_subtotal, operator: "<", value: 25000}
        rejected_effects:
          - {op: equals, path: order_placed, value: false}
          - {op: updated_object_fields, path: validation_errors, updates: {minimum_order: "Minimum cold-chain order 25000"}}
          - {op: equals, path: last_action, value: reject_minimum}
        effects:
          - {op: equals, path: order_placed, value: true}
          - {op: one_of, path: order_id, values: ["ORD-C001", "ORD-C002", "ORD-C003", "ORD-C004", "ORD-C005"]}
          - {op: appended_object, path: order_audit, value: {id: {after_path: audit_count}, event: placed, role: {from_path: active_role}, subtotal: {from_path: cart_subtotal}, cold_chain: {from_path: cold_chain_count}}}
          - *derive_audit_count
          - {op: equals, path: last_action, value: place_order}

  role_customer_button:
    kind: button
    selector: '[data-testid="role-customer"]'
    actions:
      click:
        effects:
          - {op: equals, path: active_role, value: customer}
          - {op: equals, path: last_action, value: role_customer}

  role_staff_button:
    kind: button
    selector: '[data-testid="role-staff"]'
    actions:
      click:
        effects:
          - {op: equals, path: active_role, value: staff}
          - {op: equals, path: last_action, value: role_staff}

  role_manager_button:
    kind: button
    selector: '[data-testid="role-manager"]'
    actions:
      click:
        effects:
          - {op: equals, path: active_role, value: manager}
          - {op: equals, path: last_action, value: role_manager}

  pick_order_button:
    kind: button
    selector: '[data-testid="pick-order"]'
    page: orders
    actions:
      click:
        allowed_roles: [staff, manager]
        preconditions:
          - {op: equals, path: order_placed, value: true}
          - {op: equals, path: fulfillment_picked, value: false}
        effects:
          - {op: equals, path: fulfillment_picked, value: true}
          - {op: changed_by, path: checklist_count, by: 1}
          - {op: equals, path: last_action, value: pick_order}
        unauthorized_effects:
          - {op: equals, path: last_action, value: deny_pick}

  seal_cold_chain_button:
    kind: button
    selector: '[data-testid="seal-cold-chain"]'
    page: orders
    actions:
      click:
        allowed_roles: [staff, manager]
        preconditions:
          - {op: equals, path: fulfillment_picked, value: true}
          - {op: relation, path: cold_chain_count, operator: ">=", value: 1}
          - {op: equals, path: cold_chain_sealed, value: false}
        effects:
          - {op: equals, path: cold_chain_sealed, value: true}
          - {op: changed_by, path: checklist_count, by: 1}
          - {op: equals, path: last_action, value: seal_cold_chain}
        unauthorized_effects:
          - {op: equals, path: last_action, value: deny_seal}

  quality_check_button:
    kind: button
    selector: '[data-testid="quality-check"]'
    page: orders
    actions:
      click:
        allowed_roles: [staff, manager]
        preconditions:
          - {op: equals, path: cold_chain_sealed, value: true}
          - {op: equals, path: quality_checked, value: false}
        effects:
          - {op: equals, path: quality_checked, value: true}
          - {op: changed_by, path: checklist_count, by: 1}
          - {op: equals, path: last_action, value: quality_check}
        unauthorized_effects:
          - {op: equals, path: last_action, value: deny_quality}

  dispatch_order_button:
    kind: button
    selector: '[data-testid="dispatch-order"]'
    page: orders
    actions:
      click:
        allowed_roles: [staff, manager]
        preconditions:
          - {op: equals, path: quality_checked, value: true}
          - {op: equals, path: fulfillment_dispatched, value: false}
        effects:
          - {op: equals, path: fulfillment_dispatched, value: true}
          - {op: changed_by, path: checklist_count, by: 1}
          - {op: equals, path: last_action, value: dispatch_order}
        unauthorized_effects:
          - {op: equals, path: last_action, value: deny_dispatch}

  request_review_button:
    kind: button
    selector: '[data-testid="request-review"]'
    page: orders
    actions:
      click:
        allowed_roles: [staff]
        preconditions:
          - {op: equals, path: order_placed, value: true}
          - {op: relation, path: restricted_count, operator: ">=", value: 1}
          - {op: equals, path: review_requested, value: false}
        effects:
          - {op: equals, path: review_requested, value: true}
          - {op: equals, path: review_status, value: pending}
          - *derive_service_call_count
          - *derive_compliance_call_count
          - {op: appended_object, path: order_audit, value: {id: {after_path: audit_count}, event: review_requested, role: {from_path: active_role}, restricted: {from_path: restricted_count}}}
          - *derive_audit_count
          - {op: equals, path: last_action, value: request_review}
        unauthorized_effects:
          - {op: equals, path: last_action, value: deny_review_request}

  approve_review_button:
    kind: button
    selector: '[data-testid="approve-review"]'
    page: orders
    actions:
      click:
        allowed_roles: [manager]
        preconditions:
          - {op: equals, path: review_status, value: pending}
        effects:
          - {op: equals, path: review_status, value: approved}
          - {op: appended_object, path: order_audit, value: {id: {after_path: audit_count}, event: manager_approved, role: {from_path: active_role}, order: {from_path: order_id}}}
          - *derive_audit_count
          - {op: equals, path: last_action, value: approve_review}
        unauthorized_effects:
          - {op: equals, path: last_action, value: deny_manager_approval}

  cancel_order_button:
    kind: button
    selector: '[data-testid="cancel-order"]'
    page: orders
    actions:
      click:
        allowed_roles: [manager]
        preconditions:
          - {op: equals, path: order_placed, value: true}
        effects:
          - {op: appended_object, path: order_audit, value: {id: {after_path: audit_count}, event: cancelled, role: {from_path: active_role}, order: {from_path: order_id}}}
          - *derive_audit_count
          - {op: equals, path: last_action, value: cancel_order}
        unauthorized_effects:
          - {op: equals, path: last_action, value: unauthorized}

  support_issue_input:
    kind: input
    selector: '[data-testid="support-issue"]'
    page: support
    actions:
      fill:
        effects:
          - {op: equals_normalized, path: support_issue, value_from: input.value, normalizers: [trim]}
          - {op: equals, path: last_action, value: edit_support_issue}

  open_ticket_button:
    kind: button
    selector: '[data-testid="open-ticket"]'
    page: support
    actions:
      click:
        preconditions:
          - {op: equals, path: order_placed, value: true}
          - {op: relation, path: support_issue, operator: "!=", value: ""}
        effects:
          - {op: appended_object, path: support_tickets, value: {id: {after_path: ticket_count}, issue: {from_path: support_issue}, status: open, order: {from_path: order_id}}}
          - *derive_ticket_count
          - {op: equals, path: ticket_status, value: open}
          - {op: equals, path: last_action, value: open_ticket}

  resolve_ticket_button:
    kind: button
    selector: '[data-testid="resolve-ticket"]'
    page: support
    actions:
      click:
        allowed_roles: [staff, manager]
        preconditions:
          - {op: relation, path: ticket_count, operator: ">=", value: 1}
        effects:
          - {op: updated_first_where, path: support_tickets, where: [{op: equals, field: status, value: open}], updates: {status: resolved}}
          - {op: equals, path: ticket_status, value: resolved}
          - {op: appended_object, path: order_audit, value: {id: {after_path: audit_count}, event: support_resolved, role: {from_path: active_role}, order: {from_path: order_id}}}
          - *derive_audit_count
          - {op: equals, path: last_action, value: resolve_ticket}
        unauthorized_effects:
          - {op: equals, path: last_action, value: deny_resolve_ticket}
