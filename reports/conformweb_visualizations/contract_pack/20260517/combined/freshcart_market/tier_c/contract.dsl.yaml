dsl_version: "3.0.0"

app:
  id: freshcart_market_tier_c
  name: FreshCart Market Tier C
  capability: cold_chain_grocery_operations

x-derived:
  derive_cart_count: &derive_cart_count
    op: equals_length
    path: cart_count
    source_path: cart_items
  derive_cart_subtotal: &derive_cart_subtotal
    op: equals_sum
    path: cart_subtotal
    source_path: cart_items
    field: line_total
  derive_cold_chain_count: &derive_cold_chain_count
    op: equals_count_where
    path: cold_chain_count
    source_path: cart_items
    where:
      - {op: equals, field: cold_chain, value: true}
  derive_restricted_count: &derive_restricted_count
    op: equals_count_where
    path: restricted_count
    source_path: cart_items
    where:
      - {op: equals, field: restricted, value: true}
  derive_service_fee: &derive_service_fee
    op: equals_piecewise_linear
    path: service_fee
    cases:
      - when: [{op: relation, path: cart_count, operator: ">=", value: 1}]
        formula: {constant: 900}
    default: {constant: 0}
  derive_delivery_fee: &derive_delivery_fee
    op: equals_piecewise_linear
    path: delivery_fee
    cases:
      - when: [{op: relation, path: cart_count, operator: "==", value: 0}]
        formula: {constant: 0}
      - when: [{op: relation, path: cart_subtotal, operator: ">=", value: 70000}]
        formula: {constant: 0}
      - when: [{op: relation, path: cart_subtotal, operator: ">=", value: 40000}]
        formula: {constant: 1500}
      - when: [{op: relation, path: cart_subtotal, operator: ">=", value: 25000}]
        formula: {constant: 2500}
    default: {constant: 3500}
  derive_packaging_fee: &derive_packaging_fee
    op: equals_piecewise_linear
    path: packaging_fee
    cases:
      - when: [{op: relation, path: cold_chain_count, operator: ">=", value: 3}]
        formula: {constant: 4500}
      - when: [{op: relation, path: cold_chain_count, operator: ">=", value: 1}]
        formula: {constant: 2500}
    default: {constant: 0}
  derive_order_total: &derive_order_total
    op: equals_linear
    path: order_total
    terms:
      - {path: cart_subtotal}
      - {path: delivery_fee}
      - {path: packaging_fee}
      - {path: service_fee}
      - {path: rush_surcharge}
      - {path: coupon_credit, multiplier: -1}
      - {path: wallet_credit, multiplier: -1}
      - {path: substitution_credit, multiplier: -1}
  derive_service_call_count: &derive_service_call_count
    op: equals_length
    path: service_call_count
    source_path: __services.calls
  derive_coupon_call_count: &derive_coupon_call_count
    op: equals_count_where
    path: coupon_call_count
    source_path: __services.calls
    where:
      - {op: equals, field: service, value: coupon_validate}
  derive_wallet_call_count: &derive_wallet_call_count
    op: equals_count_where
    path: wallet_call_count
    source_path: __services.calls
    where:
      - {op: equals, field: service, value: wallet_redeem}
  derive_slot_call_count: &derive_slot_call_count
    op: equals_count_where
    path: slot_call_count
    source_path: __services.calls
    where:
      - {op: equals, field: service, value: slot_quote}
  derive_compliance_call_count: &derive_compliance_call_count
    op: equals_count_where
    path: compliance_call_count
    source_path: __services.calls
    where:
      - {op: equals, field: service, value: compliance_check}
  derive_audit_count: &derive_audit_count
    op: equals_length
    path: audit_count
    source_path: order_audit
  derive_ticket_count: &derive_ticket_count
    op: equals_length
    path: ticket_count
    source_path: support_tickets

runtime:
  target: web
  start_url: /#/market

  state_probe:
    kind: javascript
    expression: window.__DETOX_STATE__

  pages:
    market:
      path: /#/market
      purpose: Cold-chain grocery catalog with vendor filters and item-level risk metadata.
    basket:
      path: /#/basket
      purpose: Basket review, preparation services, substitutions, and removals.
    checkout:
      path: /#/checkout
      purpose: Coupon, wallet, slot quote, rush fulfillment, and checkout validation.
    orders:
      path: /#/orders
      purpose: Staff fulfillment, compliance review, manager approval, and dispatch.
    support:
      path: /#/support
      purpose: Post-order support tickets and staff resolution workflow.

  session:
    role_path: active_role
    roles: [customer, staff, manager]

  persistence:
    reload:
      scope: local_storage
      paths:
        - current_page
        - active_role
        - products
        - current_vendor
        - visible_products
        - cart_items
        - cart_count
        - cart_subtotal
        - cold_chain_count
        - restricted_count
        - delivery_fee
        - packaging_fee
        - service_fee
        - order_total
        - rush_enabled
        - rush_surcharge
        - substitution_opt_in
        - substitution_credit
        - coupon_code
        - coupon_credit
        - coupon_status
        - wallet_balance
        - wallet_credit
        - service_call_count
        - coupon_call_count
        - wallet_call_count
        - slot_call_count
        - compliance_call_count
        - delivery_slot
        - slot_status
        - customer_name
        - customer_phone
        - validation_errors
        - order_placed
        - order_id
        - order_history
        - review_requested
        - review_status
        - fulfillment_picked
        - cold_chain_sealed
        - quality_checked
        - fulfillment_dispatched
        - checklist_count
        - support_issue
        - support_tickets
        - ticket_count
        - ticket_status
        - order_audit
        - audit_count
        - last_action

  services:
    coupon_validate:
      endpoint: /api/coupon
      method: GET
      responses:
        - id: cold3000
          match:
            query:
              code: COLD3000
          status: 200
          json:
            valid: true
            credit: 3000
            status: applied
        - id: vip7000
          match:
            query:
              code: VIP7000
          status: 200
          json:
            valid: true
            credit: 7000
            status: applied
        - id: invalid
          match:
            query:
              code: BADCODE
          status: 200
          json:
            valid: false
            credit: 0
            status: rejected
    wallet_redeem:
      endpoint: /api/wallet
      method: GET
      responses:
        - id: redeem
          match:
            query:
              action: REDEEM
          status: 200
          json:
            credit: 6000
            balance_delta: -6000
            status: redeemed
    slot_quote:
      endpoint: /api/slot
      method: GET
      responses:
        - id: early
          match:
            query:
              slot: early
          status: 200
          json:
            slot: early
            status: confirmed
            cold_chain_capacity: true
        - id: green
          match:
            query:
              slot: green
          status: 200
          json:
            slot: green
            status: confirmed
            cold_chain_capacity: true
        - id: late
          match:
            query:
              slot: late
          status: 200
          json:
            slot: late
            status: confirmed
            cold_chain_capacity: true
    compliance_check:
      endpoint: /api/compliance
      method: GET
      responses:
        - id: restricted_review
          match:
            query:
              risk: restricted
          status: 200
          json:
            status: pending
            requires_manager: true

  tables:
    product_grid:
      selector: '[data-testid="product-grid"]'
      row_selector: '[data-testid="product-row"]'
      row_id_attribute: data-product-id
      source_path: visible_products
      row_id_field: id
      columns:
        name:
          selector: '[data-col="name"]'
          state_field: name
        vendor:
          selector: '[data-col="vendor"]'
          state_field: vendor
        price:
          selector: '[data-col="price"]'
          state_field: price
        temp_band:
          selector: '[data-col="temp-band"]'
          state_field: temp_band
    basket_grid:
      selector: '[data-testid="basket-grid"]'
      row_selector: '[data-testid="basket-row"]'
      row_id_attribute: data-item-id
      source_path: cart_items
      row_id_field: product_id
      columns:
        name:
          selector: '[data-col="name"]'
          state_field: name
        quantity:
          selector: '[data-col="quantity"]'
          state_field: quantity
        line_total:
          selector: '[data-col="line-total"]'
          state_field: line_total
        temp_band:
          selector: '[data-col="temp-band"]'
          state_field: temp_band
        preparation:
          selector: '[data-col="preparation"]'
          state_field: preparation

