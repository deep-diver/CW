dsl_version: "3.0.0"

app:
  id: campus_registrar_command_tier_b
  name: Campus Registrar Command Tier B
  capability: degree_clearance_operations
  ui_ux_brief: |
    Campus Registrar Command Tier B should look unmistakably harder than Tier A
    in a desktop screenshot. The product should read as a registrar clearance
    operations center, not a student self-service cart: dense at-risk student
    queue, section/time-conflict matrix, credit load ledger, transfer-credit
    intake, petition stack, bursar/advisor/registrar role gates, waitlist
    lane, release ledger, and audit trail should all be visible. Use an
    academic operations language with parchment-white work surfaces, deep
    registrar green, navy command rails, red/amber risk chips, transcript-like
    tables, compact schedule cells, and authoritative institutional controls.
    Avoid travel cards, media calendars, grocery checkout, clinical command
    colors, or a bare state debugger.

runtime:
  target: web
  start_url: /#/command
  state_probe:
    kind: javascript
    expression: window.__DETOX_STATE__
  pages:
    command:
      path: /#/command
      purpose: At-risk student queue, role controls, and current clearance snapshot.
    matrix:
      path: /#/matrix
      purpose: Course section matrix, plan rows, credits, and time-conflict tools.
    petitions:
      path: /#/petitions
      purpose: Financial hold, advisor petition, transfer upload, and waitlist workflow.
    clearance:
      path: /#/clearance
      purpose: Registrar release ledger and audit trail.
  session:
    role_path: active_role
    roles: [student, advisor, bursar, registrar]
  persistence:
    reload:
      scope: local_storage
      paths:
        - current_page
        - active_role
        - students
        - visible_students
        - current_filter
        - sections
        - visible_sections
        - selected_section_group
        - selected_student_id
        - selected_student_name
        - selected_student_status
        - selected_student_risk
        - selected_student_hold
        - selected_student_credits_completed
        - selected_section_id
        - selected_section_code
        - selected_section_title
        - selected_section_slot
        - selected_section_credits
        - plan_rows
        - plan_count
        - planned_credit_total
        - conflict_status
        - conflict_count
        - prereq_status
        - financial_hold_status
        - billing_status
        - transfer_rows
        - transfer_count
        - last_transfer_file
        - waitlist_rows
        - waitlist_count
        - petition_status
        - petition_note
        - advisor_status
        - registrar_status
        - clearance_status
        - release_rows
        - release_count
        - audit_log
        - audit_count
        - denied_count
        - validation_errors
        - last_action

  tables:
    student_queue:
      selector: '[data-testid="student-queue"]'
      row_selector: '[data-testid="student-row"]'
      row_id_attribute: data-student-id
      source_path: visible_students
      row_id_field: id
      columns:
        name: {selector: '[data-col="name"]', state_field: name}
        year: {selector: '[data-col="year"]', state_field: year}
        status: {selector: '[data-col="status"]', state_field: status}
        risk: {selector: '[data-col="risk"]', state_field: risk}
        hold: {selector: '[data-col="hold"]', state_field: hold}
        credits_completed: {selector: '[data-col="credits_completed"]', state_field: credits_completed}
    section_matrix:
      selector: '[data-testid="section-matrix"]'
      row_selector: '[data-testid="section-row"]'
      row_id_attribute: data-section-id
      source_path: visible_sections
      row_id_field: id
      columns:
        code: {selector: '[data-col="code"]', state_field: code}
        title: {selector: '[data-col="title"]', state_field: title}
        group: {selector: '[data-col="group"]', state_field: group}
        credits: {selector: '[data-col="credits"]', state_field: credits}
        slot: {selector: '[data-col="slot"]', state_field: slot}
        seat_state: {selector: '[data-col="seat_state"]', state_field: seat_state}
    plan_grid:
      selector: '[data-testid="plan-grid"]'
      row_selector: '[data-testid="plan-row"]'
      row_id_attribute: data-plan-id
      source_path: plan_rows
      row_id_field: id
      columns:
        code: {selector: '[data-col="code"]', state_field: code}
        title: {selector: '[data-col="title"]', state_field: title}
        slot: {selector: '[data-col="slot"]', state_field: slot}
        credits: {selector: '[data-col="credits"]', state_field: credits}
        status: {selector: '[data-col="status"]', state_field: status}
    transfer_grid:
      selector: '[data-testid="transfer-grid"]'
      row_selector: '[data-testid="transfer-row"]'
      row_id_attribute: data-transfer-id
      source_path: transfer_rows
      row_id_field: id
      columns:
        source: {selector: '[data-col="source"]', state_field: source}
        course: {selector: '[data-col="course"]', state_field: course}
        credits: {selector: '[data-col="credits"]', state_field: credits}
        status: {selector: '[data-col="status"]', state_field: status}
    waitlist_grid:
      selector: '[data-testid="waitlist-grid"]'
      row_selector: '[data-testid="waitlist-row"]'
      row_id_attribute: data-waitlist-id
      source_path: waitlist_rows
      row_id_field: id
      columns:
        student: {selector: '[data-col="student"]', state_field: student}
        section: {selector: '[data-col="section"]', state_field: section}
        position: {selector: '[data-col="position"]', state_field: position}
        status: {selector: '[data-col="status"]', state_field: status}
    clearance_grid:
      selector: '[data-testid="clearance-grid"]'
      row_selector: '[data-testid="clearance-row"]'
      row_id_attribute: data-release-id
      source_path: release_rows
      row_id_field: id
      columns:
        student: {selector: '[data-col="student"]', state_field: student}
        section: {selector: '[data-col="section"]', state_field: section}
        role: {selector: '[data-col="role"]', state_field: role}
        status: {selector: '[data-col="status"]', state_field: status}
    audit_grid:
      selector: '[data-testid="audit-grid"]'
      row_selector: '[data-testid="audit-row"]'
      row_id_attribute: data-audit-id
      source_path: audit_log
      row_id_field: id
      columns:
        event: {selector: '[data-col="event"]', state_field: event}
        actor: {selector: '[data-col="actor"]', state_field: actor}
        status: {selector: '[data-col="status"]', state_field: status}

