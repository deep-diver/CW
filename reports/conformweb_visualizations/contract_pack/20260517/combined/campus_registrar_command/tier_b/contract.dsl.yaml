      click:
        effects:
          - {op: equals, path: selected_section_id, value: SEC-MATH-342}
          - {op: equals, path: selected_section_code, value: MATH 342}
          - {op: equals, path: selected_section_title, value: Probability Lab}
          - {op: equals, path: selected_section_slot, value: MW 09:00}
          - {op: equals, path: selected_section_credits, value: 4}
          - {op: equals, path: last_action, value: select_section}
  select_des310_button:
    kind: button
    selector: '[data-testid="select-SEC-DES-310"]'
    page: matrix
    actions:
      click:
        effects:
          - {op: equals, path: selected_section_id, value: SEC-DES-310}
          - {op: equals, path: selected_section_code, value: DES 310}
          - {op: equals, path: selected_section_title, value: Studio Intensive}
          - {op: equals, path: selected_section_slot, value: TR 14:00}
          - {op: equals, path: selected_section_credits, value: 3}
          - {op: equals, path: last_action, value: select_section}

  add_selected_section_button:
    kind: button
    selector: '[data-testid="add-selected-section"]'
    page: matrix
    actions:
      click:
        preconditions:
          - {op: one_of, path: selected_section_id, values: [SEC-CS-401, SEC-MATH-342, SEC-DES-310]}
        effects:
          - {op: appended_object, path: plan_rows, value: {id: {from_path: selected_section_id}, code: {from_path: selected_section_code}, title: {from_path: selected_section_title}, slot: {from_path: selected_section_slot}, credits: {from_path: selected_section_credits}, status: planned}}
          - *derive_plan_count
          - {op: changed_by_path, path: planned_credit_total, by_path: selected_section_credits}
          - {op: equals, path: petition_status, value: open}
          - {op: equals, path: last_action, value: add_selected_section}

  detect_conflict_button:
    kind: button
    selector: '[data-testid="detect-conflict"]'
    page: matrix
    actions:
      click:
        effects:
          - {op: equals, path: conflict_status, value: conflict}
          - {op: equals, path: conflict_count, value: 1}
          - {op: equals, path: last_action, value: detect_conflict}
  remove_math_conflict_button:
    kind: button
    selector: '[data-testid="remove-math-conflict"]'
    page: matrix
    actions:
      click:
        effects:
          - {op: removed_first_where, path: plan_rows, where: [{op: equals, field: id, value: SEC-MATH-342}]}
          - {op: equals, path: plan_count, value: 1}
          - {op: equals, path: planned_credit_total, value: 4}
          - {op: equals, path: conflict_status, value: resolved}
          - {op: equals, path: conflict_count, value: 0}
          - {op: equals, path: last_action, value: remove_math_conflict}

  petition_note_input:
    kind: input
    selector: '[data-testid="petition-note"]'
    page: petitions
    actions:
      fill:
        effects:
          - {op: equals_normalized, path: petition_note, value_from: input.value, normalizers: [trim, collapse_whitespace]}
          - {op: equals, path: last_action, value: edit_petition_note}
  transfer_upload_input:
    kind: input
    selector: '[data-testid="transfer-upload"]'
    page: petitions
    actions:
      upload:
        file_schema:
          format: csv
          columns:
            - {name: id, type: string}
            - {name: source, type: string}
            - {name: course, type: string}
            - {name: credits, type: string}
            - {name: status, type: string}
        effects:
          - {op: equals, path: transfer_rows, value_from: input.rows}
          - *derive_transfer_count
          - {op: equals, path: last_transfer_file, value_from: input.file.name}
          - {op: equals, path: last_action, value: upload_transfer}

  finance_clear_button:
    kind: button
    selector: '[data-testid="finance-clear"]'
    page: petitions
    actions:
      click:
        allowed_roles: [bursar]
        effects:
          - {op: equals, path: financial_hold_status, value: cleared}
          - {op: equals, path: billing_status, value: cleared}
          - {op: equals, path: last_action, value: finance_clear}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_bursar}

  advisor_approve_button:
    kind: button
    selector: '[data-testid="advisor-approve"]'
    page: petitions
    actions:
      click:
        allowed_roles: [advisor]
        preconditions:
          - {op: relation, path: plan_count, operator: ">", value: 0}
        effects:
          - {op: equals, path: advisor_status, value: approved}
          - {op: equals, path: petition_status, value: advisor_approved}
          - {op: appended_object, path: audit_log, value: {id: AUD-ADVISOR, event: advisor_approval, actor: advisor, status: approved}}
          - *derive_audit_count
          - {op: equals, path: last_action, value: advisor_approve}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_advisor}

  join_studio_waitlist_button:
    kind: button
    selector: '[data-testid="join-studio-waitlist"]'
    page: petitions
    actions:
      click:
        preconditions:
          - {op: one_of, path: selected_section_id, values: [SEC-DES-310]}
        effects:
          - {op: appended_object, path: waitlist_rows, value: {id: WAIT-DES-310, student: {from_path: selected_student_name}, section: DES 310, position: 4, status: active}}
          - *derive_waitlist_count
          - {op: equals, path: petition_status, value: waitlisted}
          - {op: equals, path: last_action, value: join_studio_waitlist}

  registrar_release_button:
    kind: button
    selector: '[data-testid="registrar-release"]'
    page: clearance
    actions:
      click:
        allowed_roles: [registrar]
        preconditions:
          - {op: one_of, path: advisor_status, values: [approved]}
          - {op: one_of, path: financial_hold_status, values: [cleared]}
          - {op: one_of, path: conflict_status, values: [none, resolved]}
        effects:
          - {op: equals, path: clearance_status, value: released}
          - {op: equals, path: registrar_status, value: released}
          - {op: equals, path: petition_status, value: released}
          - {op: appended_object, path: release_rows, value: {id: REL-001, student: {from_path: selected_student_name}, section: {from_path: selected_section_code}, role: registrar, status: released}}
          - *derive_release_count
          - {op: appended_object, path: audit_log, value: {id: AUD-REGISTRAR, event: registrar_release, actor: registrar, status: released}}
          - *derive_audit_count
          - {op: equals, path: last_action, value: registrar_release}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_registrar}
