    tier: upload
    difficulty: D
    steps:
      - do: reset_button.click
      - do: select_iona_button.click
      - do: go_finance_button.click
      - do: reconciliation_upload_input.upload
        input: *bad_reconciliation_input
        expect:
          - {op: equals, path: reconciliation_count, value: 4}
          - {op: equals, path: mismatch_count, value: 2}
          - {op: equals, path: reconciliation_status, value: uploaded}
      - do: role_registrar_button.click
      - do: lock_wave_reconciliation_button.click
        mode: rejected
        expect:
          - {op: equals, path: reconciliation_status, value: blocked}
          - {op: equals, path: validation_errors, value: {reconciliation: "Resolve senate worksheet mismatches"}}
      - do: reconciliation_upload_input.upload
        input: *good_reconciliation_input
      - do: lock_wave_reconciliation_button.click
        expect:
          - {op: equals, path: reconciliation_status, value: locked}
          - {op: equals, path: mismatch_count, value: 0}
          - {op: equals, path: readiness_score, value: 78}
          - {op: equals, path: validation_errors, value: {}}
      - table: reconciliation_grid
        expect_order: [RC-CAP, RC-RES, RC-HON, RC-NAME]
        expect_row_count: 4

