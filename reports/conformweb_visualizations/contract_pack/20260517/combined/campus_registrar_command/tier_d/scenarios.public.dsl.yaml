          - {op: equals, path: denied_count, value: 1}
          - {op: equals, path: quorum_status, value: idle}
      - do: role_dean_button.click
      - do: certify_committee_quorum_button.click
        expect:
          - {op: equals, path: quorum_status, value: certified}
          - {op: equals, path: vote_status, value: certified}
          - {op: equals, path: readiness_score, value: 84}
      - table: committee_grid
        expect_order: [V-01, V-02, V-03, V-04, V-05]
        expect_row_count: 5

  - id: public_12_senate_provost_release_wave_journey
