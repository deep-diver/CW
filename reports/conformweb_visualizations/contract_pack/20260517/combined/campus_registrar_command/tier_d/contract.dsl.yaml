    transcript_grid:
      selector: '[data-testid="transcript-grid"]'
      row_selector: '[data-testid="transcript-row"]'
      row_id_attribute: data-transcript-id
      source_path: transcript_rows
      row_id_field: id
      columns:
        course: {selector: '[data-col="course"]', state_field: course}
        credits: {selector: '[data-col="credits"]', state_field: credits}
        residency: {selector: '[data-col="residency"]', state_field: residency}
