dsl_version: "3.0.0"

app:
  id: campus_registrar_command_tier_d
  name: Campus Registrar Command Tier D
  capability: multi_authority_graduation_wave_command
  ui_ux_brief: |
    Campus Registrar Command Tier D should look like a severe institutional
    graduation-certification command floor, not a bigger copy of Tier C. A
    screenshot should immediately feel harder: multi-candidate risk stack,
    degree graph, policy epoch lock, capstone seat arbitration, transcript
    bundle intake, articulation crosswalk, identity/name variance service,
    bursar bundle service, diploma-lane quote service, worksheet reconciliation,
    committee vote import, senate docket, provost counterseal, commencement
    wave manifest, accreditation freeze notice, blocker ledger, computed
    readiness score, and audit timeline should all be visible as one dense
    operating system. Use a polished registrar operations palette with carbon
    ink, parchment gridlines, garnet alerts, emerald clearance states, brass
    seal accents, violet provost tags, compact matrix tables, rails, gauges,
    and document-like panels. Avoid landing pages, generic dashboards, state
    debuggers, plain tables, travel/media/clinical/grocery motifs, or decorative
    hero art. The UI should feel like a product used by analysts, advisors,
    bursars, registrars, deans, and provost staff during final graduation wave
    certification.

runtime:
  target: web
  start_url: /#/cockpit
  state_probe:
    kind: javascript
    expression: window.__DETOX_STATE__
  pages:
    cockpit:
      path: /#/cockpit
      purpose: Candidate risk stack, selected dossier header, role console, and blocker overview.
    curriculum:
      path: /#/curriculum
      purpose: Degree audit graph, policy epoch lock, capstone seat plan, and collision resolution.
    dossier:
      path: /#/dossier
      purpose: Transcript bundle upload, articulation crosswalk upload, equivalency certification, and exception dossier.
    finance:
      path: /#/finance
      purpose: Identity/name variance service, bursar bundle service, diploma-lane quote, and worksheet reconciliation.
    senate:
      path: /#/senate
      purpose: Committee vote import, quorum certification, senate docket, and provost counterseal.
    release:
      path: /#/release
      purpose: Commencement wave sealing, diploma manifest publication, accreditation freeze, blockers, and audit log.
  session:
    role_path: active_role
    roles: [analyst, advisor, bursar, registrar, dean, provost]
  persistence:
    reload:
      scope: local_storage
      paths:
        - current_page
        - active_role
        - candidates
        - visible_candidates
        - current_filter
        - selected_candidate_id
        - selected_candidate_name
        - selected_program
        - selected_cohort
        - selected_risk
        - selected_catalog_version
        - selected_honors_track
        - selected_name_variance
        - policy_epoch_input
        - policy_epoch_status
        - audit_rows
        - audit_count
        - deficiency_count
        - shadow_gap_count
        - audit_status
        - plan_rows
        - plan_count
        - plan_credit_total
        - collision_count
        - seat_waitlist_count
        - plan_status
        - transcript_rows
        - transcript_count
        - transcript_credit_total
        - transcript_residency_total
        - last_transcript_file
        - crosswalk_rows
        - crosswalk_count
        - crosswalk_status
        - exception_rows
        - exception_count
        - exception_status
        - identity_status
        - name_match_status
        - identity_trace_id
        - finance_status
        - sap_status
        - balance_status
        - bursar_trace_id
        - diploma_quote_status
        - diploma_lane
        - diploma_trace_id
        - reconciliation_rows
        - reconciliation_count
        - mismatch_count
        - reconciliation_status
        - last_reconciliation_file
        - committee_rows
        - committee_count
        - affirm_vote_count
        - oppose_vote_count
        - abstain_vote_count
        - quorum_status
        - vote_status
        - senate_docket_status
        - senate_packet_hash
        - provost_counterseal_status
        - provost_token
        - release_wave_status
        - release_hash
        - diploma_manifest_status
        - diploma_manifest_hash
        - release_rows
        - release_count
        - freeze_reason
        - event_notice_count
        - blocker_rows
        - open_blockers
        - readiness_score
        - audit_log
        - audit_log_count
        - service_call_count
        - identity_call_count
        - bursar_call_count
        - diploma_call_count
        - denied_count
        - validation_errors
        - last_action
  services:
    identity_verify:
      endpoint: /api/identity-verify
      method: GET
      responses:
        - id: iona_name_variance
          match: {query: {candidate: CAND-IONA}}
          status: 200
          json: {identity: review, name_match: variance, trace: IDV-IONA-773}
        - id: marek_match
          match: {query: {candidate: CAND-MAREK}}
          status: 200
          json: {identity: verified, name_match: match, trace: IDV-MAREK-118}
    bursar_bundle:
      endpoint: /api/bursar-bundle
      method: GET
      responses:
        - id: iona_clear
          match: {query: {candidate: CAND-IONA}}
          status: 200
          json: {finance: cleared, sap: clear, balance: zero_balance, trace: BUR-IONA-551}
        - id: marek_lab_hold
          match: {query: {candidate: CAND-MAREK}}
          status: 200
          json: {finance: blocked, sap: clear, balance: lab_fee_hold, trace: BUR-MAREK-402}
    diploma_lane_quote:
      endpoint: /api/diploma-lane
      method: GET
      responses:
        - id: iona_rush
          match: {query: {candidate: CAND-IONA}}
          status: 200
          json: {lane: rush-audit, trace: DPL-IONA-016}
        - id: marek_standard
          match: {query: {candidate: CAND-MAREK}}
          status: 200
          json: {lane: standard, trace: DPL-MAREK-044}
  events:
    accreditation_freeze:
      payload: {reason: accreditation_audit}
      preconditions:
        - {op: one_of, path: release_wave_status, values: [sealed]}
      effects:
        - {op: equals, path: release_wave_status, value: frozen}
        - {op: equals, path: freeze_reason, value: accreditation_audit}
        - {op: changed_by, path: event_notice_count, by: 1}
        - {op: equals, path: readiness_score, value: 91}
        - {op: updated_object_fields, path: validation_errors, updates: {accreditation: "Wave frozen for accreditation_audit"}}
        - {op: equals, path: audit_log, value: [
            {id: AUD-SENATE, event: senate_docket, role: dean, status: ready},
            {id: AUD-PROVOST, event: provost_counterseal, role: provost, status: sealed},
            {id: AUD-WAVE, event: release_wave, role: registrar, status: sealed},
            {id: AUD-FREEZE, event: accreditation_freeze, role: system, status: accreditation_audit}
          ]}
        - {op: equals_length, path: audit_log_count, source_path: audit_log}
        - {op: equals, path: last_action, value: accreditation_freeze}
    name_variance_escalation:
      payload: {reason: late_alias}
      preconditions:
        - {op: one_of, path: identity_status, values: [verified]}
      effects:
        - {op: equals, path: identity_status, value: review}
        - {op: equals, path: name_match_status, value: escalated}
        - {op: changed_by, path: event_notice_count, by: 1}
        - {op: updated_object_fields, path: validation_errors, updates: {identity: "Late alias review required"}}
        - {op: equals, path: last_action, value: name_variance_escalation}
  tables:
    candidate_queue:
      selector: '[data-testid="candidate-queue"]'
      row_selector: '[data-testid="candidate-row"]'
      row_id_attribute: data-candidate-id
      source_path: visible_candidates
      row_id_field: id
      columns:
        name: {selector: '[data-col="name"]', state_field: name}
        program: {selector: '[data-col="program"]', state_field: program}
        cohort: {selector: '[data-col="cohort"]', state_field: cohort}
        risk: {selector: '[data-col="risk"]', state_field: risk}
        catalog: {selector: '[data-col="catalog"]', state_field: catalog}
        variance: {selector: '[data-col="variance"]', state_field: variance}
    audit_grid:
      selector: '[data-testid="audit-grid"]'
      row_selector: '[data-testid="audit-row"]'
      row_id_attribute: data-audit-id
      source_path: audit_rows
      row_id_field: id
      columns:
        area: {selector: '[data-col="area"]', state_field: area}
        required: {selector: '[data-col="required"]', state_field: required}
        earned: {selector: '[data-col="earned"]', state_field: earned}
        shadow: {selector: '[data-col="shadow"]', state_field: shadow}
        status: {selector: '[data-col="status"]', state_field: status}
    plan_grid:
      selector: '[data-testid="plan-grid"]'
      row_selector: '[data-testid="plan-row"]'
      row_id_attribute: data-plan-id
      source_path: plan_rows
      row_id_field: id
      columns:
        code: {selector: '[data-col="code"]', state_field: code}
        slot: {selector: '[data-col="slot"]', state_field: slot}
        seat: {selector: '[data-col="seat"]', state_field: seat}
