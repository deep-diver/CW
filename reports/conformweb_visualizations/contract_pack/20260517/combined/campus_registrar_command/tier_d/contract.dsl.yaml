          - *derive_reconciliation_count
          - *derive_mismatch_count
          - {op: equals, path: last_reconciliation_file, value_from: input.file.name}
          - {op: equals, path: reconciliation_status, value: uploaded}
          - {op: equals, path: last_action, value: upload_reconciliation}
  lock_wave_reconciliation_button:
    kind: button
    selector: '[data-testid="lock-wave-reconciliation"]'
    page: finance
    actions:
      click:
        allowed_roles: [registrar]
        rejected_when:
          - {op: relation, path: mismatch_count, operator: ">", value: 0}
        rejected_effects:
          - {op: equals, path: reconciliation_status, value: blocked}
          - {op: updated_object_fields, path: validation_errors, updates: {reconciliation: "Resolve senate worksheet mismatches"}}
          - {op: equals, path: last_action, value: reconciliation_mismatch}
        effects:
          - {op: equals, path: reconciliation_status, value: locked}
          - {op: equals, path: mismatch_count, value: 0}
          - {op: removed_object_fields, path: validation_errors, fields: [reconciliation]}
          - {op: equals, path: readiness_score, value: 78}
          - {op: equals, path: last_action, value: lock_wave_reconciliation}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_registrar}
  committee_upload_input:
    kind: input
    selector: '[data-testid="committee-upload"]'
    page: senate
    actions:
      upload:
        file_schema:
          format: csv
          columns:
            - {name: id, type: string}
            - {name: member, type: string}
            - {name: role, type: string}
            - {name: vote, type: string}
            - {name: note, type: string}
        effects:
          - {op: equals, path: committee_rows, value_from: input.rows}
          - *derive_committee_count
          - *derive_affirm_vote_count
          - *derive_oppose_vote_count
          - *derive_abstain_vote_count
          - {op: equals, path: vote_status, value: uploaded}
          - {op: equals, path: last_action, value: upload_committee_votes}
  certify_committee_quorum_button:
    kind: button
    selector: '[data-testid="certify-committee-quorum"]'
    page: senate
    actions:
      click:
        allowed_roles: [dean]
        rejected_when:
          - {op: relation, path: affirm_vote_count, operator: "<", value: 4}
        rejected_effects:
          - {op: equals, path: quorum_status, value: blocked}
          - {op: updated_object_fields, path: validation_errors, updates: {committee: "Four affirm votes required"}}
          - {op: equals, path: last_action, value: quorum_blocked}
        effects:
          - {op: equals, path: quorum_status, value: certified}
          - {op: equals, path: vote_status, value: certified}
          - {op: removed_object_fields, path: validation_errors, fields: [committee]}
          - {op: equals, path: readiness_score, value: 84}
          - {op: equals, path: last_action, value: certify_committee_quorum}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_dean}
  prepare_senate_docket_button:
    kind: button
    selector: '[data-testid="prepare-senate-docket"]'
    page: senate
    actions:
      click:
        allowed_roles: [dean]
        rejected_when:
          - {op: not_one_of, path: quorum_status, values: [certified]}
        rejected_effects:
          - {op: equals, path: senate_docket_status, value: blocked}
          - {op: updated_object_fields, path: validation_errors, updates: {senate: "Committee, reconciliation, and finance gates required"}}
          - {op: equals, path: last_action, value: senate_requires_gates}
        effects:
          - {op: equals, path: senate_docket_status, value: ready}
          - {op: equals_template, path: senate_packet_hash, template: "SEN-{selected_candidate_id}-V{affirm_vote_count}-R{reconciliation_count}-S{service_call_count}"}
          - {op: equals, path: audit_log, value: [
              {id: AUD-SENATE, event: senate_docket, role: dean, status: ready}
            ]}
          - *derive_audit_log_count
          - {op: removed_object_fields, path: validation_errors, fields: [senate]}
          - {op: equals, path: readiness_score, value: 90}
          - {op: equals, path: last_action, value: prepare_senate_docket}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_dean}
  provost_counterseal_button:
    kind: button
    selector: '[data-testid="provost-counterseal"]'
    page: senate
    actions:
      click:
        allowed_roles: [provost]
        rejected_when:
          - {op: not_one_of, path: senate_docket_status, values: [ready]}
        rejected_effects:
          - {op: equals, path: provost_counterseal_status, value: blocked}
          - {op: equals, path: last_action, value: provost_requires_senate}
        effects:
          - {op: equals, path: provost_counterseal_status, value: sealed}
          - {op: equals_template, path: provost_token, template: "PROV-{senate_packet_hash}-{diploma_lane}"}
          - {op: equals, path: audit_log, value: [
              {id: AUD-SENATE, event: senate_docket, role: dean, status: ready},
              {id: AUD-PROVOST, event: provost_counterseal, role: provost, status: sealed}
            ]}
          - *derive_audit_log_count
          - {op: equals, path: readiness_score, value: 94}
          - {op: equals, path: last_action, value: provost_counterseal}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_provost}
  seal_commencement_wave_button:
    kind: button
    selector: '[data-testid="seal-commencement-wave"]'
    page: release
    actions:
      click:
        allowed_roles: [registrar]
        rejected_when:
          - {op: not_one_of, path: provost_counterseal_status, values: [sealed]}
        rejected_effects:
          - {op: equals, path: release_wave_status, value: blocked}
          - {op: updated_object_fields, path: validation_errors, updates: {release: "Provost counterseal required"}}
          - {op: equals, path: last_action, value: release_requires_counterseal}
        effects:
          - {op: equals, path: release_wave_status, value: sealed}
          - {op: equals_template, path: release_hash, template: "WAVE-{selected_candidate_id}-{provost_token}-D{diploma_call_count}"}
          - {op: equals, path: blocker_rows, value: [
              {id: BLK-POLICY, label: Policy epoch locked, owner: registrar, status: cleared},
              {id: BLK-SEATS, label: Seat collisions resolved, owner: analyst, status: cleared},
              {id: BLK-CROSSWALK, label: Articulation crosswalk certified, owner: advisor, status: cleared},
              {id: BLK-EXCEPTION, label: Exception dossier assembled, owner: advisor, status: cleared},
              {id: BLK-IDENTITY, label: Identity variance resolved, owner: registrar, status: cleared},
              {id: BLK-FINANCE, label: Bursar bundle cleared, owner: bursar, status: cleared},
              {id: BLK-RECON, label: Worksheet reconciliation locked, owner: registrar, status: cleared},
              {id: BLK-COMMITTEE, label: Committee quorum certified, owner: dean, status: cleared},
              {id: BLK-SENATE, label: Senate docket prepared, owner: dean, status: cleared},
              {id: BLK-PROVOST, label: Provost counterseal applied, owner: provost, status: cleared},
              {id: BLK-WAVE, label: Commencement wave sealed, owner: registrar, status: cleared}
            ]}
          - {op: equals, path: open_blockers, value: 0}
          - {op: equals, path: release_rows, value: [
              {id: REL-COMM, channel: commencement, batch: WAVE-MAY26-IONA, hash: pending, status: sealed},
              {id: REL-TRANSCRIPT, channel: transcript_archive, batch: WAVE-MAY26-IONA, hash: pending, status: sealed}
            ]}
          - *derive_release_count
          - {op: equals, path: audit_log, value: [
              {id: AUD-SENATE, event: senate_docket, role: dean, status: ready},
              {id: AUD-PROVOST, event: provost_counterseal, role: provost, status: sealed},
              {id: AUD-WAVE, event: release_wave, role: registrar, status: sealed}
            ]}
          - *derive_audit_log_count
          - {op: removed_object_fields, path: validation_errors, fields: [release]}
          - {op: equals, path: readiness_score, value: 100}
          - {op: equals, path: last_action, value: seal_commencement_wave}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_registrar}
  publish_diploma_manifest_button:
    kind: button
    selector: '[data-testid="publish-diploma-manifest"]'
    page: release
    actions:
      click:
        allowed_roles: [registrar]
        rejected_when:
          - {op: not_one_of, path: release_wave_status, values: [sealed]}
        rejected_effects:
          - {op: equals, path: diploma_manifest_status, value: blocked}
          - {op: equals, path: last_action, value: manifest_requires_wave}
        effects:
          - {op: equals, path: diploma_manifest_status, value: queued}
          - {op: equals_template, path: diploma_manifest_hash, template: "DIP-{selected_candidate_id}-{release_hash}-{release_count}"}
          - {op: equals, path: release_rows, value: [
              {id: REL-COMM, channel: commencement, batch: WAVE-MAY26-IONA, hash: "WAVE-CAND-IONA", status: sealed},
              {id: REL-TRANSCRIPT, channel: transcript_archive, batch: WAVE-MAY26-IONA, hash: "WAVE-CAND-IONA", status: queued},
              {id: REL-DIPLOMA, channel: diploma_print, batch: rush-audit, hash: "DIP-CAND-IONA", status: queued}
            ]}
          - *derive_release_count
          - {op: equals, path: last_action, value: publish_diploma_manifest}
        unauthorized_effects:
          - {op: changed_by, path: denied_count, by: 1}
          - {op: equals, path: last_action, value: unauthorized_registrar}
