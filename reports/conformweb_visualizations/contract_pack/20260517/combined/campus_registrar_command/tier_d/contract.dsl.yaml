  plan_count: &derive_plan_count {op: equals_length, path: plan_count, source_path: plan_rows}
  transcript_count: &derive_transcript_count {op: equals_length, path: transcript_count, source_path: transcript_rows}
  transcript_credit_total: &derive_transcript_credit_total {op: equals_sum, path: transcript_credit_total, source_path: transcript_rows, field: credits}
  transcript_residency_total: &derive_transcript_residency_total {op: equals_sum, path: transcript_residency_total, source_path: transcript_rows, field: residency}
  crosswalk_count: &derive_crosswalk_count {op: equals_length, path: crosswalk_count, source_path: crosswalk_rows}
  exception_count: &derive_exception_count {op: equals_length, path: exception_count, source_path: exception_rows}
  reconciliation_count: &derive_reconciliation_count {op: equals_length, path: reconciliation_count, source_path: reconciliation_rows}
  mismatch_count: &derive_mismatch_count {op: equals_count_where, path: mismatch_count, source_path: reconciliation_rows, where: [{op: equals, field: status, value: mismatch}]}
  committee_count: &derive_committee_count {op: equals_length, path: committee_count, source_path: committee_rows}
  affirm_vote_count: &derive_affirm_vote_count {op: equals_count_where, path: affirm_vote_count, source_path: committee_rows, where: [{op: equals, field: vote, value: affirm}]}
  oppose_vote_count: &derive_oppose_vote_count {op: equals_count_where, path: oppose_vote_count, source_path: committee_rows, where: [{op: equals, field: vote, value: oppose}]}
  abstain_vote_count: &derive_abstain_vote_count {op: equals_count_where, path: abstain_vote_count, source_path: committee_rows, where: [{op: equals, field: vote, value: abstain}]}
  release_count: &derive_release_count {op: equals_length, path: release_count, source_path: release_rows}
  audit_log_count: &derive_audit_log_count {op: equals_length, path: audit_log_count, source_path: audit_log}
  service_call_count: &derive_service_call_count {op: equals_length, path: service_call_count, source_path: __services.calls}
  identity_call_count: &derive_identity_call_count {op: equals_count_where, path: identity_call_count, source_path: __services.calls, where: [{op: equals, field: service, value: identity_verify}]}
  bursar_call_count: &derive_bursar_call_count {op: equals_count_where, path: bursar_call_count, source_path: __services.calls, where: [{op: equals, field: service, value: bursar_bundle}]}
  diploma_call_count: &derive_diploma_call_count {op: equals_count_where, path: diploma_call_count, source_path: __services.calls, where: [{op: equals, field: service, value: diploma_lane_quote}]}

