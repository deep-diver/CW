dsl_version: "3.0.0"

app:
  id: campus_registrar_command_tier_c
  name: Campus Registrar Command Tier C
  capability: graduation_clearance_reconciliation_control
  ui_ux_brief: |
    Campus Registrar Command Tier C should look like an institutional graduation
    clearance war room, not a course planner or a simple registrar table.
    A screenshot should immediately read as harder than Tier B: candidate risk
    queue, degree audit graph, catalog-version lock, schedule collision matrix,
    transfer articulation upload, equivalency staging, residency credit counter,
    advisor exception packet, bursar clearance rail, worksheet reconciliation
    mismatch board, dean vote, registrar seal, release manifest, blockers, and
    audit trail should all feel coordinated. Use a serious academic operations
    palette with ivory parchment, ink navy, registrar green, oxblood blockers,
    brass seal accents, transcript grids, graph-like rails, compact gauges, and
    high information density. Avoid travel cards, media switchers, clinical
    floor maps, grocery checkout, or a bare test harness.

runtime:
  target: web
  start_url: /#/command
  state_probe:
    kind: javascript
    expression: window.__DETOX_STATE__
  pages:
    command:
      path: /#/command
      purpose: Candidate risk queue, readiness overview, and role console.
    audit:
      path: /#/audit
      purpose: Degree audit graph, catalog lock, completion plan, and collision resolution.
    articulation:
      path: /#/articulation
      purpose: Transfer CSV intake, equivalency staging, and advisor exception packet.
    reconcile:
      path: /#/reconcile
      purpose: Bursar clearance, graduation worksheet upload, mismatch board, and reconciliation lock.
    clearance:
      path: /#/clearance
      purpose: Dean vote, registrar seal, release manifest, blockers, and audit trail.
  session:
    role_path: active_role
    roles: [analyst, advisor, bursar, registrar, dean]
  persistence:
    reload:
      scope: local_storage
      paths:
        - current_page
        - active_role
        - candidates
        - visible_candidates
        - current_filter
        - selected_candidate_id
        - selected_candidate_name
        - selected_program
        - selected_cohort
        - selected_risk
        - selected_gpa
        - selected_aid_status
        - selected_catalog_version
        - catalog_version_input
        - catalog_lock_status
        - requirement_rows
        - requirement_count
        - deficiency_count
        - audit_status
        - schedule_rows
        - schedule_count
        - schedule_status
        - schedule_credit_total
        - collision_count
        - transfer_rows
        - transfer_count
        - transfer_credit_total
        - last_transfer_file
        - equivalency_rows
        - equivalency_count
        - equivalency_status
        - transfer_applied_credits
        - residency_credit_total
        - exception_rows
        - exception_count
        - exception_packet_status
        - finance_status
        - sap_status
        - balance_status
        - finance_trace_id
        - service_call_count
        - bursar_call_count
        - reconciliation_rows
        - reconciliation_count
        - mismatch_count
        - reconciliation_status
        - dean_vote_status
        - dean_packet_hash
        - registrar_seal_status
        - seal_manifest_hash
        - release_status
        - release_hold_reason
        - release_rows
        - release_count
        - blocker_rows
        - open_blockers
        - readiness_score
        - audit_log
        - audit_count
        - hold_notice_count
        - denied_count
        - validation_errors
        - last_action
  services:
    bursar_clearance:
      endpoint: /api/bursar-clearance
      method: GET
      responses:
        - id: nova_clearance
          match:
            query:
              candidate: CAND-NOVA
          status: 200
          json: {finance: cleared, sap: clear, balance: zero_balance, trace: BUR-NOVA-042}
        - id: orion_hold
          match:
            query:
              candidate: CAND-ORION
          status: 200
          json: {finance: blocked, sap: clear, balance: studio_fee_hold, trace: BUR-ORION-017}
  events:
    senate_hold_notice:
      payload: {reason: ethics_review}
      preconditions:
        - {op: one_of, path: release_status, values: [published]}
      effects:
        - {op: equals, path: release_status, value: on_hold}
        - {op: equals, path: release_hold_reason, value: ethics_review}
        - {op: changed_by, path: hold_notice_count, by: 1}
        - {op: equals, path: readiness_score, value: 86}
        - {op: updated_object_fields, path: validation_errors, updates: {senate: "Senate hold: ethics_review"}}
        - {op: equals, path: audit_log, value: [
            {id: AUD-DEAN, event: dean_vote, role: dean, status: approved},
            {id: AUD-SEAL, event: registrar_seal, role: registrar, status: sealed},
            {id: AUD-REL, event: release_manifest, role: registrar, status: published},
            {id: AUD-HOLD, event: senate_hold_notice, role: senate, status: ethics_review}
          ]}
        - {op: equals_length, path: audit_count, source_path: audit_log}
        - {op: equals, path: last_action, value: senate_hold_notice}
  tables:
    candidate_queue:
      selector: '[data-testid="candidate-queue"]'
      row_selector: '[data-testid="candidate-row"]'
      row_id_attribute: data-candidate-id
      source_path: visible_candidates
      row_id_field: id
      columns:
        name: {selector: '[data-col="name"]', state_field: name}
        program: {selector: '[data-col="program"]', state_field: program}
        cohort: {selector: '[data-col="cohort"]', state_field: cohort}
        risk: {selector: '[data-col="risk"]', state_field: risk}
        gpa: {selector: '[data-col="gpa"]', state_field: gpa}
        aid: {selector: '[data-col="aid"]', state_field: aid}
    requirement_grid:
      selector: '[data-testid="requirement-grid"]'
      row_selector: '[data-testid="requirement-row"]'
      row_id_attribute: data-requirement-id
      source_path: requirement_rows
      row_id_field: id
      columns:
        area: {selector: '[data-col="area"]', state_field: area}
        needed: {selector: '[data-col="needed"]', state_field: needed}
        earned: {selector: '[data-col="earned"]', state_field: earned}
        source: {selector: '[data-col="source"]', state_field: source}
        status: {selector: '[data-col="status"]', state_field: status}
    schedule_grid:
      selector: '[data-testid="schedule-grid"]'
      row_selector: '[data-testid="schedule-row"]'
      row_id_attribute: data-schedule-id
      source_path: schedule_rows
      row_id_field: id
      columns:
        code: {selector: '[data-col="code"]', state_field: code}
        title: {selector: '[data-col="title"]', state_field: title}
        slot: {selector: '[data-col="slot"]', state_field: slot}
        credits: {selector: '[data-col="credits"]', state_field: credits}
        status: {selector: '[data-col="status"]', state_field: status}
    transfer_grid:
      selector: '[data-testid="transfer-grid"]'
      row_selector: '[data-testid="transfer-row"]'
      row_id_attribute: data-transfer-id
      source_path: transfer_rows
      row_id_field: id
      columns:
        course: {selector: '[data-col="course"]', state_field: course}
        credits: {selector: '[data-col="credits"]', state_field: credits}
        residency: {selector: '[data-col="residency"]', state_field: residency}
        status: {selector: '[data-col="status"]', state_field: status}
    equivalency_grid:
      selector: '[data-testid="equivalency-grid"]'
      row_selector: '[data-testid="equivalency-row"]'
