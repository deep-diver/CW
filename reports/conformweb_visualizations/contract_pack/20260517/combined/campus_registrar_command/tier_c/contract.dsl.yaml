x-derived:
  requirement_count: &derive_requirement_count {op: equals_length, path: requirement_count, source_path: requirement_rows}
  schedule_count: &derive_schedule_count {op: equals_length, path: schedule_count, source_path: schedule_rows}
  transfer_count: &derive_transfer_count {op: equals_length, path: transfer_count, source_path: transfer_rows}
  transfer_credit_total: &derive_transfer_credit_total {op: equals_sum, path: transfer_credit_total, source_path: transfer_rows, field: credits}
  equivalency_count: &derive_equivalency_count {op: equals_length, path: equivalency_count, source_path: equivalency_rows}
  exception_count: &derive_exception_count {op: equals_length, path: exception_count, source_path: exception_rows}
  reconciliation_count: &derive_reconciliation_count {op: equals_length, path: reconciliation_count, source_path: reconciliation_rows}
  mismatch_count: &derive_mismatch_count {op: equals_count_where, path: mismatch_count, source_path: reconciliation_rows, where: [{op: equals, field: status, value: mismatch}]}
  release_count: &derive_release_count {op: equals_length, path: release_count, source_path: release_rows}
  audit_count: &derive_audit_count {op: equals_length, path: audit_count, source_path: audit_log}
  service_call_count: &derive_service_call_count {op: equals_length, path: service_call_count, source_path: __services.calls}
  bursar_call_count: &derive_bursar_call_count {op: equals_count_where, path: bursar_call_count, source_path: __services.calls, where: [{op: equals, field: service, value: bursar_clearance}]}

