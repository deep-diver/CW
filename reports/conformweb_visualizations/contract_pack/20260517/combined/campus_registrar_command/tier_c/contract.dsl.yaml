        credits: {selector: '[data-col="credits"]', state_field: credits}
        residency_credits: {selector: '[data-col="residency_credits"]', state_field: residency_credits}
        status: {selector: '[data-col="status"]', state_field: status}
    exception_grid:
      selector: '[data-testid="exception-grid"]'
      row_selector: '[data-testid="exception-row"]'
